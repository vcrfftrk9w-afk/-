name: Umnik APK

# Собирает «Умника» — ИИ-помощника для Android. Готовый APK — во вложении «umnik-apk» у запуска
# (Actions → Umnik APK → последний запуск → Artifacts), картинки экранов из тестов — в «umnik-screens».
on:
  push:
    branches: [main, 'claude/**']
    paths: ['umnik/**', '.github/workflows/umnik-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umnik-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # свой ключ подписи (необязательно): тогда каждый новый APK ставится поверх старого
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.UMNIK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/umnik.keystore"
            echo "UMNIK_KEYSTORE=$RUNNER_TEMP/umnik.keystore" >> "$GITHUB_ENV"
          fi

      - name: Тесты
        run: gradle -p umnik :app:testReleaseUnitTest --no-daemon

      - name: Собрать APK
        env:
          UMNIK_KEYSTORE_PASSWORD: ${{ secrets.UMNIK_KEYSTORE_PASSWORD }}
        run: gradle -p umnik :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Проверить APK
        run: |
          APK=umnik/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" umnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: umnik-apk
          path: umnik.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umnik-screens
          path: umnik/app/build/screens/
          retention-days: 14
