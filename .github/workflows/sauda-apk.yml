name: Sauda APK

# Собирает Android-приложение маркетплейса Sauda (папка market/ внутри WebView) и пакет исходников
# (tools/sauda-pack.js: sauda-source.zip и сайт одним файлом sauda.html).
# Любая ветка — вложения у запуска (Actions → Sauda APK → Artifacts).
# Ветка main — ещё и выпуск «sauda-latest» с постоянными ссылками:
#   https://github.com/<владелец>/<репозиторий>/releases/download/sauda-latest/sauda-source.zip (sauda.html, sauda.apk)
on:
  push:
    paths: ['market/**', 'android-sauda/**', 'supabase/migrations/*_sauda_*.sql', 'tools/sauda-*', 'tests/sauda-*', '.github/workflows/sauda-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sauda-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle -p android-sauda assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Проверить APK
        run: |
          APK=android-sauda/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|js/app.js|js/config.js)'
          cp "$APK" sauda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sauda-apk
          path: sauda.apk
          retention-days: 30

      - name: Собрать пакет исходников
        run: node tools/sauda-pack.js

      - uses: actions/upload-artifact@v4
        with:
          name: sauda-source
          path: |
            dist/sauda/sauda-source.zip
            dist/sauda/sauda.html
          retention-days: 30

      - name: Выложить в Releases → sauda-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sauda-latest --yes --cleanup-tag || true
          gh release create sauda-latest dist/sauda/sauda-source.zip dist/sauda/sauda.html sauda.apk \
            --target "$GITHUB_SHA" --latest=false --title "Sauda — последняя версия" \
            --notes "Собрано из ${GITHUB_SHA::7}. sauda-source.zip — все исходники и инструкция для другого ИИ (README.md, PROMPT-for-AI.txt); sauda.html — сайт одним файлом, открывается двойным щелчком; sauda.apk — Android-приложение."
