<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Бомба Конфетка</title>
<meta name="description" content="Сладкая игра «три в ряд»: взрывай конфеты, собирай комбо, проходи 60 уровней.">
<meta name="theme-color" content="#ff3d8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бомба Конфетка">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff3d8b; --purple:#7b2cff; --gold:#ffc83d; --ink:#3a0a45; --card:#fff6fb;
  --bg1:#ff8fc7; --bg2:#8a5cff; --panel:rgba(60,10,80,.45);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg1:#c43d86; --bg2:#4a2399; } }
:root[data-theme="dark"]{ --bg1:#c43d86; --bg2:#4a2399; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#2a0f4a;font-family:Rubik,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;border:0;cursor:pointer;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 40%),
  radial-gradient(circle at 85% 80%,rgba(255,230,120,.25),transparent 45%),
  linear-gradient(160deg,var(--bg1),var(--bg2));transition:background .6s}
#bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bg img{position:absolute;opacity:.22;animation:floaty linear infinite}
@keyframes floaty{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
.screen.active{display:flex}

/* ---------- buttons ---------- */
.btn{position:relative;padding:14px 34px;border-radius:999px;font-weight:900;font-size:20px;letter-spacing:.5px;color:#fff;
  background:linear-gradient(180deg,#ffd84d,#ff9a1f 60%,#ff6a00);
  box-shadow:0 6px 0 #c24a00,0 10px 20px rgba(80,0,40,.35),inset 0 3px 0 rgba(255,255,255,.6);
  text-shadow:0 2px 0 rgba(150,50,0,.6);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c24a00,0 4px 10px rgba(80,0,40,.35),inset 0 3px 0 rgba(255,255,255,.6)}
.btn.pink{background:linear-gradient(180deg,#ff8ac0,#ff3d8b 60%,#e0186a);box-shadow:0 6px 0 #a3004a,0 10px 20px rgba(80,0,40,.35),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(120,0,50,.6)}
.btn.green{background:linear-gradient(180deg,#8dff9e,#2ed158 60%,#13a83a);box-shadow:0 6px 0 #0b7427,0 10px 20px rgba(0,60,20,.3),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(0,90,30,.6)}
.btn.blue{background:linear-gradient(180deg,#8fd3ff,#2e8bff 60%,#1660d6);box-shadow:0 6px 0 #0b3f99,0 10px 20px rgba(0,30,80,.3),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(0,40,110,.6)}
.btn.small{padding:10px 20px;font-size:16px}
.btn:disabled{filter:grayscale(.8) brightness(.9);opacity:.7}
.icon{width:46px;height:46px;border-radius:16px;font-size:22px;display:grid;place-items:center;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,220,240,.9));box-shadow:0 4px 0 rgba(120,20,90,.5),0 6px 14px rgba(60,0,60,.3)}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,20,90,.5)}
.badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff2d55;border:2px solid #fff;display:none}
.badge.on{display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* ---------- title ---------- */
#title{justify-content:center;gap:18px}
.logo{text-align:center;line-height:.9;font-weight:900;animation:wob 3s ease-in-out infinite;margin-top:-6vh}
.logo div{font-size:min(17vw,92px);letter-spacing:1px;
  background:linear-gradient(180deg,#fff7b0 0%,#ffd23d 35%,#ff7a00 70%,#ff3d8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px #6b0f5c;filter:drop-shadow(0 6px 0 #6b0f5c) drop-shadow(0 12px 18px rgba(60,0,60,.45))}
.logo .l2{font-size:min(13.5vw,74px);background:linear-gradient(180deg,#fff 0%,#ffb3e0 35%,#ff3d8b 70%,#b01e9e 100%);-webkit-background-clip:text;background-clip:text}
@keyframes wob{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.orbit{position:relative;width:min(80vw,340px);height:min(36vw,150px)}
.orbit img{position:absolute;width:56px;height:56px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-16px) rotate(12deg)}}
.tagline{color:#fff;font-weight:700;font-size:17px;text-shadow:0 2px 6px rgba(60,0,60,.5);text-align:center}
.pulseBtn{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.titleRow{display:flex;gap:12px}

/* ---------- map ---------- */
.topbar{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;z-index:3}
.coins{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
.pill{background:var(--panel);color:#fff;font-weight:900;padding:8px 16px;border-radius:999px;font-size:18px;box-shadow:inset 0 2px 6px rgba(0,0,0,.25);backdrop-filter:blur(4px)}
#mapScroll{flex:1;width:100%;max-width:560px;overflow-y:auto;overflow-x:hidden;margin-top:8px;border-radius:24px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
.region{position:absolute;left:0;right:0;border-radius:28px}
.regionSign{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:8px 18px;border-radius:14px;font-weight:900;color:#7a1460;box-shadow:0 4px 0 rgba(120,20,90,.35);white-space:nowrap;font-size:14px;z-index:1}
#mapInner svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;font-weight:900;font-size:22px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffe0f0,#ff5aa8 45%,#c3127a);box-shadow:0 5px 0 #7d0a4e,0 8px 16px rgba(60,0,50,.4),inset 0 -4px 8px rgba(0,0,0,.2);
  text-shadow:0 2px 0 rgba(100,0,60,.6);display:grid;place-items:center}
.node.done{background:radial-gradient(circle at 35% 30%,#fff6c0,#ffbe2e 45%,#e07800);box-shadow:0 5px 0 #8f4a00,0 8px 16px rgba(60,0,50,.4),inset 0 -4px 8px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(140,60,0,.6)}
.node.locked{background:radial-gradient(circle at 35% 30%,#eee,#aaa 50%,#777);box-shadow:0 5px 0 #555,0 8px 16px rgba(0,0,0,.3);color:#eee;font-size:18px}
.node.current{animation:beat 1s ease-in-out infinite;z-index:2}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid #fff;opacity:.8;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
.node .st{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:-2px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.st .on{color:#ffd23d}.st .off{color:rgba(255,255,255,.45)}
.avatar{position:absolute;font-size:34px;margin:-74px 0 0 -18px;animation:bob 1.2s ease-in-out infinite;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.deco{position:absolute;pointer-events:none;opacity:.9;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}

/* ---------- game ---------- */
#game{gap:6px}
.hud{width:100%;max-width:560px;display:flex;align-items:stretch;gap:8px}
.moves{width:76px;border-radius:18px;background:linear-gradient(180deg,#fff,#ffe1f1);box-shadow:0 4px 0 rgba(120,20,90,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.moves small{font-size:11px;font-weight:900;color:#b01e7e;letter-spacing:1px}
.moves b{font-size:30px;line-height:1;font-weight:900;color:var(--ink)}
.moves.low b{color:#ff2d55;animation:beat .6s infinite}
.goals{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;border-radius:18px;background:var(--panel);padding:6px;box-shadow:inset 0 2px 8px rgba(0,0,0,.25);flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.92);border-radius:12px;padding:3px 8px 3px 4px;font-weight:900;font-size:17px}
.goal img{width:30px;height:30px}
.goal .gi{font-size:22px;width:30px;text-align:center}
.goal.done{background:#b8ffc8}
.goal.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.jellyIcon{width:28px;height:22px;border-radius:8px;background:linear-gradient(180deg,#ffb3dd,#ff5fae);box-shadow:inset 0 3px 0 rgba(255,255,255,.6);display:inline-block}
.scorebar{width:100%;max-width:560px;height:28px;display:flex;align-items:center;gap:8px}
.scorebar .track{flex:1;height:100%;position:relative;border-radius:999px;background:var(--panel);box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.scorebar .fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;width:0;background:linear-gradient(90deg,#ffd23d,#ff7a00,#ff3d8b);transition:width .35s;box-shadow:inset 0 3px 0 rgba(255,255,255,.5)}
.scorebar .sm{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;color:rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(0,0,0,.4);transition:color .3s,transform .3s}
.scorebar .sm.lit{color:#ffe14d;transform:translate(-50%,-50%) scale(1.25)}
.scorebar b{min-width:76px;text-align:center;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 2px rgba(0,0,0,.4)}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{touch-action:none;display:block}
.boosters{display:flex;gap:14px;justify-content:center;align-items:center}
.boost{width:62px;height:62px;border-radius:20px;font-size:30px;position:relative;
  background:linear-gradient(180deg,#fff,#ffd6ee);box-shadow:0 5px 0 rgba(120,20,90,.5),0 8px 14px rgba(60,0,60,.3)}
.boost:active{transform:translateY(3px)}
.boost.active{background:linear-gradient(180deg,#fff6a0,#ffc83d);animation:beat .8s infinite}
.boost i{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;border-radius:12px;font-style:normal;font-size:13px;font-weight:900;color:#fff;background:#ff2d55;border:2px solid #fff;display:grid;place-items:center;padding:0 4px}
.boost i.buy{background:#2ed158}
.levelTag{color:#fff;font-weight:900;font-size:14px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.boostHint{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;padding:6px 14px;border-radius:12px;font-weight:900;color:#b01e7e;display:none;z-index:5;box-shadow:0 4px 0 rgba(120,20,90,.4);white-space:nowrap}
.boostHint.on{display:block}

/* ---------- big text ---------- */
#bigText{position:fixed;left:0;right:0;top:40%;text-align:center;pointer-events:none;z-index:40;font-weight:900;font-size:min(13vw,64px);
  background:linear-gradient(180deg,#fff,#fff3a0 40%,#ffb000);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #8a0a6a;filter:drop-shadow(0 5px 0 #8a0a6a) drop-shadow(0 8px 20px rgba(80,0,60,.5));opacity:0;padding:0 10px}
#bigText.go{animation:bigt 1.25s cubic-bezier(.2,1.6,.4,1) forwards}
#bigText.mega{font-size:min(14vw,76px);background:linear-gradient(90deg,#ff3d8b,#ffd23d,#2ed158,#1e90ff,#b04dff);-webkit-background-clip:text;background-clip:text}
@keyframes bigt{0%{opacity:0;transform:scale(.2) rotate(-12deg)}25%{opacity:1;transform:scale(1.15) rotate(3deg)}40%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3) translateY(-30px)}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(40,0,50,.55);backdrop-filter:blur(3px);padding:16px}
#modal.on{display:flex}
.card{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:22px 18px 22px;text-align:center;position:relative;
  box-shadow:0 8px 0 #c76aa8,0 20px 40px rgba(40,0,50,.5);border:4px solid #fff;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card h2{margin:0 0 6px;font-size:28px;font-weight:900;color:#c3127a;text-shadow:0 2px 0 #ffd6ee}
.card p{margin:8px 0;font-weight:500;font-size:16px;line-height:1.35}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.card .sub{color:#9a4a8a;font-weight:700;font-size:14px}
.goalList{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.goalList .goal{justify-content:flex-start;background:#ffe6f4;font-size:16px;padding:6px 12px}
.tip{background:#fff3c4;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;color:#7a4a00;text-align:left;line-height:1.4}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px;height:76px;align-items:flex-end}
.bigstars span{font-size:60px;color:#e7c8dd;line-height:1;transition:.2s}
.bigstars span:nth-child(2){font-size:74px}
.bigstars span.on{color:#ffc400;text-shadow:0 4px 0 #c27400,0 0 20px #ffe680;animation:starIn .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes starIn{from{transform:scale(2.5) rotate(-90deg);opacity:0}}
.reward{display:inline-block;margin-top:6px;background:#fff0b0;border-radius:999px;padding:6px 18px;font-weight:900;font-size:20px;color:#8a5a00}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#ffe6f4;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700}
.toggle button{width:58px;height:32px;border-radius:16px;background:#ccc;position:relative;transition:.2s}
.toggle button::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle button.on{background:#2ed158}
.toggle button.on::after{left:29px}
.linkBtn{background:none;color:#b01e7e;font-weight:700;text-decoration:underline;margin-top:12px;font-size:14px}

/* wheel */
.wheelBox{position:relative;width:260px;height:260px;margin:12px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 0 0 4px #ff3d8b,0 8px 20px rgba(0,0,0,.3);position:relative;
  background:conic-gradient(#ff5aa8 0 45deg,#ffd23d 0 90deg,#2ed158 0 135deg,#1e90ff 0 180deg,#b04dff 0 225deg,#ff8a00 0 270deg,#ff2d55 0 315deg,#3ad1ff 0 360deg);
  transition:transform 4.2s cubic-bezier(.15,.75,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;font-weight:900;color:#fff;font-size:18px;text-shadow:0 2px 2px rgba(0,0,0,.45);white-space:nowrap;width:80px;margin-left:-40px;text-align:center;margin-top:-12px}
.wheelPin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.wheelHub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd6ee);box-shadow:0 3px 8px rgba(0,0,0,.3);display:grid;place-items:center;font-size:26px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#rotate{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>

  <section id="title" class="screen active">
    <div class="logo"><div class="l1">БОМБА</div><div class="l2">КОНФЕТКА</div></div>
    <div class="orbit" id="orbit"></div>
    <button class="btn big pulseBtn" id="playBtn" style="font-size:28px;padding:18px 56px">ИГРАТЬ</button>
    <div class="tagline">Взрывай. Собирай. Кайфуй. 🍬💥</div>
    <div class="titleRow"><button class="icon" id="titleSettings" aria-label="Настройки">⚙️</button></div>
  </section>

  <section id="map" class="screen">
    <div class="topbar">
      <button class="icon" id="mapHome" aria-label="Домой">🏠</button>
      <div class="coins"><div class="pill">🪙 <span id="coinCount">0</span></div><div class="pill">⭐ <span id="starCount">0</span></div></div>
      <button class="icon" id="giftBtn" aria-label="Подарок дня">🎁<i class="badge" id="giftBadge"></i></button>
      <button class="icon" id="mapSettings" aria-label="Настройки">⚙️</button>
    </div>
    <div id="mapScroll"><div id="mapInner"></div></div>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <div class="moves" id="movesBox"><small>ХОДЫ</small><b id="movesNum">0</b></div>
      <div class="goals" id="goals"></div>
      <button class="icon" id="pauseBtn" aria-label="Пауза" style="align-self:center">⏸</button>
    </div>
    <div class="scorebar"><b id="scoreNum">0</b><div class="track"><div class="fill" id="scoreFill"></div><span class="sm" id="sm1">★</span><span class="sm" id="sm2">★</span><span class="sm" id="sm3">★</span></div></div>
    <div id="boardWrap"><div class="boostHint" id="boostHint">Выбери конфету 👆</div><canvas id="board"></canvas></div>
    <div class="boosters">
      <button class="boost" data-b="hammer" aria-label="Молоток">🔨<i></i></button>
      <button class="boost" data-b="shuffle" aria-label="Перемешать">🔀<i></i></button>
      <button class="boost" data-b="rainbow" aria-label="Шоко-бомба">🌈<i></i></button>
    </div>
    <div class="levelTag" id="levelTag"></div>
  </section>

  <div id="bigText"></div>
  <div id="modal"><div class="card" id="card"></div></div>
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rnd = Math.random;
const rint = n => Math.floor(rnd() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => Math.round(n).toLocaleString('ru-RU');
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

/* =================== SAVE =================== */
const SAVE_KEY = 'bombakonfetka_v1';
const defaults = () => ({ level: 1, stars: {}, best: {}, coins: 150, boost: { hammer: 3, shuffle: 2, rainbow: 1 }, daily: '', music: true, sfx: true });
let save = defaults();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(defaults(), s); } catch (e) {}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* =================== AUDIO =================== */
const Snd = {
  ac: null, master: null, mus: null, next: 0, step: 0, nbuf: null,
  init(){
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = .55; this.master.connect(this.ac.destination);
      this.mus = this.ac.createGain(); this.mus.gain.value = .55; this.mus.connect(this.master);
      this.next = this.ac.currentTime + .15; setInterval(() => this.tick(), 70);
    } catch (e) { this.ac = null; }
  },
  osc(f, t, d, type, vol, dest, slide){
    const ac = this.ac; const o = ac.createOscillator(), g = ac.createGain();

  const type = order[(n - 1) % order.length];

  const colors = n <= 8 ? 5 : (n % 4 === 0 ? 5 : 6);
  const lvl = { n, R, C, cells, colors, type, goals: {}, moves: 20 };
  const hard = Math.min(1, n / 60);
  if (type === 'score') { lvl.goals.score = Math.round((2500 + n * 190) / 500) * 500; lvl.moves = n < 5 ? 20 : 18; }
  if (type === 'collect' || type === 'mix') {

    const cols = [...Array(colors).keys()].sort(() => rng() - .5).slice(0, k);
    const need = Math.min(45, 12 + Math.floor(n * .6));
    lvl.goals.collect = cols.map(color => ({ color, need, got: 0 }));
    lvl.moves = 18 + k * 3;
  }
  if (type === 'jelly' || type === 'mix') {
    const pat = n <= 3 ? JELLY[0] : JELLY[Math.floor(rng() * JELLY.length)];
    let cnt = 0;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (play(r, c) && pat(r, c, R, C)) { cells[r][c].jelly = (n >= 12 && rng() < .25 + hard * .3) ? 2 : 1; cnt += cells[r][c].jelly; }
    lvl.goals.jelly = true;
    lvl.moves = Math.max(lvl.moves, 18 + Math.ceil(cnt / 4));
  }
  if (type === 'boxes') {
    const pat = n <= 4 ? BOXES[4] : BOXES[Math.floor(rng() * BOXES.length)];
    let cnt = 0;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (play(r, c) && pat(r, c, R, C)) { cells[r][c].box = (n >= 8 && rng() < .3 + hard * .4) ? 2 : 1; cnt += cells[r][c].box; }
    lvl.goals.boxes = true;

}

function findAnyMove(){

    const r2 = r + dr, c2 = c + dc; if (!inB(r2, c2) || !movable(r, c) || !movable(r2, c2)) continue;
    const A = board[r][c], B = board[r2][c2];

/* ---------- effects ---------- */
const px = c => pad + (c + .5) * cs;
const py = r => pad + (r + .5) * cs;

const CASCADE_WORDS = ['', '', 'Сладко!', 'Вкусно!', 'Восхитительно!', 'Божественно!', 'КОНФЕТНЫЙ ВЗРЫВ!'];

/* ---------- blast: clears a set of cells with chain reactions ---------- */
function mostCommonColor(){

function shake(a){ shakeAmt = Math.max(shakeAmt, a * cs / 50); }

async function clearMatches(groups, prefer){

/* ---------- gravity ---------- */
async function gravity(){

    for (let c = 0; c < C; c++) for (let r = R - 1; r >= 0; r--) {

      let rr = r - 1;
      while (rr >= 0 && (cells[rr][c].hole || emptyCell(rr, c))) rr--;
      if (rr < 0) { const cd = newCandy(rint(L.colors), null, r, c); cd.y = -1 - spawn[c]++; board[r][c] = cd; changed = true; }
      else { const cell = cells[rr][c], cd = board[rr][c]; if (cell.box > 0 || !cd || cell.lock > 0) continue; board[r][c] = cd; board[rr][c] = null; changed = true; }
    }

        if (!emptyCell(r, c)) continue;

async function settle(){

    if (!groups.length) break;
    cascade++;
    if (cascade >= 2 && !ended) bigText(CASCADE_WORDS[Math.min(cascade, 6)]);
    await clearMatches(groups, null);
  }

}

async function shuffleBoard(){
  const pos = [], cds = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (movable(r, c)) { pos.push([r, c]); cds.push(board[r][c]); }

    if (t > 150) cds.forEach(cd => { if (!cd.special) cd.color = rint(L.colors); });

/* ---------- swapping & combos ---------- */
function moveTo(cd, r, c, dur){ const x0 = cd.x, y0 = cd.y; return tween(dur, p => { cd.x = x0 + (c - x0) * p; cd.y = y0 + (r - y0) * p; }, easeOut).then(() => { cd.x = c; cd.y = r; }); }
async function trySwap(a, b){

  await Promise.all([moveTo(A, b.r, b.c, 150), moveTo(B, a.r, a.c, 150)]);
  const combo = (A.special && B.special) || A.special === 'bomb' || B.special === 'bomb';
  const groups = combo ? null : findMatches();
  if (!combo && !groups.length) {
    Snd.bad(); board[a.r][a.c] = A; board[b.r][b.c] = B;
    await Promise.all([moveTo(A, a.r, a.c, 150), moveTo(B, b.r, b.c, 150)]);

async function doCombo(X, pX, Y, pY){

    bigText('МЕГА ВЗРЫВ!!! 💥', true); Snd.bomb(); Snd.boom(); shake(20); flash = .8; buzz([60, 40, 90]);
    const all = new Set(); for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (playable(r, c)) all.add(key(r, c));
    addShock(pX.r, pX.c, 9, 4);
    await blast(all, { pre, origin: [pX.r, pX.c] });
    return;
  }
  if (sX === 'bomb' || sY === 'bomb') {
    const [Bm, pb, O] = sX === 'bomb' ? [X, pX, Y] : [Y, pY, X];
    const kb = key(pb.r, pb.c);
    const color = O.color;
    const targets = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (colorAt(r, c) === color) targets.push([r, c]);

      for (const [r, c] of targets) { const cd = board[r][c]; if (!cd.special) { cd.special = O.special === 'wrap' ? 'wrap' : (rnd() < .5 ? 'h' : 'v'); tween(250, p => cd.s = 1 + Math.sin(p * Math.PI) * .4); } }

      const set = new Set([kb, ...targets.map(([r, c]) => key(r, c))]);
      await blast(set, { pre: [kb], origin: [pb.r, pb.c] });
    } else {
      bigText('Шоко-бум! 🌈');
      await wait(220);
      const set = new Set([kb, ...targets.map(([r, c]) => key(r, c))]);
      await blast(set, { pre: [kb], origin: [pb.r, pb.c] });
    }
    return;
  }

  } else if (sX === 'wrap' && sY === 'wrap') {

    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (inB(r0 + dr, c0 + dc)) set.add(key(r0 + dr, c0 + dc));
    addShock(r0, c0, 4.5, X.color); Snd.boom(); shake(16); flash = .3;
  } else {

    for (let d = -1; d <= 1; d++) {

    }
    Snd.zap(); Snd.boom(); shake(14);

}

/* ---------- goals / end ---------- */
function goalsDone(){
  const g = L.goals;
  if (g.collect && g.collect.some(x => x.got < x.need)) return false;
  if (g.jelly && countJelly() > 0) return false;
  if (g.boxes && countBoxes() > 0) return false;
  if (g.score && score < g.score) return false;
  return true;
}
const countJelly = () => { let n = 0; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) n += cells[r][c].jelly; return n; };

async function checkEnd(){

    const st = save.stars[i] || 0, cls = i < save.level || st ? 'done' : i === save.level ? 'current' : 'locked';
    const reg = REGIONS[Math.floor((i - 1) / 10)];
    inner.insertAdjacentHTML('beforeend', `<button class="node ${i === save.level ? 'current' : cls}" data-n="${i}" style="left:${xOf(i)}%;top:${yOf(i)}px">${cls === 'locked' ? '🔒' : i}${cls !== 'locked' ? `<span class="st">${starsHTML(st)}</span>` : ''}</button>`);
    if (i % 2 === 0) { const side = xOf(i) > 50 ? 8 + dr() * 14 : 78 + dr() * 12; inner.insertAdjacentHTML('beforeend', `<div class="deco" style="left:${side}%;top:${yOf(i) - 20}px;font-size:${28 + dr() * 18}px">${reg.deco[Math.floor(dr() * 3)]}</div>`); }
  }
  const cur = Math.min(save.level, TOTAL);
  inner.insertAdjacentHTML('beforeend', `<div class="avatar" style="left:${xOf(cur)}%;top:${yOf(cur)}px">🍬</div>`);
  inner.querySelectorAll('.node').forEach(b => b.addEventListener('click', () => { Snd.init(); const n = +b.dataset.n; if (n > save.level) { Snd.bad(); return; } Snd.click(); showIntro(n); }));
  setBg(REGIONS[Math.floor((cur - 1) / 10)]);
  requestAnimationFrame(() => { const sc = $('#mapScroll'); sc.scrollTop = yOf(cur) - sc.clientHeight * .6; });
}
function showIntro(n){
  const lv = makeLevel(n); const prevL = L; L = lv; score = 0; cells = lv.cells; R = lv.R; C = lv.C;
  const gh = goalHTML(true); L = prevL;
  if (L) { cells = L.cells; R = L.R; C = L.C; }
  const tip = TIPS[n] ? `<div class="tip">💡 ${TIPS[n]}</div>` : '';
  modal(`<h2>Уровень ${n}</h2><div class="sub">${lv.region.deco[0]} ${lv.region.name} · ${lv.moves} ходов</div>
    <div class="bigstars" style="height:50px">${[0, 1, 2].map(i => `<span class="${i < (save.stars[n] || 0) ? 'on' : ''}" style="font-size:40px;animation:none">★</span>`).join('')}</div>
    <div class="goalList">${gh}</div>${tip}
    <div class="row"><button class="btn small pink" data-a="close">Назад</button><button class="btn green" data-a="play">Играть!</button></div>`,
  { play: () => { closeModal(); startLevel(n); }, close: closeModal });
}
function startLevel(n){
  L = makeLevel(n); R = L.R; C = L.C; cells = L.cells;
  movesLeft = L.moves; score = 0; cascade = 0; busy = true; ended = false; selected = null; hint = null; boosterMode = null;
  fx = []; particles = []; floats = []; dying = []; lastGoalHTML = '';
  $('#boostHint').classList.remove('on');
  setBg(L.region);
  show('game');
  $('#levelTag').textContent = `Уровень ${n} · ${L.region.name}`;
  layout(); fillBoard(); updateHUD();
  // candies rain in
  const anims = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const cd = board[r][c]; if (!cd) continue; const y0 = r - R - 1; cd.y = y0; anims.push(tween(520, p => cd.y = y0 + (r - y0) * p, easeFall, c * 40 + (R - r) * 25).then(() => cd.y = r)); }
  Promise.all(anims).then(() => { busy = false; scheduleHint(); });
}
function showWin(){
  const n = L.n; const st = score >= L.stars[2] ? 3 : score >= L.stars[1] ? 2 : 1;
  const old = save.stars[n] || 0;
  const coinsWon = 10 + st * 10 + (st > old ? (st - old) * 10 : 0);
  save.stars[n] = Math.max(old, st); save.best[n] = Math.max(save.best[n] || 0, score);
  if (n >= save.level && n < TOTAL) save.level = n + 1; else if (n >= save.level) save.level = TOTAL;
  save.coins += coinsWon; persist();
  confettiBurst(160); Snd.win();
  const last = n >= TOTAL;
  const card = modal(`<h2>${last ? 'ТЫ ЛЕГЕНДА! 👑' : ['', 'Пройдено!', 'Отлично!', 'ИДЕАЛЬНО!'][st]}</h2>
    <div class="bigstars"><span>★</span><span>★</span><span>★</span></div>
    <p>Очки: <b>${fmt(score)}</b>${save.best[n] === score ? ' · 🏆 рекорд!' : ''}</p>
    <div class="reward">+${coinsWon} 🪙</div>
    <div class="row"><button class="btn small pink" data-a="map">Карта</button><button class="btn small blue" data-a="again">Ещё раз</button>${last ? '' : '<button class="btn green" data-a="next">Дальше ▶</button>'}</div>`,
  { map: () => { closeModal(); show('map'); }, again: () => { closeModal(); startLevel(n); }, next: () => { closeModal(); showIntro(n + 1); } });
  const spans = card.querySelectorAll('.bigstars span');
  for (let i = 0; i < st; i++) setTimeout(() => { spans[i].classList.add('on'); Snd.star(i); buzz(30); }, 400 + i * 420);
  setTimeout(() => Snd.coin(), 400 + st * 420 + 100);
}
function showLose(){
  Snd.lose();
  const price = 60, can = save.coins >= price;
  modal(`<h2>Ходы кончились 😢</h2><div style="font-size:64px">🍬</div><p>Совсем чуть-чуть осталось!</p>
    <div class="goalList">${goalHTML(false)}</div>
    <button class="btn green" data-a="more" ${can ? '' : 'disabled'} style="width:100%">+5 ходов за ${price} 🪙</button>
    <p class="sub">У тебя 🪙 ${fmt(save.coins)}</p>
    <div class="row"><button class="btn small pink" data-a="map">Карта</button><button class="btn small blue" data-a="retry">Заново</button></div>`,
  { more: () => { save.coins -= price; persist(); movesLeft += 5; ended = false; closeModal(); Snd.coin(); updateHUD(); scheduleHint(); },
    map: () => { closeModal(); show('map'); }, retry: () => { closeModal(); startLevel(L.n); } });
}
function settingsHTML(){
  return `<div class="toggle">🎵 Музыка<button data-a="music" class="${save.music ? 'on' : ''}" aria-label="Музыка"></button></div>
    <div class="toggle">🔊 Звуки<button data-a="sfx" class="${save.sfx ? 'on' : ''}" aria-label="Звуки"></button></div>`;
}
const toggleActs = { music: e => { save.music = !save.music; persist(); e.currentTarget.classList.toggle('on', save.music); }, sfx: e => { save.sfx = !save.sfx; persist(); e.currentTarget.classList.toggle('on', save.sfx); } };
function showSettings(){
  modal(`<h2>Настройки</h2>${settingsHTML()}<div class="row"><button class="btn green small" data-a="close">Готово</button></div>
    <button class="linkBtn" data-a="reset">Сбросить прогресс</button>`,
  Object.assign({ close: closeModal, reset: () => { modal(`<h2>Точно?</h2><p>Все звёзды и монеты пропадут.</p><div class="row"><button class="btn small green" data-a="no">Нет</button><button class="btn small pink" data-a="yes">Сбросить</button></div>`, { no: closeModal, yes: () => { const m = save.music, s = save.sfx; save = defaults(); save.music = m; save.sfx = s; persist(); closeModal(); show('map'); } }); } }, toggleActs));
}
$('#pauseBtn').addEventListener('click', () => {
  Snd.init(); if (busy || ended) return; Snd.click();
  modal(`<h2>Пауза</h2><div class="sub">Уровень ${L.n}</div>${settingsHTML()}
    <div class="row"><button class="btn green" data-a="go" style="width:100%">Продолжить</button></div>
    <div class="row"><button class="btn small blue" data-a="retry">Заново</button><button class="btn small pink" data-a="map">Карта</button></div>`,
  Object.assign({ go: closeModal, retry: () => { closeModal(); startLevel(L.n); }, map: () => { closeModal(); ended = true; show('map'); } }, toggleActs));
});

/* daily wheel */
const PRIZES = [{ t: '50🪙', coins: 50 }, { t: '🔨', b: 'hammer', n: 1 }, { t: '100🪙', coins: 100 }, { t: '🔀', b: 'shuffle', n: 1 }, { t: '25🪙', coins: 25 }, { t: '🌈', b: 'rainbow', n: 1 }, { t: '200🪙', coins: 200 }, { t: '🔨×2', b: 'hammer', n: 2 }];
function showWheel(){
  const ready = save.daily !== today();
  const card = modal(`<h2>Подарок дня</h2><div class="sub">${ready ? 'Крути колесо — каждый день новый приз!' : 'Приходи завтра за новым призом 🌙'}</div>
    <div class="wheelBox"><div class="wheelPin">🔻</div><div class="wheel" id="wheel">${PRIZES.map((p, i) => `<span style="transform:rotate(${i * 45 + 22.5}deg) translateY(-92px)">${p.t}</span>`).join('')}</div><div class="wheelHub">🍬</div></div>
    <div class="row"><button class="btn small pink" data-a="close">Закрыть</button><button class="btn green" data-a="spin" ${ready ? '' : 'disabled'}>Крутить!</button></div>`,
  { close: closeModal, spin: e => {
    if (save.daily === today()) return;
    e.currentTarget.disabled = true; save.daily = today(); persist();
    const idx = rint(PRIZES.length), deg = 360 * 6 + 360 - (idx * 45 + 22.5);
    card.querySelector('#wheel').style.transform = `rotate(${deg}deg)`;
    let k = 0; const tk = setInterval(() => { Snd.tickW(); if (++k > 30) clearInterval(tk); }, 130);
    setTimeout(() => {
      const p = PRIZES[idx];
      if (p.coins) save.coins += p.coins; else save.boost[p.b] = (save.boost[p.b] || 0) + p.n;
      persist(); Snd.win(); confettiBurst(120);
      $('#coinCount').textContent = fmt(save.coins); $('#giftBadge').classList.remove('on');
      card.querySelector('.sub').innerHTML = `<b style="font-size:20px;color:#c3127a">Ты выиграл ${p.t}!</b>`;
    }, 4400);
  } });
}

/* =================== BOOT =================== */
$('#playBtn').addEventListener('click', () => { Snd.init(); Snd.click(); show('map'); if (save.level === 1 && !save.stars[1]) setTimeout(() => showIntro(1), 350); });
$('#mapHome').addEventListener('click', () => { Snd.click(); show('title'); });
$('#mapSettings').addEventListener('click', () => { Snd.init(); Snd.click(); showSettings(); });
$('#titleSettings').addEventListener('click', () => { Snd.init(); Snd.click(); showSettings(); });
$('#giftBtn').addEventListener('click', () => { Snd.init(); Snd.click(); showWheel(); });
$('#modal').addEventListener('pointerdown', e => e.stopPropagation());

// decorative candies
(function decor(){
  const orbit = $('#orbit');
  [[0, null], [4, 'h'], [2, null], [5, 'wrap'], [-1, 'bomb'], [3, null], [1, 'v']].forEach(([c, s], i, arr) => {
    const img = document.createElement('img'); img.src = c < 0 ? iconURL(0, 'bomb') : iconURL(c, s); img.alt = '';
    img.style.left = `calc(${(i / (arr.length - 1)) * 100}% - 28px)`; img.style.top = `${30 + Math.sin(i * 1.3) * 35}%`; img.style.animationDelay = (i * .2) + 's';
    orbit.appendChild(img);
  });
  const bg = $('#bg');
  for (let i = 0; i < 14; i++) {
    const img = document.createElement('img'); img.src = iconURL(i % 6, i % 5 === 0 ? 'wrap' : null); img.alt = '';
    const s = 30 + rnd() * 40; img.style.width = img.style.height = s + 'px'; img.style.left = (rnd() * 100) + '%';
    img.style.animationDuration = (14 + rnd() * 16) + 's'; img.style.animationDelay = (-rnd() * 30) + 's'; bg.appendChild(img);
  }
})();

window.addEventListener('resize', () => { sizeFx(); if (screen === 'game') layout(); });
sizeFx();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});

// test hooks
window.__bk = { get state(){ return { L, board, cells, movesLeft, score, busy, ended, R, C }; }, setSpeed: s => SPEED = s, startLevel, trySwap, findAnyMove, findMatches, save: () => save, show };
})();
</script>
