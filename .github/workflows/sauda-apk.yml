name: Sauda APK

# Собирает Android-приложение маркетплейса Sauda (папка market/ внутри WebView).
# Готовый APK — во вложении «sauda-apk» у запуска (Actions → Sauda APK → последний запуск → Artifacts).
on:
  push:
    paths: ['market/**', 'android-sauda/**', '.github/workflows/sauda-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauda-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle -p android-sauda assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Проверить APK
        run: |
          APK=android-sauda/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|js/app.js|js/config.js)'
          cp "$APK" sauda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sauda-apk
          path: sauda.apk
          retention-days: 30
