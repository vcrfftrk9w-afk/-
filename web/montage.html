function paintPreview(cv, lookId, amt, extras = {}) {
  const W = 240, H = 300;
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#111"; g.fillRect(0, 0, W, H);
  const src = previewSource();
  const look = LOOKS[lookId] || LOOKS.none;
  if (src) {
    const s = Math.max(W / src.width, H / src.height);
    g.filter = look.css ? look.css(amt) : "none";
    g.drawImage(src, (W - src.width * s) / 2, (H - src.height * s) / 2, src.width * s, src.height * s);
    g.filter = "none";
  }
  if (look.tint) { const [c, a] = look.tint(amt); g.globalCompositeOperation = "soft-light"; g.globalAlpha = a; g.fillStyle = c; g.fillRect(0, 0, W, H); }
  if (look.grade) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#ffb066"); gr.addColorStop(1, "#0b3d4a"); g.globalCompositeOperation = "soft-light"; g.globalAlpha = look.grade(amt); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  if (extras.bars) { g.fillStyle = "#000"; g.fillRect(0, 0, W, H * .12); g.fillRect(0, H * .88, W, H * .12); }
  if (extras.vhs) { g.fillStyle = g.createPattern(scanTile, "repeat"); g.fillRect(0, 0, W, H); g.fillStyle = "#fff"; g.font = '700 13px "JetBrains Mono", monospace'; g.fillText("PLAY ▶", 12, 22); }
  if (extras.rgb) { g.globalCompositeOperation = "screen"; g.globalAlpha = .35; g.drawImage(cv, 5, 0); g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; }
  if (extras.leak) { const gr = g.createRadialGradient(W * .9, H * .1, 0, W * .9, H * .1, W); gr.addColorStop(0, "rgba(255,140,60,.55)"); gr.addColorStop(1, "rgba(255,140,60,0)"); g.globalCompositeOperation = "screen"; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "source-over"; }
  if (extras.split) { const src2 = document.createElement("canvas"); src2.width = W; src2.height = H; src2.getContext("2d").drawImage(cv, 0, 0); for (let k = 0; k < 3; k += 1) { g.save(); g.beginPath(); g.rect(0, (H / 3) * k, W, H / 3); g.clip(); g.drawImage(src2, 0, (H / 3) * k - H / 3, W, H); g.restore(); } g.fillStyle = "#000"; g.fillRect(0, H / 3 - 1, W, 2); g.fillRect(0, (2 * H) / 3 - 1, W, 2); }
  if (extras.lines) { g.fillStyle = "#fff"; g.globalAlpha = .5; for (let i = 0; i < 40; i += 1) { const a = hash(i) * Math.PI * 2, w = .01 + hash(i + 4) * .02; g.beginPath(); g.moveTo(W / 2 + Math.cos(a - w) * W, H / 2 + Math.sin(a - w) * W); g.lineTo(W / 2 + Math.cos(a) * W * .45, H / 2 + Math.sin(a) * W * .45); g.lineTo(W / 2 + Math.cos(a + w) * W, H / 2 + Math.sin(a + w) * W); g.fill(); } g.globalAlpha = 1; }
  if (extras.vignette) { const gr = g.createRadialGradient(W / 2, H / 2, W * .3, W / 2, H / 2, W * .85); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, `rgba(0,0,0,${extras.vignette})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
}

function panelSpeed() {
  const clip = selectedClip();
  if (!clip) return h("div", null, panelTitle("Скорость", "Выбери клип на таймлайне"));
  const node = S.seq.clips.find((c) => c.id === clip.id);
  const asset = node.asset;
  const avg = clip.span / clip.len;
  const maxSpeed = asset.kind === "video" ? Math.max(.25, (asset.duration - clip.src) / clip.len / rampMean(clip.ramp)) : 4;
  return h("div", null,
    panelTitle("Скорость", `Клип ${node.index + 1} · ${asset.name}`),
    asset.kind === "image" ? h("div", { class: "note" }, "Фото не ускоряются — у них работает наезд и зум на бит.") : h("div", null,
      h("div", { class: "sec" }, h("h3", null, "Кривая скорости")),
      h("div", { class: "cards" }, RAMP_IDS.map((id) => {
        const cv = h("canvas");
        paintRamp(cv, id, id === clip.ramp);
        return h("button", { type: "button", class: id === clip.ramp ? "card on" : "card", style: "min-height:96px", onclick: () => commit((pl) => {
          const c = pl.clips.find((x) => x.id === clip.id);
          const speed = (c.span / c.len) / rampMean(c.ramp);
          c.ramp = id;
          c.span = c.len * speed * rampMean(id);
          if (asset.kind === "video") c.span = Math.min(c.span, asset.duration - c.src);
        }) }, cv, h("div", { class: "cap" }, h("b", null, RAMPS[id].name)));
      })),
      h("div", { class: "sec" }, slider({
        label: "Средняя скорость", value: clamp(avg / rampMean(clip.ramp), .25, Math.min(4, maxSpeed)), min: .25, max: Math.min(4, Math.max(.3, maxSpeed)), step: .05,
        fmt: (v) => `×${v.toFixed(2)}`,
        onInput: (v) => { const c = S.plan.clips.find((x) => x.id === clip.id); c.span = c.len * v * rampMean(c.ramp); softRefresh(); },
      })),
    ),
    asset.kind === "video" ? h("div", { class: "sec" }, slider({
      label: "Звук этого клипа", value: clip.vol ?? 1, min: 0, max: 1.5, step: .05,
      onInput: (v) => { S.plan.clips.find((x) => x.id === clip.id).vol = v; softRefresh(); },
    })) : null,
  );

function paintRamp(cv, id, on) {
  const W = 240, H = 120;
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, on ? "#2a0f18" : "#1b1b25"); bg.addColorStop(1, "#101017");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  let mx = 0;
  for (let i = 0; i <= 60; i += 1) mx = Math.max(mx, rampR(id, i / 60));
  mx = Math.max(mx, 1.2);
  g.strokeStyle = on ? "#ff3358" : "#1ee3ff"; g.lineWidth = 3; g.lineJoin = "round";
  g.beginPath();
  for (let i = 0; i <= 60; i += 1) { const u = i / 60, y = H * .78 - (rampR(id, u) / mx) * H * .6; if (i) g.lineTo(u * W, y); else g.moveTo(u * W, y); }
  g.stroke();
  g.fillStyle = "#ffffff22"; g.fillRect(0, H * .78 - (1 / mx) * H * .6, W, 1);
}

function panelText() {
  const sel = selectedText();
  const field = h("input", { class: "field", id: "new-text", placeholder: "Напиши надпись…", maxlength: "120" });
  const add = () => {
    const value = field.value.trim();
    if (!value) { field.focus(); return; }
    const beat = 60 / (S.seq?.grid.bpm || 120);
    const at = clamp(S.cursor, 0, Math.max(0, S.seq.total - .5));
    const anim = value.split(/\s+/).length > 1 ? "beat" : "pop";
    const len = Math.min(S.seq.total - at, Math.max(2, (value.split(/\s+/).length + 2) * beat));
    const tx = { id: uid("t"), text: value, at, len, style: STYLES[S.plan.style]?.text[0] || "bold", anim, pos: "center", size: 1, color: "#ffffff" };
    commit((p) => { p.texts = [...(p.texts || []), tx]; });
    S.sel = { kind: "text", id: tx.id };
    renderAll();
    toast("Надпись добавлена в позицию курсора");
  };
  field.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });

  const editor = sel ? (() => {
    const input = h("input", { class: "field", id: "edit-text", value: sel.text, maxlength: "120" });
    let before = null;
    input.addEventListener("input", () => { if (before == null) before = snap(); sel.text = input.value; softRefresh(); const chip = TL.chips.get(sel.id); if (chip) chip.textContent = sel.text; });
    input.addEventListener("change", () => { if (before != null) { S.history.push(before); S.future = []; before = null; } renderTop(); });
    const set = (key, v) => commit((p) => { p.texts.find((x) => x.id === sel.id)[key] = v; });
    return h("div", { class: "sec stack" },
      h("h3", null, "Выбранная надпись"),

      h("div", { class: "tstyles" }, Object.keys(TEXT_STYLES).map((id) => h("button", {
        type: "button", class: sel.style === id ? "tstyle on" : "tstyle", onclick: () => set("style", id), "aria-label": TEXT_STYLES[id].name,
      }, styleSwatch(id)))),
      h("div", { class: "chips" }, Object.keys(TEXT_ANIMS).map((id) => h("button", { type: "button", class: sel.anim === id ? "chip on" : "chip", onclick: () => set("anim", id) }, TEXT_ANIMS[id].name))),
      seg([["top", "Сверху"], ["center", "По центру"], ["bottom", "Снизу"]], sel.pos, (v) => set("pos", v), "Положение"),
      slider({ label: "Размер", value: sel.size || 1, min: .5, max: 2, step: .05, fmt: (v) => `${Math.round(v * 100)}%`, onInput: (v) => { sel.size = v; softRefresh(); } }),

    );
  })() : null;

  return h("div", null,
    panelTitle("Текст", "Надписи ложатся на биты сами"),
    h("div", { class: "row" }, field, h("button", { type: "button", class: "cta", onclick: add }, icon("plus", "s"), "Добавить")),
    editor,
    (S.plan?.texts || []).length ? h("div", { class: "sec" }, h("h3", null, "Все надписи"),

      commit((pl) => { pl.orig.keep = v; });
      if (v) {
        const videos = S.assets.filter((a) => a.kind === "video" && !a.buffer && !a.noAudio);
        if (videos.length) { setBusy("Достаю звук из видео…"); for (const a of videos) await decodeVideoAudio(a); setBusy(null); }
        if (S.assets.some((a) => a.kind === "video" && a.noAudio)) toast("В части видео нет звуковой дорожки");
      }
    }),
    p.orig.keep ? slider({ label: "Громкость", value: p.orig.vol ?? 1, min: 0, max: 1.5, step: .05, onInput: (v) => { p.orig.vol = v; } }) : null,
  );
}

function paintTrack(cv, m, p) {
  const r = cv.getBoundingClientRect();
  const W = Math.max(100, r.width), H = 78, d = dpr();
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  const g = cv.getContext("2d"); g.scale(d, d);
  const A = m.analysis;
  const dur = A.duration;
  const off = p.music.offset || 0, len = S.seq.total;
  g.fillStyle = "#0b1c21"; g.fillRect(0, 0, W, H);
  const x0 = (off / dur) * W, x1 = ((off + len) / dur) * W;
  g.fillStyle = "#1ee3ff1f"; g.fillRect(x0, 0, x1 - x0, H);
  for (let x = 0; x < W; x += 2) {
    const t0 = (x / W) * dur, t1 = ((x + 2) / W) * dur;
    let mx = 0;
    for (let k = Math.floor(t0 * A.peaksRate); k < Math.ceil(t1 * A.peaksRate); k += 1) mx = Math.max(mx, A.peaks[k] || 0);
    const hh = Math.max(1, mx * (H - 10));
    g.fillStyle = x >= x0 && x <= x1 ? "#1ee3ff" : "#1ee3ff4d";
    g.fillRect(x, (H - hh) / 2, 1.4, hh);
  }
  g.strokeStyle = "#1ee3ff"; g.lineWidth = 2; g.strokeRect(x0 + 1, 1, x1 - x0 - 2, H - 2);
}

function bindTrackDrag(cv, m, p) {
  cv.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    stop();
    const before = snap();
    const r = cv.getBoundingClientRect();
    const A = m.analysis;
    const len = S.seq.total;
    const startOff = p.music.offset || 0, x0 = e.clientX;
    const move = (ev) => {
      let off = startOff + ((ev.clientX - x0) / r.width) * A.duration;
      off = clamp(off, 0, Math.max(0, A.duration - len));
      // к ближайшей сильной доле
      let best = off, bd = Infinity;
      for (let i = A.downIndex % 4; i < A.beats.length; i += 4) { const d = Math.abs(A.beats[i] - off); if (d < bd) { bd = d; best = A.beats[i]; } }
      p.music.offset = clamp(best, 0, Math.max(0, A.duration - len));
      softRefresh();
      paintTrack(cv, m, p);
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      if (snap() !== before) { S.history.push(before); S.future = []; }
      refresh();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}

function mediaTile(a) {
  const cv = h("canvas");
  const th = a.thumbs?.[Math.floor((a.thumbs.length - 1) / 2)]?.c;
  cv.width = 200; cv.height = 200;
  const g = cv.getContext("2d");
  if (th) { const s = Math.max(200 / th.width, 200 / th.height); g.drawImage(th, (200 - th.width * s) / 2, (200 - th.height * s) / 2, th.width * s, th.height * s); }
  else if (a.kind === "audio" && a.analysis) {
    g.fillStyle = "#0b1c21"; g.fillRect(0, 0, 200, 200);
    const A = a.analysis;
    g.fillStyle = "#ffbb3d";
    for (let x = 0; x < 200; x += 3) { const k = Math.floor((x / 200) * A.peaks.length); const hh = Math.max(2, (A.peaks[k] || 0) * 120); g.fillRect(x, 100 - hh / 2, 2, hh); }
  } else { g.fillStyle = "#1b1b25"; g.fillRect(0, 0, 200, 200); }
  const kindLabel = a.kind === "video" ? "Видео" : a.kind === "image" ? "Фото" : a.kind === "audio" ? "Звук" : "Демо";
  return h("div", { class: "tile", role: "button", tabindex: "0", title: a.name, onclick: () => addToTimeline(a), onkeydown: (e) => { if (e.key === "Enter") addToTimeline(a); } },
    cv,
    h("span", { class: `kind ${a.kind}` }, kindLabel),
    a.duration ? h("span", { class: "badge" }, a.kind === "audio" && a.bpm ? `${Math.round(a.bpm)} BPM` : fmtDur(a.duration)) : null,
    !a.analyzed ? h("span", { class: "prog", style: `width:${Math.round((a.progress || 0) * 100)}%` }) : null,
    h("button", { type: "button", class: "x", "aria-label": `Убрать ${a.name}`, onclick: (e) => { e.stopPropagation(); removeAsset(a); } }, icon("close", "s")),
  );
}

function plural(n, forms) {
  const m10 = n % 10, m100 = n % 100;
  return forms[m10 === 1 && m100 !== 11 ? 0 : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? 1 : 2];
}

function addToTimeline(a) {
  if (a.kind === "audio") {
    commit((p) => { p.music = { assetId: a.id, offset: a.analysis ? pickSection(a, S.seq.total) : 0, vol: .9, fadeIn: 0, fadeOut: 1.2 }; });
    toast(`Музыка: ${a.name}`);
    return;
  }
  const beat = 60 / (S.seq?.grid.bpm || 120);
  const len = beat * 2;
  commit((p) => {
    const span = a.kind === "video" ? Math.min(len, Math.max(.2, a.duration - .05)) : len;
    const src = a.kind === "video" ? chooseWindow(a, span, [], rng(Date.now())) : 0;
    p.clips.push({ id: uid("c"), assetId: a.id, len, src, span, ramp: "none", effects: a.kind === "image" ? [{ type: "zoomin", amt: .6 }] : [], tr: { type: "cut", dur: 0 }, vol: 1 });
  });
  toast("Клип добавлен в конец");
}

function removeAsset(a) {
  if (S.recording) return;
  const used = S.plan?.clips.some((c) => c.assetId === a.id) || S.plan?.music?.assetId === a.id;
  S.assets = S.assets.filter((x) => x !== a);
  for (const el of a.pool || []) { try { el.pause(); el.removeAttribute("src"); el.load(); } catch { /* ок */ } }
  if (a.url && !a.demo) URL.revokeObjectURL(a.url);
  if (used) {
    if (visualAssets().length) commit(() => {});
    else { S.plan.clips = []; refresh(); }
  }
  renderAll();
}

/* ================================================================

function openExport() {
  if (!S.seq?.clips.length || S.recording) return;
  stop();
  const wrap = h("div", { class: "sheet-wrap", role: "dialog", "aria-modal": "true", "aria-label": "Экспорт" });
  const sheet = h("div", { class: "sheet" });
  wrap.append(sheet);
  const close = () => { if (S.recording) return; wrap.remove(); };
  wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
  document.body.append(wrap);

  const mime = pickMime();
  const fmt = mime ? (mime.includes("mp4") ? "MP4" : "WebM") : "—";

  const setup = () => {
    const o = S.plan.output;
    const { w, h: hh } = dims(o.aspect, o.quality);
    const mb = ((o.quality >= 1080 ? 12 : o.quality >= 720 ? 7 : 4.5) * S.seq.total) / 8 + .2;
    sheet.replaceChildren(
      h("h2", null, "Экспорт"),
      h("p", { class: "sub" }, `Ролик пишется в реальном времени — ${fmtDur(S.seq.total)}. Держи вкладку открытой.`),
      h("div", { class: "stack" },
        seg([[540, "540p"], [720, "720p"], [1080, "1080p"]], o.quality, (v) => { commit((p) => { p.output.quality = v; }); requestAnimationFrame(fitCanvas); setup(); }, "Качество"),
        seg([[30, "30 к/с"], [60, "60 к/с"]], o.fps, (v) => { commit((p) => { p.output.fps = v; }); setup(); }, "Частота"),
      ),
      h("div", { class: "facts" }, h("span", null, "Кадр ", h("b", null, `${w}×${hh}`)), h("span", null, "Формат ", h("b", null, fmt)), h("span", null, "≈ ", h("b", null, `${mb.toFixed(1)} МБ`))),
      mime ? null : h("div", { class: "sec note warn" }, "Этот браузер не умеет записывать видео со страницы. Открой в Chrome, Edge или свежем Safari."),
      h("div", { class: "sec stack" },
        h("button", { type: "button", class: "cta big", disabled: !mime, onclick: run }, icon("export"), "Записать ролик"),
        h("button", { type: "button", class: "cta big ghost", onclick: close }, "Отмена"),
      ),
    );
  };

  const run = () => {
    const bar = h("i");
    const pct = h("b", null, "0%");
    sheet.replaceChildren(
      h("h2", null, "Записываю…"),
      h("p", { class: "sub" }, "Не переключай вкладку — если всё же уйдёшь, запись встанет на паузу и продолжится, когда вернёшься."),
      h("div", { class: "meter" }, bar),
      h("div", { class: "facts" }, h("span", null, "Готово ", pct), h("span", null, "Длина ", h("b", null, fmtDur(S.seq.total)))),
      h("div", { class: "sec" }, h("button", { type: "button", class: "cta big ghost", onclick: () => { cancelExport(); setup(); } }, "Остановить")),
    );
    startExport({
      onProgress: (p) => { bar.style.width = `${Math.round(p * 100)}%`; pct.textContent = `${Math.round(p * 100)}%`; },
      onDone: (blob, m) => done(blob, m),
      onError: (msg) => { toast(msg, true); setup(); },
    });
  };

  const done = (blob, m) => {
    const url = URL.createObjectURL(blob);
    const video = h("video", { controls: true, playsInline: true, src: url });
    video.addEventListener("loadedmetadata", () => {
      if (video.duration === Infinity) { video.currentTime = 1e7; video.addEventListener("timeupdate", function f() { video.removeEventListener("timeupdate", f); video.currentTime = 0; }); }
    });
    const ext = m.includes("mp4") ? "mp4" : "webm";
    const name = `${(S.plan.texts?.[0]?.text || STYLES[S.plan.style]?.name || "edit").replace(/[^\p{L}\p{N} _-]/gu, "").trim().slice(0, 40) || "edit"}.${ext}`;
    sheet.replaceChildren(
      h("h2", null, "Готово"),
      h("p", { class: "sub" }, `${fmtSize(blob.size)} · ${ext.toUpperCase()} · ${fmtDur(S.seq.total)}`),
      video,
      h("div", { class: "sec stack" },
        S.downloads ? h("button", { type: "button", class: "cta big", onclick: async () => {
          try { await S.downloads.save({ filename: name, data: blob }); toast("Сохранено"); }
          catch (error) {
            const copy = { declined: "Сохранение отменено", too_large: "Файл слишком большой — сними в 720p или короче", rate_limited: "Подожди пару секунд и попробуй снова" };
            toast(copy[error?.code] || "Не удалось сохранить — скачай из меню плеера", true);
          }
        } }, icon("save"), "Сохранить на устройство")
          : h("div", { class: "note" }, "Сохрани через меню плеера выше (⋮ → Скачать)."),
        h("button", { type: "button", class: "cta big ghost", onclick: () => { URL.revokeObjectURL(url); wrap.remove(); } }, "Закрыть"),
      ),
    );
  };

  setup();
}

/* ================================================================
   22. сборка экрана
   ================================================================ */

function renderPanel() {
  const panel = $("panel");
  const active = document.activeElement;
  const focusId = active && panel.contains(active) ? active.id : null;
  const selStart = focusId && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = focusId && "selectionEnd" in active ? active.selectionEnd : null;
  const scrollTop = panel.scrollTop;

  let node;
  if (!S.plan) node = h("div", null, panelTitle("Готовлю стол…", ""));
  else switch (S.tab) {
    case "media": node = panelMedia(); break;
    case "styles": node = panelStyles(); break;
    case "looks": node = panelLooks(); break;
    case "fx": node = panelFx(); break;
    case "speed": node = panelSpeed(); break;
    case "trans": node = panelTrans(); break;
    case "text": node = panelText(); break;
    case "audio": node = panelAudio(); break;
    case "frame": node = panelFrame(); break;
    default: node = panelAI();
  }
  panel.replaceChildren(node);
  panel.scrollTop = scrollTop;
  if (focusId) {
    const el = $(focusId);
    if (el) { el.focus({ preventScroll: true }); try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch { /* не текстовое поле */ } }
  }
}

function renderAll() {
  renderTop();
  renderStage();
  renderStyleBar();
  renderTabs();
  renderTimeline();
  renderCtx();
  renderPanel();
  fitCanvas();
}

let renderQueued = false;
listeners.add(() => {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderTop();
    renderStage();
    renderStyleBar();
    renderTimeline();
    renderCtx();
    // панель с полями ввода не трогаем, пока в ней печатают
    const typing = document.activeElement && $("panel").contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (!typing || S.tab === "media") renderPanel();
  });
});

/* ================================================================
   23. файлы: загрузка и автосборка
   ================================================================ */

async function handleFiles(files) {
  if (!files.length || S.recording) return;
  stop();
  setBusy(`Открываю ${files.length} ${plural(files.length, ["файл", "файла", "файлов"])}…`);
  const { added, problems } = await intake(files);
  if (problems.length) toast(problems.join(" "), true);
  if (!added.length) { setBusy(null); return; }

  const newVisual = added.some((a) => a.kind !== "audio");
  const newAudio = added.some((a) => a.kind === "audio");
  if (newVisual) S.assets = S.assets.filter((a) => !(a.demo && a.kind === "gen"));
  if (newAudio) S.assets = S.assets.filter((a) => !(a.demo && a.kind === "audio"));

  const total = () => S.assets.filter((a) => !a.analyzed).length;
  const tick = setInterval(() => { const left = total(); if (left) setBusy(`Анализирую материал: осталось ${left}…`); }, 300);
  await waitAnalysis();
  clearInterval(tick);

  if (S.plan?.orig?.keep || !musicAssets().length) {
    setBusy("Достаю звук из видео…");
    for (const a of added) if (a.kind === "video") await decodeVideoAudio(a);
  }

  const d = { ...(S.lastAI || {}), style: S.plan?.style || "velocity", texts: currentTexts(), power: S.plan?.power ?? 1, length: S.plan?.length ?? S.lengthPick ?? 15, by: S.lastAI?.by || "local" };
  if (!musicAssets().length) d.keepOrig = true;
  d.notes = `Собрал «${STYLES[d.style].name}» из твоих файлов: резы по битам, самые динамичные куски — по анализу движения.`;
  S.lastAI = d;
  buildFromDecision(d, ++S.seed);
  setBusy(null);
  S.tab = newVisual ? "ai" : "audio";
  renderAll();
  toast(newVisual ? "Эдит пересобран из твоих файлов" : "Трек добавлен — ролик перерезан под его биты");
}

/* ================================================================
   24. запуск
   ================================================================ */

function wireStatic() {
  $("undo").append(icon("undo"));
  $("redo").append(icon("redo"));
  $("export").append(icon("export", "s"), "Экспорт");
  $("zoom-out").append(icon("minus", "s"));
  $("zoom-in").append(icon("plus", "s"));
  $("undo").onclick = undo;
  $("redo").onclick = redo;
  $("export").onclick = openExport;
  $("bigplay").onclick = toggle;
  $("tl-play").onclick = toggle;
  $("screen").addEventListener("click", toggle);
  $("zoom-out").onclick = () => zoomBy(1 / 1.4);
  $("zoom-in").onclick = () => zoomBy(1.4);

  $("picker").onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; handleFiles(f); };
  $("picker-audio").onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; handleFiles(f); };

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { if (e.dataTransfer?.types?.includes("Files")) { dragDepth += 1; $("app").classList.add("drop-over"); } });
  window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("app").classList.remove("drop-over"); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("app").classList.remove("drop-over"); handleFiles([...(e.dataTransfer?.files || [])]); });

  $("tl-scroll").addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); } }, { passive: false });

  window.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
    if (typing || S.recording) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
    else if (e.key.toLowerCase() === "s" && !mod && selectedClip()) splitAt(S.sel.id, S.cursor);
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel) {
      e.preventDefault();
      if (S.sel.kind === "clip" && S.plan.clips.length > 1) deleteClip(S.sel.id);
      if (S.sel.kind === "text") { commit((p) => { p.texts = p.texts.filter((x) => x.id !== S.sel.id); }); S.sel = null; renderAll(); }
    }
    else if (e.key === "ArrowRight") { e.preventDefault(); seekTo(S.cursor + (e.shiftKey ? 1 : 1 / (S.plan?.output.fps || 30))); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seekTo(S.cursor - (e.shiftKey ? 1 : 1 / (S.plan?.output.fps || 30))); }
    else if (e.key === "Escape") { S.sel = null; renderAll(); }
  });

  new ResizeObserver(() => { fitCanvas(); renderTimeline(); }).observe($("screen-wrap"));
  window.addEventListener("resize", () => { fitCanvas(); renderTimeline(); });
}

async function boot() {
  wireStatic();
  renderAll();
  setBusy("Синтезирую бит и собираю демо-эдит…");
  try { await Promise.race([document.fonts?.load?.('900 40px "Unbounded"').then(() => document.fonts.ready), sleep(2500)]); } catch { /* шрифты подтянутся позже */ }
  await loadDemo();
  S.lastAI = { style: "amv", texts: [{ text: "монтаж под бит", anim: "beat", style: "neon", pos: "center", color: "#1ee3ff" }], power: 1, length: 15, by: "local",
    notes: "Демо: графика и фонк-бит сгенерированы в браузере. Резы — на битах, на дропе комбо из вспышки, панча и RGB, на смене фразы — эхо и спин. Переключай стили в полоске над таймлайном." };
  const plan = autoEdit({ ...S.lastAI, seed: 7 });
  plan.by = "demo";
  S.plan = plan;
  refresh(false);
  fitZoom();
  setBusy(null);
  renderAll();

  if (typeof window.claude?.use === "function") {
    try { S.sample = await window.claude.use("sample"); } catch { S.sample = null; }
    try { S.downloads = await window.claude.use("downloads"); } catch { S.downloads = null; }
    if (S.sample?.limits) { try { const lim = await S.sample.limits(); S.sampleImages = !!lim?.images; } catch { S.sampleImages = false; } }
    renderAll();
