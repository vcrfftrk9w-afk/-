<!doctype html><html><head><meta charset="utf-8"></head><body><div id="h"></div>
<script src="../js/lexer.js"></script><script src="../js/glossary.js"></script><script src="../js/errors.js"></script>
<script src="../js/runner.js"></script><script src="../js/md.js"></script>
<script>
// подключаем файлы курса в том же порядке, что и index.html
window.COURSE = [];
</script>
<script>
(function(){
  var x = new XMLHttpRequest(); x.open('GET', '../index.html', false); x.send();
  var srcs = x.responseText.match(/course\/[\w-]+\.js/g) || [];
  srcs.forEach(function(s){ document.write('<script src="../' + s + '"><\/script>'); });
})();
</script>
<script>
window.runIt = (code, o) => new Promise(res => {
  const logs = [], errs = [];
  Runner.run(Object.assign({ host: document.getElementById('h'), code,
    onLog: l => logs.push(l.text), onError: e => errs.push(e), onDone: r => res({ r, logs, errs }) }, o || {}));
});
</script>
</body></html>
