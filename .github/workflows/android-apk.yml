name: Android APK

# Собирает приложение для Android. Готовый APK — во вложении «lenivec-apk» у запуска
# (Actions → Android APK → последний запуск → Artifacts), а сборка из main ещё и по прямой ссылке
# для телефона: https://github.com/vcrfftrk9w-afk/-/releases/download/android/lenivec.apk
on:
  push:
    branches: [main, claude/self-development-adhd-app-5xswyf]
    paths: ['index.html', 'manifest.json', 'css/**', 'js/**', 'icons/**', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write # выложить APK в Releases (прямая ссылка для телефона)

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Проверить APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|js/app.js|js/android.js)'
          cp "$APK" lenivec.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lenivec-apk
          path: lenivec.apk
          retention-days: 30

      # одна и та же ссылка на последнюю сборку — открывается на телефоне без входа в GitHub
      - name: Выложить APK по прямой ссылке
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Приложение для Android" \
            --notes "Последняя сборка приложения. Скачай lenivec.apk на телефоне и установи поверх старого — прогресс сохранится."
          gh release upload android lenivec.apk --clobber
