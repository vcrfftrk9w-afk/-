  ["punch", ["сочн", "ярк", "насыщ"]],
  ["dream", ["розов", "мечт"]],
];
const TSTYLE_WORDS = [["neon", ["неон"]], ["box", ["плашк", "тикток"]], ["y2k", ["хром", "y2k"]], ["minimal", ["тонк", "минимал"]], ["subtitle", ["субтитр"]], ["bold", ["жирн", "крупн"]]];

function localDirector(text) {
  const low = String(text || "").toLowerCase();
  const style = (STYLE_WORDS.find(([, ws]) => ws.some((w) => low.includes(w))) || ["velocity"])[0];
  const look = (LOOK_WORDS.find(([, ws]) => ws.some((w) => low.includes(w))) || [null])[0];
  const tstyle = (TSTYLE_WORDS.find(([, ws]) => ws.some((w) => low.includes(w))) || [null])[0];

  let length = null;
  const sec = /(\d+(?:[.,]\d+)?)\s*(?:сек|с\b|s\b|sec)/.exec(low);
  const min = /(\d+(?:[.,]\d+)?)\s*(?:мин|min)/.exec(low);
  if (min) length = Number(min[1].replace(",", ".")) * 60;
  else if (sec) length = Number(sec[1].replace(",", "."));
  if (/весь трек|целиком трек|под весь|всю песню/.test(low)) length = "track";

  const power = /чуть|слегка|немного|лайт|мягко/.test(low) ? .55 : /очень|максим|жёстко|жестко|сильно|хард|имб/.test(low) ? 1.3 : 1;
  const texts = [];
  for (const m of String(text || "").matchAll(/[«"“„']([^«»"“”„']{1,120})[»"”']/g)) texts.push({ text: m[1].trim(), style: tstyle || undefined });

  let aspect = null;
  if (/горизонт|ютуб|youtube|16:9|широк/.test(low)) aspect = "16:9";
  else if (/квадрат|1:1/.test(low)) aspect = "1:1";
  else if (/4:5|пост в ленту|инстаграм пост/.test(low)) aspect = "4:5";
  else if (/вертикал|рилс|reels|тикток|tiktok|shorts|шортс|9:16/.test(low)) aspect = "9:16";

  const keepOrig = /без музык|оригинальн(ый|ым) звук|со звуком видео/.test(low) ? true : /без звука|заглуш|без оригинал/.test(low) ? false : undefined;

  return {
    style, look, power, length, texts, aspect, keepOrig,
    notes: `Стиль «${STYLES[style].name}»${look ? `, цвет «${LOOKS[look].name}»` : ""}${texts.length ? `, надпись «${texts[0].text}»` : ""}. Резы — по битам, лучшие куски видео выбраны по движению.`,
    by: "local",
  };
}

async function contactSheet() {
  const list = visualAssets().filter((a) => !a.demo || !visualAssets().some((x) => !x.demo)).slice(0, 12);
  if (!list.length) return null;
  const cols = Math.min(4, list.length), rows = Math.ceil(list.length / cols);
  const cw = 200, ch = 150;
  const c = document.createElement("canvas");
  c.width = cols * cw; c.height = rows * ch;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  list.forEach((a, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    const th = a.thumbs?.[Math.floor((a.thumbs.length - 1) / 2)]?.c;
    if (th) {
      const s = Math.max(cw / th.width, ch / th.height);
      g.drawImage(th, x + (cw - th.width * s) / 2, y + (ch - th.height * s) / 2, th.width * s, th.height * s);
    }
    g.fillStyle = "#000c"; g.fillRect(x, y, 38, 28);
    g.fillStyle = "#fff"; g.font = "bold 18px sans-serif"; g.fillText(`#${i + 1}`, x + 5, y + 20);
  });
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", .82));
  return { blob, list };
}

async function claudeDirector(text, signal) {
  const visuals = visualAssets().filter((a) => !a.demo || !visualAssets().some((x) => !x.demo));
  const music = musicAssets().find((a) => !a.demo && a.analysis) || musicAssets().find((a) => a.analysis);
  let images;
  let shown = visuals.slice(0, 12);
  if (S.sampleImages) {
    const sheet = await contactSheet().catch(() => null);
    if (sheet) { images = sheet.blob; shown = sheet.list; }
  }
  const lines = shown.map((a, i) => `#${i + 1} id=${a.id} ${a.kind === "image" ? "фото" : a.kind === "gen" ? "демо-графика" : `видео ${a.duration.toFixed(1)}с`} «${a.name}»`);
  const prompt = [
    "Ты — монтажёр коротких эдитов для Reels/TikTok. Реши, КАК смонтировать ролик; точные резы по битам сделает движок.",
    images ? "На картинке — кадры материала, подписаны номерами как в списке ниже." : "",
    "",
    "Материал:", ...lines,
    music ? `Музыка: «${music.name}», ${music.bpm} BPM, ${music.duration.toFixed(0)} с.` : "Музыки нет — движок режет по ровной сетке 120 BPM.",
    "",
    `Стили: ${STYLE_IDS.map((id) => `${id} (${STYLES[id].name}: ${STYLES[id].tag})`).join("; ")}.`,
    `Цвет (look): ${Object.keys(LOOKS).map((id) => `${id} (${LOOKS[id].name})`).join(", ")}.`,
    `Стили надписей: ${Object.keys(TEXT_STYLES).join(", ")}. Анимации: ${Object.keys(TEXT_ANIMS).join(", ")}.`,
    "",
    "Ответь ТОЛЬКО JSON-объектом:",
    '{"style":"id","look":"id","power":0.5-1.4,"length":10|15|20|30|"track","order":["id в порядке показа, самое цепляющее первым"],',
    '"texts":[{"text":"короткая надпись","style":"id","anim":"id","pos":"top|center|bottom","where":"start|drop|end"}],',
    '"aspect":"9:16|4:5|1:1|16:9","keepOrig":true|false,"notes":"1-2 предложения на языке запроса: какой эдит и почему"}',
    "",
    "Правила: надписи — на языке запроса, короткие (до 5 слов); текст в кавычках из запроса переноси дословно.",
    "Если пользователь не просил надпись — можно не добавлять или добавить одну уместную по кадрам.",
    "power — сила эффектов на бите. Не выдумывай id.",
    "",
    "Запрос:", String(text).slice(0, 1500),
  ].filter((l) => l !== null).join("\n");

  const raw = await S.sample.json(prompt, { modelTier: "default", cache: false, signal, ...(images ? { images } : {}) });
  if (!raw || typeof raw !== "object") throw { code: "invalid_json" };
  return {
    style: STYLES[raw.style] ? raw.style : "velocity",
    look: LOOKS[raw.look] ? raw.look : null,
    power: clamp(num(raw.power, 1), .3, 1.5),
    length: raw.length === "track" ? "track" : raw.length != null ? clamp(num(raw.length, 15), 5, 120) : null,
    order: Array.isArray(raw.order) ? raw.order.map(String) : null,
    texts: (Array.isArray(raw.texts) ? raw.texts : []).slice(0, 4).map((t) => ({
      text: String(t?.text || "").slice(0, 80),
      style: TEXT_STYLES[t?.style] ? t.style : undefined,
      anim: TEXT_ANIMS[t?.anim] ? t.anim : undefined,
      pos: t?.pos, where: t?.where,
    })).filter((t) => t.text.trim()),
    aspect: ASPECTS[raw.aspect] ? raw.aspect : null,
    keepOrig: typeof raw.keepOrig === "boolean" ? raw.keepOrig : undefined,
    notes: String(raw.notes || "").slice(0, 400),
    by: "claude",
  };
}

const SAMPLE_COPY = {
  not_granted: "Доступ к Claude не выдан — смонтировал по разбору фразы.",
  sampling_disabled: "Claude недоступен на этом аккаунте — смонтировал по разбору фразы.",
  rate_limited: "Claude сейчас занят — смонтировал по разбору фразы.",
  session_expired: "Сессия Claude истекла — смонтировал по разбору фразы.",
  invalid_json: "Claude ответил не по форме — смонтировал по разбору фразы.",
  refused: "Claude не взялся за запрос — смонтировал по разбору фразы.",
  images_unavailable: "Claude не смог посмотреть кадры — смонтировал по разбору фразы.",
};

/* ================================================================
   9. лента: план -> то, что можно рисовать
   ================================================================ */

const canvas = $("screen");
const ctx = canvas.getContext("2d", { alpha: false });
const mk = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d")]; };
const [layA, gA] = mk();
const [layB, gB] = mk();
const [tmpR, gR] = mk();
const [tmpC, gC] = mk();
const [tmpX, gX] = mk();
const [small, gS] = mk();
const [genCan, gGen] = mk();
let grainTile = null, scanTile = null;
let SEQ_V = 0;

function makeTiles() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) { const v = 70 + Math.random() * 116; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  grainTile = c;
  const s = document.createElement("canvas"); s.width = 4; s.height = 4;
  const sg = s.getContext("2d");
  sg.fillStyle = "rgba(0,0,0,.28)"; sg.fillRect(0, 2, 4, 1.4);
  scanTile = s;
}

function compileFx(effects) {
  const fx = { css: [], zoom: null, mirror: false, shake: 0, glitch: 0, pixel: 0, glow: 0, tilt: 0, strobe: 0 };
  for (const e of effects || []) {
    const a = clamp(num(e.amt, .7), 0, 1);
    switch (e.type) {
      case "mirror": fx.mirror = true; break;
      case "zoomin": fx.zoom = [1, 1 + .28 * a]; break;
      case "zoomout": fx.zoom = [1 + .28 * a, 1]; break;
      case "shake": fx.shake = a; break;
      case "glitch": fx.glitch = a; break;
      case "pixelate": fx.pixel = Math.round(lerp(70, 16, a)); break;
      case "blur": fx.css.push(`blur(${(2 + 10 * a).toFixed(1)}px)`); break;
      case "glow": fx.glow = .25 + .4 * a; break;
      case "invert": fx.css.push("invert(1)"); break;
      case "bw": fx.css.push(`grayscale(${a})`); break;
      case "tilt": fx.tilt = .02 + .06 * a; break;
      case "strobe": fx.strobe = a; break;
      default: break;
    }
  }
  return fx;
}

function buildSeq(plan) {
  const { w, h } = dims(plan.output.aspect, plan.output.quality);
  for (const c of [canvas, layA, layB, tmpR, tmpC, tmpX]) { if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } }
  genCan.width = Math.round(w / 2); genCan.height = Math.round(h / 2);
  if (!grainTile) makeTiles();

  const old = S.seq;
  const oldEls = new Map();
  if (old) for (const c of old.clips) if (c.el) oldEls.set(c.id, c.el);

  let at = 0;
  const clips = plan.clips.map((c, i) => {
    const asset = assetById(c.assetId);
    const prev = plan.clips[i - 1];
    const next = plan.clips[i + 1];
    const trIn = i === 0 || c.tr.type === "cut" ? 0 : Math.min(c.tr.dur, c.len * .9, prev.len * .9);
    const trOut = !next || next.tr.type === "cut" ? 0 : Math.min(next.tr.dur, c.len * .9, next.len * .9);
    const node = {
      ...c, index: i, asset, at,
      tIn: Math.max(0, at - trIn / 2), tOut: at + c.len + trOut / 2,
      trIn, trOut, fx: compileFx(c.effects),
      el: oldEls.get(c.id) || null,
    };
    at += c.len;
    return node;
  });
  // освобождаем видео, клипов которых больше нет
  for (const [id, el] of oldEls) if (!clips.some((c) => c.id === id)) poolPut(el);

  const total = at;
  if (clips.length) clips[clips.length - 1].tOut = total;
  const look = LOOKS[plan.look?.id] || LOOKS.none;
  const amt = clamp(num(plan.look?.amt, 1), 0, 1.2);
  const music = plan.music ? assetById(plan.music.assetId) : null;

  S.seq = {
    plan, clips, total, w, h,
    grid: gridFor(plan, total),
    lookCss: look.css ? look.css(amt) : "",
    lookTint: look.tint ? look.tint(amt) : null,
    lookGrade: look.grade ? look.grade(amt) : 0,
    lookBloom: look.bloom ? look.bloom(amt) : 0,
    music,
    version: ++SEQ_V,
  };
  S.cursor = clamp(S.cursor, 0, Math.max(0, total - .001));
  return S.seq;
}

/** Где в исходнике мы находимся в момент t ролика (с учётом кривой скорости). */
function srcAt(c, t) {
  if (c.asset.kind === "image") return 0;
  const base = c.span / c.len;
  const d = t - c.at;
  const u = d / c.len;
  let s;
  if (u < 0) s = c.src + d * base * rampR(c.ramp, 0) / rampMean(c.ramp);
  else if (u > 1) s = c.src + c.span + (d - c.len) * base * rampR(c.ramp, 1) / rampMean(c.ramp);
  else s = c.src + c.span * rampF(c.ramp, u);
  if (c.asset.kind === "video") return clamp(s, 0, Math.max(0, c.asset.duration - .04));
  return Math.max(0, s);
}
function rateAt(c, t) {
  const u = (t - c.at) / c.len;
  return (c.span / c.len) * rampR(c.ramp, u) / rampMean(c.ramp);
}

/* ================================================================
   10. рисование кадра
   ================================================================ */

function thumbAt(asset, s) {
  const th = asset.thumbs;
  if (!th || !th.length) return null;
  let best = th[0], d = Infinity;
  for (const x of th) { const dd = Math.abs(x.t - s); if (dd < d) { d = dd; best = x; } }
  return best.c;
}

function sourceFor(c, t) {
  const a = c.asset;
  if (a.kind === "image") return { el: a.el, w: a.w, h: a.h };
  if (a.kind === "gen") {
    GENS[a.genId].draw(gGen, srcAt(c, t), genCan.width, genCan.height);
    return { el: genCan, w: genCan.width, h: genCan.height };
  }
  const v = c.el;
  if (v && v.readyState >= 2 && v.videoWidth && !v.seeking) { c.lastOk = true; return { el: v, w: v.videoWidth, h: v.videoHeight }; }
  if (v && v.readyState >= 2 && v.videoWidth && c.lastOk) return { el: v, w: v.videoWidth, h: v.videoHeight };
  const th = thumbAt(a, srcAt(c, t));
  return th ? { el: th, w: th.width, h: th.height } : null;
}

function drawClip(g, c, t, seq) {
  const W = seq.w, H = seq.h;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";
  g.filter = "none";
  g.fillStyle = "#000";
  g.fillRect(0, 0, W, H);
  const src = sourceFor(c, t);
  if (!src || !src.w) return;

  const fx = c.fx;
  const local = t - c.at;
  const u = clamp(local / c.len, 0, 1);
  const fit = seq.plan.output.fit;

  let zoom = fx.zoom ? lerp(fx.zoom[0], fx.zoom[1], ease(u)) : 1;
  let ox = 0, oy = 0, rot = 0;
  if (fx.shake) { ox += Math.sin(local * 31) * fx.shake * W * .025; oy += Math.cos(local * 27) * fx.shake * W * .025; zoom *= 1 + fx.shake * .06; }
  if (fx.tilt) { rot = Math.sin(local * 1.3) * fx.tilt; zoom *= 1 + fx.tilt * 1.2; }

  const filters = [seq.lookCss, ...fx.css];
  if (fx.strobe && Math.floor(local * 12) % 2) filters.push(`brightness(${1 + fx.strobe * 1.2}) contrast(1.3)`);
  const filter = filters.filter(Boolean).join(" ") || "none";

  if (fit === "blur") {
    const sw = Math.max(8, Math.round(W / 10)), sh = Math.max(8, Math.round(H / 10));
    if (small.width !== sw || small.height !== sh) { small.width = sw; small.height = sh; }
    const s0 = Math.max(sw / src.w, sh / src.h);
    gS.imageSmoothingEnabled = true;
    gS.filter = "none";
    gS.drawImage(src.el, (sw - src.w * s0) / 2, (sh - src.h * s0) / 2, src.w * s0, src.h * s0);
    g.filter = `${filter === "none" ? "" : filter} brightness(.62) saturate(1.15)`.trim();
    g.drawImage(small, -W * .05, -H * .05, W * 1.1, H * 1.1);
    g.filter = "none";
  }

  const cover = fit === "cover";
  const base = cover ? Math.max(W / src.w, H / src.h) : Math.min(W / src.w, H / src.h);
  const s = base * zoom;
  const dw = src.w * s, dh = src.h * s;

  g.save();
  g.translate(W / 2 + ox, H / 2 + oy);
  if (rot) g.rotate(rot);
  if (fx.mirror) g.scale(-1, 1);
  g.filter = filter;
  if (fx.pixel) {
    const pw = Math.max(8, Math.round(W / fx.pixel)), ph = Math.max(8, Math.round((pw * H) / W));
    small.width = pw; small.height = ph;
    gS.imageSmoothingEnabled = true;
    gS.drawImage(src.el, (pw - dw * pw / W) / 2, (ph - dh * ph / H) / 2, dw * pw / W, dh * ph / H);
    g.imageSmoothingEnabled = false;
    g.drawImage(small, -W / 2, -H / 2, W, H);
    g.imageSmoothingEnabled = true;
  } else {
    g.drawImage(src.el, -dw / 2, -dh / 2, dw, dh);
  }
  g.filter = "none";
  g.restore();

  if (fx.glow) bloom(g, W, H, fx.glow);

  if (fx.glitch) {
    const f = Math.floor(local * 20);
    const cv = g.canvas;
    for (let k = 0; k < 4; k += 1) {
      if (hash(f * 13 + k) > .6 * fx.glitch + .2) continue;
      const y = hash(f * 7 + k * 3) * H;
      const hh = H * (.015 + hash(f + k * 11) * .06);
      const dx = (hash(f * 3 + k) - .5) * W * .12 * fx.glitch;
      g.drawImage(cv, 0, y, W, hh, dx, y, W, hh);
    }
  }
}

/** Дешёвое свечение: уменьшить кадр и положить поверх «экраном». */
function bloom(g, W, H, amount) {
  const sw = Math.max(8, Math.round(W / 8)), sh = Math.max(8, Math.round(H / 8));
  if (small.width !== sw || small.height !== sh) { small.width = sw; small.height = sh; }
  gS.filter = "none";
  gS.imageSmoothingEnabled = true;
  gS.drawImage(g.canvas, 0, 0, sw, sh);
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "screen";
  g.globalAlpha = amount;
  g.imageSmoothingEnabled = true;
  g.drawImage(small, 0, 0, W, H);
  g.restore();
}

/* ---------- переходы ---------- */

function drawTransition(g, A, B, type, p, W, H, extra) {
  const e = ease(p);
  switch (type) {
    case "fade":
      g.drawImage(A, 0, 0); g.globalAlpha = p; g.drawImage(B, 0, 0); g.globalAlpha = 1; break;
    case "flash":
      g.drawImage(p < .5 ? A : B, 0, 0); extra.flash = Math.max(extra.flash, 1 - Math.abs(p - .5) * 2); break;
    case "fadeblack":
      if (p < .5) { g.drawImage(A, 0, 0); g.fillStyle = "#000"; g.globalAlpha = p * 2; g.fillRect(-W, -H, W * 3, H * 3); }
      else { g.drawImage(B, 0, 0); g.fillStyle = "#000"; g.globalAlpha = (1 - p) * 2; g.fillRect(-W, -H, W * 3, H * 3); }
      g.globalAlpha = 1; break;
    case "zoomin": {
      const k = p < .5 ? 1 + ease(p * 2) * .7 : 1 + (1 - ease((p - .5) * 2)) * .5;
      g.save(); g.translate(W / 2, H / 2); g.scale(k, k); g.translate(-W / 2, -H / 2);
      g.filter = `blur(${(Math.sin(p * Math.PI) * W * .012).toFixed(1)}px)`;
      g.drawImage(p < .5 ? A : B, 0, 0);
      g.restore(); g.filter = "none";
      extra.flash = Math.max(extra.flash, Math.max(0, 1 - Math.abs(p - .5) * 5) * .5);
      break;
    }
    case "whip": {
      const blur = Math.sin(p * Math.PI) * W * .03;
      g.filter = `blur(${blur.toFixed(1)}px)`;
      g.drawImage(A, -W * e, 0); g.drawImage(B, W * (1 - e), 0);
      g.filter = "none"; break;
    }
    case "spin": {
      const src = p < .5 ? A : B;
      const ang = p < .5 ? ease(p * 2) * Math.PI * .6 : -(1 - ease((p - .5) * 2)) * Math.PI * .6;
      const sc = 1 + Math.sin(p * Math.PI) * .35;
      g.save(); g.translate(W / 2, H / 2); g.rotate(ang); g.scale(sc, sc); g.translate(-W / 2, -H / 2);
      g.filter = `blur(${(Math.sin(p * Math.PI) * W * .01).toFixed(1)}px)`;
      g.drawImage(src, 0, 0); g.restore(); g.filter = "none"; break;
    }
    case "glitch": {
      g.drawImage(p < .5 ? A : B, 0, 0);
      const other = p < .5 ? B : A;
      const f = Math.floor(p * 18);
      for (let k = 0; k < 7; k += 1) {
        if (hash(f * 5 + k) < .35) continue;
        const y = hash(f * 9 + k) * H, hh = H * (.03 + hash(f + k) * .1), dx = (hash(f * 2 + k * 7) - .5) * W * .2;
        g.drawImage(other, 0, y, W, hh, dx, y, W, hh);
      }
      extra.rgb = Math.max(extra.rgb, Math.sin(p * Math.PI) * .9);
      break;
    }
    case "slideleft": g.drawImage(A, -W * e, 0); g.drawImage(B, W * (1 - e), 0); break;
    case "slideup": g.drawImage(A, 0, -H * e); g.drawImage(B, 0, H * (1 - e)); break;
    case "wipe":
      g.drawImage(A, 0, 0); g.save(); g.beginPath(); g.rect(0, 0, W * e, H); g.clip(); g.drawImage(B, 0, 0); g.restore(); break;
    case "circle": {
      g.drawImage(A, 0, 0); g.save(); g.beginPath(); g.arc(W / 2, H / 2, e * Math.hypot(W, H) * .55, 0, Math.PI * 2); g.clip(); g.drawImage(B, 0, 0); g.restore(); break;
    }
    case "pixelize": {
      const k = Math.sin(p * Math.PI);
      const pw = Math.max(6, Math.round(lerp(W, 18, k))), ph = Math.max(6, Math.round((pw * H) / W));
      small.width = pw; small.height = ph;
      gS.imageSmoothingEnabled = true;
      gS.drawImage(p < .5 ? A : B, 0, 0, pw, ph);
      g.imageSmoothingEnabled = false; g.drawImage(small, 0, 0, W, H); g.imageSmoothingEnabled = true; break;
    }
    default:
      g.drawImage(p < .5 ? A : B, 0, 0);
  }
}

/* ---------- эффекты на бите ---------- */

function beatFxAt(seq, t) {
  const B = seq.plan.beat || {};
  const out = { zoom: 0, shake: 0, sx: 0, sy: 0, rot: 0, flash: 0, rgb: 0, blur: 0, hit: 0 };
  const grid = seq.grid;
  const every = Math.max(1, B.every || 1);
  let j = beatIndexAt(grid, t);
  let guard = 0;
  while (j >= 0 && guard < 8 && ((grid.index[j] % every) + every) % every !== 0) { j -= 1; guard += 1; }
  if (j < 0) return out;
  const dt = t - grid.beats[j];
  const e = Math.exp(-dt / .11);
  const strong = grid.down[j] ? 1 : .72;
  out.hit = e;
  const m = Math.min(seq.w, seq.h);
  out.zoom = (B.zoom || 0) * .13 * e * strong;
  const sh = (B.shake || 0) * e * strong;
  if (sh > .002) {
    const a = hash(j * 3.3) * Math.PI * 2;
    const wob = Math.sin(dt * 70);
    out.sx = Math.cos(a) * sh * m * .045 * wob;
    out.sy = Math.sin(a) * sh * m * .045 * wob;
    out.rot = (hash(j * 7.1) - .5) * sh * .06 * wob;
    out.shake = sh;
  }
  out.rgb = (B.rgb || 0) * e;
  out.blur = (B.blur || 0) * e * (m / 720) * 7;
  let d = j;
  while (d >= 0 && !grid.down[d]) d -= 1;
  if (d >= 0) out.flash = (B.flash || 0) * Math.exp(-(t - grid.beats[d]) / .09) * .85;
  return out;
}

function rgbSplit(W, H, px) {
  gR.globalCompositeOperation = "copy"; gR.drawImage(canvas, 0, 0);
  gR.globalCompositeOperation = "multiply"; gR.fillStyle = "#ff0000"; gR.fillRect(0, 0, W, H);
  gC.globalCompositeOperation = "copy"; gC.drawImage(canvas, 0, 0);
  gC.globalCompositeOperation = "multiply"; gC.fillStyle = "#00ffff"; gC.fillRect(0, 0, W, H);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "copy";
  ctx.drawImage(tmpC, -px, 0);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(tmpR, px, 0);
  ctx.restore();
}

/* ---------- атмосфера ---------- */

function drawOverlays(seq, t, bfx) {
  const W = seq.w, H = seq.h;
  const o = seq.plan.overlay || {};
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (seq.lookGrade) {
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#ffb066"); gr.addColorStop(1, "#0b3d4a");
    ctx.globalCompositeOperation = "soft-light"; ctx.globalAlpha = seq.lookGrade;
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  if (seq.lookTint) {
    ctx.globalCompositeOperation = "soft-light"; ctx.globalAlpha = seq.lookTint[1];
    ctx.fillStyle = seq.lookTint[0]; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  if (seq.lookBloom) bloom(ctx, W, H, seq.lookBloom);

  if (o.leak > .01) {
    ctx.globalCompositeOperation = "screen";
    const R = Math.max(W, H) * .7;
    const spots = [["255,140,60", .9, 0], ["255,60,140", .6, 2.1]];
    for (const [c, sp, ph] of spots) {
      const x = W * (.5 + .6 * Math.sin(t * .23 * sp + ph)), y = H * (.3 + .5 * Math.cos(t * .17 * sp + ph));
      const gr = ctx.createRadialGradient(x, y, 0, x, y, R);
      const a = o.leak * (.35 + .25 * Math.sin(t * .9 + ph));
      gr.addColorStop(0, `rgba(${c},${a.toFixed(3)})`); gr.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  if (o.vhs > .01) {
    ctx.globalAlpha = o.vhs;
    ctx.fillStyle = ctx.createPattern(scanTile, "repeat");
    ctx.fillRect(0, 0, W, H);
    const band = (t * .18) % 1.4 - .2;
    if (band > 0 && band < 1) {
      const y = band * H, bh = H * .05;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = .12 * o.vhs;
      ctx.drawImage(grainTile, 0, 0, 128, 8, -hash(Math.floor(t * 30)) * 40, y, W + 40, bh);
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalAlpha = o.vhs;
    const fs = Math.round(Math.min(W, H) * .045);
    ctx.font = `700 ${fs}px "JetBrains Mono", monospace`;
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#fff8"; ctx.shadowBlur = fs * .3;
    ctx.textBaseline = "top"; ctx.textAlign = "left";
    ctx.fillText(Math.floor(t * 2) % 2 ? "PLAY ▶" : "PLAY  ", W * .07, H * .06);
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    const secs = Math.floor(t) + 14 * 60 + 23;
    ctx.fillText(`${String(Math.floor(secs / 60) % 12 || 12).padStart(2, " ")}:${String(secs % 60).padStart(2, "0")} PM`, W * .93, H * .9);
    ctx.fillText("SEP. 23 2002", W * .93, H * .94);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  if (o.grain > .01) {
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = o.grain;
    const f = Math.floor(t * 24);
    ctx.save();
    ctx.translate(-hash(f) * 120, -hash(f + 1) * 120);
    ctx.fillStyle = ctx.createPattern(grainTile, "repeat");
    ctx.fillRect(0, 0, W + 128, H + 128);
    ctx.restore();
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }

  if (o.vignette > .01) {
    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .28, W / 2, H / 2, Math.hypot(W, H) * .55);
    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, `rgba(0,0,0,${(o.vignette * .85).toFixed(3)})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  if (o.bars > .01) {
    const target = W > H ? H - W / 2.39 : H * .2;
    const bar = Math.round((target / 2) * o.bars);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
  }

  if (bfx.flash > .01) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = clamp(bfx.flash, 0, 1);
    ctx.fillStyle = seq.plan.flashColor || "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- надписи ---------- */

const backOut = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

function wrapLines(g, text, maxW) {
  const out = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/).filter(Boolean)) {
      const next = line ? `${line} ${word}` : word;
      if (line && g.measureText(next).width > maxW) { out.push(line); line = word; } else line = next;
    }
    if (line) out.push(line);
  }
  return out.slice(0, 5);
}

function textFont(style, size) {
  switch (style) {
    case "bold": return [`900 ${size}px Unbounded, "Arial Black", sans-serif`, size];
    case "neon": return [`700 ${size}px Unbounded, "Arial Black", sans-serif`, size];
    case "y2k": return [`900 ${size}px Unbounded, "Arial Black", sans-serif`, size];
    case "box": { const px = Math.round(size * .78); return [`700 ${px}px "Golos Text", system-ui, sans-serif`, px]; }
    case "minimal": { const px = Math.round(size * .6); return [`500 ${px}px "Golos Text", system-ui, sans-serif`, px]; }
    default: { const px = Math.round(size * .56); return [`600 ${px}px "Golos Text", system-ui, sans-serif`, px]; }
  }
}

function drawTexts(seq, t, bfx) {
  const W = seq.w, H = seq.h;
  for (const tx of seq.plan.texts || []) {
    const local = t - tx.at;
    if (local < 0 || local > tx.len) continue;
    drawTextItem(ctx, tx, local, t, seq, W, H, bfx);
  }
}

function drawTextItem(g, tx, local, t, seq, W, H, bfx) {
  const size = Math.round(Math.min(W, H) * (W < H ? .1 : .075) * (tx.size || 1));
  let content = tx.text;
  let scale = 1, alpha = 1, dx = 0, dy = 0, rot = 0;
  const tail = clamp((tx.len - local) / .18, 0, 1);

  switch (tx.anim) {
    case "pop": { const k = clamp(local / .32, 0, 1); scale = .3 + .7 * backOut(k); alpha = tail; break; }
    case "fade": alpha = clamp(Math.min(local / .35, (tx.len - local) / .35), 0, 1); break;
    case "slide": { const k = ease(local / .42); dy = (1 - k) * H * .07; alpha = Math.min(clamp(k * 1.6, 0, 1), tail); break; }
    case "type": {
      const chars = [...tx.text];
      const span = Math.max(.35, Math.min(1.4, tx.len * .5));
      content = chars.slice(0, Math.max(1, Math.ceil(chars.length * clamp(local / span, 0, 1)))).join("");
      alpha = tail; break;
    }
    case "beat": {
      const words = tx.text.split(/\s+/).filter(Boolean);
      const marks = [tx.at];
      for (const b of seq.grid.beats) if (b > tx.at + .06 && b < tx.at + tx.len) marks.push(b);
      let idx = 0;
      for (let i = 0; i < marks.length; i += 1) if (marks[i] <= t) idx = i;
      content = idx < words.length ? words[idx] : tx.text;
      const since = t - marks[idx];
      scale = 1 + .38 * Math.exp(-since / .07);
      alpha = tail;
      break;
    }
    case "slam": {
      const k = clamp(local / .16, 0, 1);
      scale = lerp(2.6, 1, ease(k));
      alpha = Math.min(clamp(k * 3, 0, 1), tail);
      const e = Math.exp(-Math.max(0, local - .16) / .12) * (k >= 1 ? 1 : 0);
      dx = Math.sin(local * 90) * e * size * .12; dy = Math.cos(local * 80) * e * size * .1;
      break;
    }
    case "shake": {
      alpha = tail;
      const e = bfx.hit;
      dx = Math.sin(t * 80) * e * size * .12; dy = Math.cos(t * 73) * e * size * .1; rot = Math.sin(t * 50) * e * .06;
      break;
    }
    default: alpha = 1;
  }
  if (alpha <= .01 || !content) return;

  const style = tx.style || "bold";
  if (style === "bold" || style === "y2k") content = content.toUpperCase();

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = alpha;
  const [font, fontPx] = textFont(style, size);
  g.font = font;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineJoin = "round";
  if ("letterSpacing" in g) g.letterSpacing = style === "minimal" ? `${Math.round(size * .12)}px` : "0px";

  const lines = wrapLines(g, content, W * .86);
  const lh = fontPx * 1.12;
  const y0 = tx.pos === "top" ? H * .17 : tx.pos === "center" ? H * .5 : H * (style === "subtitle" ? .87 : .8);
  const blockH = lh * lines.length;

  g.translate(W / 2 + dx + bfx.sx * .6, y0 + dy + bfx.sy * .6);
  if (rot) g.rotate(rot);
  if (scale !== 1) g.scale(scale, scale);
  if (style === "y2k") g.transform(1, 0, -.16, 1, 0, 0);

  lines.forEach((line, i) => {
    const y = -blockH / 2 + lh * (i + .5);
    const color = tx.color || "#ffffff";
    switch (style) {
      case "bold":
        g.fillStyle = "rgba(0,0,0,.45)"; g.fillText(line, 0, y + size * .07);
        g.strokeStyle = "#000"; g.lineWidth = size * .15; g.strokeText(line, 0, y);
        g.fillStyle = color; g.fillText(line, 0, y);
        break;
      case "neon":
        g.shadowColor = color; g.shadowBlur = size * .6;
        g.fillStyle = color; g.fillText(line, 0, y); g.fillText(line, 0, y);
        g.shadowBlur = size * .12; g.fillStyle = "#ffffff"; g.globalAlpha = alpha * .85; g.fillText(line, 0, y);
        g.globalAlpha = alpha; g.shadowBlur = 0;
        break;
      case "y2k": {
        const gr = g.createLinearGradient(0, y - size * .55, 0, y + size * .55);
        gr.addColorStop(0, "#ffffff"); gr.addColorStop(.45, "#c9d3e6"); gr.addColorStop(.5, "#5d6780"); gr.addColorStop(.72, "#eef3fb"); gr.addColorStop(1, "#8f9ab0");
        g.shadowColor = color === "#ffffff" ? "#1ee3ff" : color; g.shadowBlur = size * .35;
        g.strokeStyle = "#0b0b10"; g.lineWidth = size * .1; g.strokeText(line, 0, y);
        g.shadowBlur = 0; g.fillStyle = gr; g.fillText(line, 0, y);
        break;
      }
      case "box": {
        const w = g.measureText(line).width, pad = size * .28;
        const light = /^#(f|e|d|c)/i.test(color);
        g.fillStyle = color;
        roundRect(g, -w / 2 - pad, y - lh / 2 + 2, w + pad * 2, lh - 4, size * .18);
        g.fillStyle = light ? "#0b0b10" : "#ffffff"; g.fillText(line, 0, y + 1);
        break;
      }
      case "minimal":
        g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = size * .25;
        g.fillStyle = color; g.fillText(line, 0, y); g.shadowBlur = 0;
        break;
      default: {
        const w = g.measureText(line).width, pad = size * .2;
        g.fillStyle = "rgba(0,0,0,.62)";
        roundRect(g, -w / 2 - pad, y - lh / 2 + 3, w + pad * 2, lh - 6, size * .1);
        g.fillStyle = color; g.fillText(line, 0, y + 1);
      }
    }
  });
  g.restore();
}

function roundRect(g, x, y, w, hh, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, hh, r);
  else g.rect(x, y, w, hh);
  g.fill();
}

/* ---------- удары по долям ---------- */

const [frameCan, gF] = mk();
const [echoCan, gE] = mk();
let echoAt = -1;

function hitsAt(seq, t) {
  const H = seq.plan.hits || [];
  const out = [];
  if (!H.length) return out;
  let lo = 0, hi = H.length - 1, last = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (H[mid].t <= t) { last = mid; lo = mid + 1; } else hi = mid - 1; }
  for (let i = last; i >= 0 && t - H[i].t < 2.5; i -= 1) if (t - H[i].t < H[i].dur) out.push(H[i]);
  return out;
}

/** Сводит все активные удары в параметры «камеры» и пост-эффектов. */
function cameraAt(seq, t) {
  const cam = { zoom: 1, rot: 0, dx: 0, dy: 0, vx: 0, vy: 0, zoomBlur: 0, rgb: 0, blur: 0, flash: 0, black: 0, invert: false, strobe: 0, echo: 0, split: 0, kaleido: false, wobble: 0, stutter: 0, lines: 0, hit: 0 };
  const power = seq.plan.hitPower ?? 1;
  const m = Math.min(seq.w, seq.h);
  for (const h of hitsAt(seq, t)) {
    const local = t - h.t;
    const def = HITS[h.type] || {};
    const e = def.decay ? Math.exp(-local / def.decay) : 1;
    const a = h.amt * power;
    cam.hit = Math.max(cam.hit, e * Math.min(1, a));
    switch (h.type) {
      case "punch": { const inK = clamp(local / .045, 0, 1); cam.zoom *= 1 + .3 * a * inK * e; break; }
      case "punchOut": cam.zoom *= 1 + .38 * a * e; cam.zoomBlur = Math.max(cam.zoomBlur, .5 * a * e); break;
      case "shake": {
        const ang = hash(h.t * 13.7) * Math.PI * 2;
        const w = Math.sin(local * 62), dw = Math.cos(local * 62);
        const amp = a * e * m * .055;
        cam.dx += Math.cos(ang) * amp * w; cam.dy += Math.sin(ang) * amp * w;
        cam.vx += Math.cos(ang) * amp * dw; cam.vy += Math.sin(ang) * amp * dw;
        cam.rot += (hash(h.t * 3.1) - .5) * .09 * a * e * w;
        break;
      }
      case "spin": { const dir = hash(h.t * 5.3) > .5 ? 1 : -1; cam.rot += dir * .2 * a * e; cam.zoom *= 1 + .16 * a * e; cam.zoomBlur = Math.max(cam.zoomBlur, .35 * a * e); break; }
      case "zoomblur": cam.zoomBlur = Math.max(cam.zoomBlur, a * e); cam.zoom *= 1 + .08 * a * e; break;
      case "flash": cam.flash = Math.max(cam.flash, a * e * clamp(local / .03, 0, 1)); break;
      case "black": if (local > .012) cam.black = Math.max(cam.black, Math.min(1, a)); break;
      case "invert": if (local > .012) cam.invert = true; break;
      case "rgb": cam.rgb = Math.max(cam.rgb, a * e); break;
      case "blur": cam.blur = Math.max(cam.blur, a * e); break;
      case "wobble": cam.wobble = Math.max(cam.wobble, a * e); break;
      case "lines": cam.lines = Math.max(cam.lines, a * e); break;
      case "strobe": cam.strobe = Math.max(cam.strobe, Math.min(1, a)) * (Math.floor(local * 16) % 2 ? 1 : -1); break;
      case "echo": cam.echo = Math.max(cam.echo, Math.min(.85, a * .8) * (1 - local / h.dur * .4)); break;
      case "split": cam.split = 3; break;
      case "kaleido": cam.kaleido = true; break;
      case "stutter": cam.stutter = Math.max(cam.stutter, h.t + .0001); break;
      default: break;
    }
  }
  // ручные удары из панели «Эффекты» — поверх хореографии
  const b = beatFxAt(seq, t);
  cam.zoom *= 1 + b.zoom; cam.dx += b.sx; cam.dy += b.sy; cam.rot += b.rot;
  cam.flash = Math.max(cam.flash, b.flash); cam.rgb = Math.max(cam.rgb, b.rgb); cam.blur = Math.max(cam.blur, b.blur / 7);
  cam.hit = Math.max(cam.hit, b.hit * ((seq.plan.beat?.zoom || 0) + (seq.plan.beat?.shake || 0) > 0 ? 1 : 0));
  return cam;
}

/** Собирает клипы и переход в кадр без «камеры». */
function composeClips(g, seq, t, extra) {
  const W = seq.w, H = seq.h;
  const live = liveClips(seq, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over"; g.filter = "none";
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  if (live.length >= 2) {
    const a = live[live.length - 2], b = live[live.length - 1];
    drawClip(gA, a, t, seq);
    drawClip(gB, b, t, seq);
    const p = clamp((t - b.tIn) / Math.max(.01, b.trIn), 0, 1);
    drawTransition(g, layA, layB, b.tr.type, p, W, H, extra);
  } else if (live.length === 1) {
    drawClip(g, live[0], t, seq);
  }
}

function drawSpeedLines(W, H, amt, t) {
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) * .6;
  const f = Math.floor(t * 24);
  ctx.save();
  ctx.globalAlpha = clamp(amt, 0, 1) * .75;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 70; i += 1) {
    const ang = hash(f * 1.3 + i * 7.7) * Math.PI * 2;
    const r0 = R * (.34 + hash(f + i * 3.3) * .3);
    const wdt = .004 + hash(i * 9.1 + f) * .012;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang - wdt) * R, cy + Math.sin(ang - wdt) * R);
    ctx.lineTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang + wdt) * R, cy + Math.sin(ang + wdt) * R);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- кадр целиком ---------- */

let liveHint = 0;
function liveClips(seq, t) {
  const cs = seq.clips;
  if (!cs.length) return [];
  let i = clamp(liveHint, 0, cs.length - 1);
  while (i > 0 && cs[i].tIn > t) i -= 1;
  while (i < cs.length - 1 && cs[i].tOut <= t) i += 1;
  liveHint = i;
  const out = [];
  for (let k = Math.max(0, i - 1); k <= Math.min(cs.length - 1, i + 1); k += 1) if (t >= cs[k].tIn && t < cs[k].tOut) out.push(cs[k]);
  if (!out.length && t >= seq.total - .001) out.push(cs[cs.length - 1]);
  return out;
}

function drawAt(t) {
  const seq = S.seq;
  if (!seq) return;
  const W = seq.w, H = seq.h;
  if (frameCan.width !== W || frameCan.height !== H) { frameCan.width = W; frameCan.height = H; echoCan.width = W; echoCan.height = H; }
  const cam = cameraAt(seq, t);
  const extra = { flash: 0, rgb: 0 };

  // стоп-моушен: картинка обновляется рывками по 1/8 секунды
  const tv = cam.stutter ? cam.stutter + Math.floor((t - cam.stutter) / .125) * .125 : t;
  composeClips(gF, seq, tv, extra);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  const m = Math.min(W, H);
  const cover = cam.zoom + (Math.abs(cam.dx) + Math.abs(cam.dy)) * 2.1 / m + Math.abs(cam.rot) * 1.25;
  const place = (g) => { g.translate(W / 2 + cam.dx, H / 2 + cam.dy); g.rotate(cam.rot); g.scale(cover, cover); g.translate(-W / 2, -H / 2); };
  const filters = [];
  if (cam.invert) filters.push("invert(1)");
  if (cam.blur > .05) filters.push(`blur(${(cam.blur * m * .012).toFixed(1)}px)`);
  ctx.filter = filters.join(" ") || "none";

  if (cam.split) {
    const n = cam.split, vertical = H >= W;
    for (let k = 0; k < n; k += 1) {
      const rx = vertical ? 0 : (W / n) * k, ry = vertical ? (H / n) * k : 0;
      const rw = vertical ? W : W / n, rh = vertical ? H / n : H;
      const s = Math.max(rw / W, rh / H) * cover;
      ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();
      if (k === 1) { ctx.translate(rx + rw, ry); ctx.scale(-1, 1); ctx.translate(-rx, -ry); }
      ctx.drawImage(frameCan, rx + (rw - W * s) / 2, ry + (rh - H * s) / 2, W * s, H * s);
      ctx.restore();
    }
  } else if (cam.kaleido) {
    const hw = W / 2, hh = H / 2;
    for (let k = 0; k < 4; k += 1) {
      ctx.save();
      ctx.translate(k % 2 ? W : 0, k > 1 ? H : 0);
      ctx.scale(k % 2 ? -1 : 1, k > 1 ? -1 : 1);
      ctx.beginPath(); ctx.rect(0, 0, hw, hh); ctx.clip();
      ctx.translate(hw / 2, hh / 2); ctx.rotate(cam.rot); ctx.scale(cover, cover); ctx.translate(-hw / 2, -hh / 2);
      ctx.drawImage(frameCan, W * .25, H * .25, hw, hh, 0, 0, hw, hh);
      ctx.restore();
    }
  } else if (cam.wobble > .03) {
    const slices = 48, sh = H / slices;
    ctx.save(); place(ctx);
    for (let k = 0; k < slices; k += 1) {
      const off = Math.sin(k * .45 + t * 22) * cam.wobble * W * .05;
      ctx.drawImage(frameCan, 0, k * sh, W, sh + 1, off, k * sh, W, sh + 1);
    }
    ctx.restore();
  } else {
    ctx.save(); place(ctx); ctx.drawImage(frameCan, 0, 0); ctx.restore();
    // смаз по направлению тряски
    const v = Math.hypot(cam.vx, cam.vy);
    if (v > m * .004) {
      for (let k = 1; k <= 2; k += 1) {
        ctx.save(); ctx.globalAlpha = .3 / k;
        ctx.translate(-cam.vx * .35 * k, -cam.vy * .35 * k); place(ctx);
        ctx.drawImage(frameCan, 0, 0); ctx.restore();
      }
    }
    // радиальный зум-блюр
    if (cam.zoomBlur > .04) {
      for (let k = 1; k <= 3; k += 1) {
        const z = 1 + .045 * k * cam.zoomBlur;
        ctx.save(); ctx.globalAlpha = .28 * cam.zoomBlur / k;
        ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); place(ctx);
        ctx.drawImage(frameCan, 0, 0); ctx.restore();
      }
    }
  }
  ctx.filter = "none";
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // эхо-шлейф: поверх — прошлые кадры, постепенно гаснущие
  if (cam.echo > .02) {
    if (echoAt < 0 || Math.abs(t - echoAt) > .25) { gE.globalCompositeOperation = "copy"; gE.drawImage(canvas, 0, 0); }
    ctx.globalAlpha = cam.echo;
    ctx.drawImage(echoCan, 0, 0);
    ctx.globalAlpha = 1;
    gE.globalCompositeOperation = "copy"; gE.drawImage(canvas, 0, 0);
    echoAt = t;
  } else echoAt = -1;

  const rgb = Math.max(cam.rgb, extra.rgb);
  const px = Math.round(rgb * W * .018);
  if (px >= 1) rgbSplit(W, H, px);

  if (cam.lines > .03 || (seq.plan.overlay?.lines || 0) > .01) drawSpeedLines(W, H, Math.max(cam.lines, (seq.plan.overlay?.lines || 0) * (.4 + .6 * cam.hit)), t);

  drawOverlays(seq, t, { flash: Math.max(cam.flash, extra.flash) });

  if (cam.strobe) {
    ctx.globalCompositeOperation = cam.strobe > 0 ? "lighter" : "source-over";
    ctx.globalAlpha = Math.abs(cam.strobe) * (cam.strobe > 0 ? .55 : .6);
    ctx.fillStyle = cam.strobe > 0 ? "#fff" : "#000"; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  if (cam.black > .01) { ctx.globalAlpha = cam.black; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  drawTexts(seq, t, { sx: cam.dx, sy: cam.dy, hit: cam.hit });
}
/* ================================================================
   11. звук: всё через буферы Web Audio с точным расписанием.
   Видео играют беззвучно — только картинка. Так синхрон не плывёт,
   iOS не блокирует автоплей, а рывки скорости звучат как плёнка.
   ================================================================ */

let master = null, recDest = null;
let scheduled = [];

function audioGraph() {
  const ac = getAudioCtx();
  if (!ac) return null;
  if (!master) {
    master = ac.createGain();
    master.gain.value = 1;
    master.connect(ac.destination);
    try { recDest = ac.createMediaStreamDestination(); master.connect(recDest); } catch { recDest = null; }
  }
  return ac;
}

async function unlockAudio() {
  const ac = audioGraph();
  if (!ac) return false;
  if (ac.state !== "running") { try { await ac.resume(); } catch { /* браузер не дал */ } }
  return ac.state === "running";
}

function stopAudio() {
  for (const n of scheduled) { try { n.stop(); } catch { /* уже остановлен */ } try { n.disconnect(); } catch { /* ок */ } }
  scheduled = [];
}

async function decodeVideoAudio(asset) {
  if (asset.buffer || asset.noAudio || asset.kind !== "video") return;
  if (!asset.file || asset.bytes > 160 * 1048576) { asset.noAudio = true; return; }
  const ac = getAudioCtx();
  if (!ac) { asset.noAudio = true; return; }
  try {
    const data = await asset.file.arrayBuffer();
    asset.buffer = await new Promise((resolve, reject) => {
      const p = ac.decodeAudioData(data, resolve, reject);
      if (p && p.then) p.then(resolve, reject);
    });
  } catch { asset.noAudio = true; }
}

function scheduleAudio(fromT, when) {
  stopAudio();
  const ac = audioCtx;
  if (!ac || ac.state !== "running") return;
  const seq = S.seq, plan = seq.plan;
  const end = seq.total;
  const rel = (tl) => when + (tl - fromT);

  if (seq.music?.buffer && plan.music) {
    const buf = seq.music.buffer;
    const src = ac.createBufferSource(); src.buffer = buf;
    const g = ac.createGain();
    src.connect(g); g.connect(master);
    const vol = plan.music.vol ?? .9;
    const fi = plan.music.fadeIn || 0, fo = plan.music.fadeOut || 0;
    const startV = fi > 0 ? vol * clamp(fromT / fi, 0, 1) : vol;
    g.gain.setValueAtTime(Math.max(.0001, startV), when);
    if (fi > 0 && fromT < fi) g.gain.linearRampToValueAtTime(vol, rel(fi));
    if (fo > 0) {
      const foStart = Math.max(fromT, end - fo);
      g.gain.setValueAtTime(fromT < end - fo ? vol : g.gain.value, rel(foStart));
      g.gain.linearRampToValueAtTime(.0001, rel(end));
    }
    const off = ((plan.music.offset || 0) + fromT) % buf.duration;
    src.start(when, off);
    src.stop(rel(end) + .05);
    scheduled.push(src);
  }

  if (plan.orig?.keep && (plan.orig.vol ?? 1) > 0) {
    for (const c of seq.clips) {
      if (c.asset.kind !== "video" || !c.asset.buffer || c.tOut <= fromT) continue;
      const t0 = Math.max(c.tIn, fromT);
      const src = ac.createBufferSource(); src.buffer = c.asset.buffer;
      const g = ac.createGain();
      src.connect(g); g.connect(master);
      const vol = (plan.orig.vol ?? 1) * (c.vol ?? 1);
      // скорость: огибающая playbackRate повторяет кривую клипа
      const stepT = .04;
      src.playbackRate.setValueAtTime(clamp(rateAt(c, t0), .05, 16), rel(t0));
      for (let tt = t0 + stepT; tt < c.tOut; tt += stepT) src.playbackRate.linearRampToValueAtTime(clamp(rateAt(c, tt), .05, 16), rel(tt));
      // стыки: звук перетекает вместе с картинкой
      const inEnd = c.tIn + c.trIn, outStart = c.tOut - c.trOut;
      g.gain.setValueAtTime(t0 < inEnd && c.trIn > 0 ? vol * clamp((t0 - c.tIn) / c.trIn, 0, 1) : vol, rel(t0));
      if (t0 < inEnd && c.trIn > 0) g.gain.linearRampToValueAtTime(vol, rel(inEnd));
      if (c.trOut > 0) { g.gain.setValueAtTime(vol, rel(Math.max(t0, outStart))); g.gain.linearRampToValueAtTime(.0001, rel(c.tOut)); }
      const pos = srcAt(c, t0);
      if (pos >= c.asset.buffer.duration) continue;
      src.start(rel(t0), pos);
      src.stop(rel(c.tOut) + .02);
      scheduled.push(src);
    }
  }
}

/* ================================================================
   12. видео-элементы: пул на каждый исходник
   ================================================================ */

function poolGet(asset) {
  asset.pool = asset.pool || [];
  let el = asset.pool.find((e) => !e.__busy);
  if (!el && asset.pool.length < 4) {
    el = document.createElement("video");
    el.muted = true;
    el.defaultMuted = true;
    el.playsInline = true;
    el.setAttribute("playsinline", "");
    el.setAttribute("muted", "");
    el.preload = "auto";
    el.src = asset.url;
    el.addEventListener("seeked", () => { if (!S.playing) requestDraw(); });
    el.addEventListener("loadeddata", () => { if (!S.playing) requestDraw(); });
    asset.pool.push(el);
  }
  if (el) el.__busy = true;
  return el;
}

function poolPut(el) {
  if (!el) return;
  el.__busy = false;
  try { el.pause(); } catch { /* ок */ }
}

const PREROLL = .8;

function syncVideos(t, moving) {
  const seq = S.seq;
  if (!seq) return;
  for (const c of seq.clips) {
    if (c.asset.kind !== "video") continue;
    const warm = t >= c.tIn - PREROLL && t < c.tOut + .05;
    if (!warm) { if (c.el) { poolPut(c.el); c.el = null; c.lastOk = false; } continue; }
    if (!c.el) {
      c.el = poolGet(c.asset);
      c.lastOk = false;
      if (!c.el) continue;
      try { c.el.currentTime = srcAt(c, Math.max(t, c.tIn)); } catch { /* ещё грузится */ }
      c.el.pause();
      continue;
    }
    const el = c.el;
    const want = srcAt(c, Math.max(t, c.tIn));
    if (moving && t >= c.tIn) {
      const r = clamp(rateAt(c, t), .0625, 16);
      if (Math.abs(el.playbackRate - r) > .02 * r) { try { el.playbackRate = r; } catch { /* вне диапазона браузера */ } }
      if (el.paused && !el.__starting) { el.__starting = true; el.play().catch(() => {}).finally(() => { el.__starting = false; }); }
      const drift = el.currentTime - want;
      if (!el.seeking && Math.abs(drift) > .14 + .07 * r) el.currentTime = want;
    } else {
      if (!el.paused) el.pause();
      if (!el.seeking && Math.abs(el.currentTime - want) > .03) el.currentTime = want;
    }
  }
}

function releaseAllVideos() {
  if (!S.seq) return;
  for (const c of S.seq.clips) if (c.el) { poolPut(c.el); c.el = null; c.lastOk = false; }
}

/** Прогрев перед стартом: нужные кадры уже на месте. */
async function primeAt(t) {
  syncVideos(t, false);
  const els = S.seq.clips.filter((c) => c.el && t >= c.tIn - PREROLL && t < c.tOut).map((c) => c.el);
  const deadline = performance.now() + 1500;
  while (performance.now() < deadline) {
    if (els.every((el) => el.readyState >= 2 && !el.seeking)) break;
    await sleep(40);
  }
}

/* ================================================================
   13. транспорт
   ================================================================ */

let raf = 0, drawQueued = false;
let clock = null;
const frameListeners = new Set();

function clockNow() {
  if (!clock) return S.cursor;
  if (clock.ac != null && audioCtx && audioCtx.state === "running") return clock.t + (audioCtx.currentTime - clock.ac);
  return clock.t + (performance.now() - clock.perf) / 1000;
}

function requestDraw() {
  if (drawQueued || S.playing) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; if (!S.playing) { drawAt(S.cursor); emitFrame(S.cursor); } });
}

function emitFrame(t) { for (const fn of frameListeners) fn(t); }

async function play(from) {
  const seq = S.seq;
  if (!seq || S.playing || !seq.clips.length) return;
  let t = from ?? S.cursor;
  if (t >= seq.total - .03) t = 0;
  S.cursor = t;
  const running = await unlockAudio();
  await primeAt(t);
  const when = running ? audioCtx.currentTime + .05 : null;
  clock = { t, ac: when, perf: performance.now() + 50 };
  if (running) scheduleAudio(t, when);
  S.playing = true;
  notify();
  const loop = () => {
    if (!S.playing) return;
    let now = clockNow();
    if (now < t) now = t;
    if (now >= seq.total) {
      S.cursor = seq.total;
      drawAt(seq.total - .001);
      emitFrame(seq.total);
      stop();
      onPlaybackEnded();
      return;
    }
    S.cursor = now;
    syncVideos(now, true);
    drawAt(now);
    emitFrame(now);
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function stop() {
  if (!S.playing) return;
  S.playing = false;
  cancelAnimationFrame(raf);
  stopAudio();
  clock = null;
  syncVideos(S.cursor, false);
  notify();
}

function toggle() { if (S.playing) stop(); else play(); }

function seekTo(t) {
  if (!S.seq) return;
  const was = S.playing;
  if (was) stop();
  S.cursor = clamp(t, 0, S.seq.total);
  syncVideos(S.cursor, false);
  drawAt(S.cursor);
  emitFrame(S.cursor);
  if (was) play(S.cursor);
}

let onPlaybackEnded = () => {};

/* ================================================================
   14. история правок
   ================================================================ */

const snap = () => JSON.stringify(S.plan);

function validatePlan(plan) {
  plan.clips = plan.clips.filter((c) => assetById(c.assetId));
  for (const c of plan.clips) {
    const a = assetById(c.assetId);
    c.len = clamp(num(c.len, 1), .1, 120);
    if (a.kind === "video") {
      c.src = clamp(num(c.src, 0), 0, Math.max(0, a.duration - .1));
      c.span = clamp(num(c.span, c.len), .05, Math.max(.05, a.duration - c.src));
    } else { c.src = Math.max(0, num(c.src, 0)); c.span = Math.max(.05, num(c.span, c.len)); }
    if (!RAMPS[c.ramp]) c.ramp = "none";
    if (!c.tr || !TRANSITIONS[c.tr.type]) c.tr = { type: "cut", dur: 0 };
  }
  if (plan.clips[0]) plan.clips[0].tr = { type: "cut", dur: 0 };
  const total = plan.clips.reduce((s, c) => s + c.len, 0);
  plan.texts = (plan.texts || []).filter((x) => x.text && x.at < total - .05).map((x) => ({ ...x, len: clamp(x.len, .2, total - x.at) }));
  if (plan.music && !assetById(plan.music.assetId)) plan.music = null;
  return plan;
}

function refresh(keepCursor = true) {
  stop();
  validatePlan(S.plan);
  buildSeq(S.plan);
  if (!keepCursor) S.cursor = 0;
  S.cursor = clamp(S.cursor, 0, S.seq.total);
  syncVideos(S.cursor, false);
  drawAt(S.cursor);
  emitFrame(S.cursor);
  notify();
}

function commit(mutate, keepCursor = true) {
  const before = snap();
  mutate(S.plan);
  S.history.push(before);
  if (S.history.length > 80) S.history.shift();
  S.future = [];
  refresh(keepCursor);
}

function setPlan(plan, record = true) {
  if (record && S.plan) { S.history.push(snap()); if (S.history.length > 80) S.history.shift(); S.future = []; }
  S.plan = plan;
  S.sel = null;
  refresh(false);
}

function undo() {
  if (!S.history.length) return;
  S.future.push(snap());
  S.plan = JSON.parse(S.history.pop());
  S.sel = null;
  refresh();
  toast("Отменено");
}
function redo() {
  if (!S.future.length) return;
  S.history.push(snap());
  S.plan = JSON.parse(S.future.pop());
  S.sel = null;
  refresh();
  toast("Возвращено");
}

/* ================================================================
   15. экспорт
   ================================================================ */

function pickMime() {
  if (!window.MediaRecorder || !canvas.captureStream) return null;
  const list = [
    "video/mp4;codecs=avc1.640028,mp4a.40.2",
    "video/mp4;codecs=avc1.4d002a,mp4a.40.2",
    "video/mp4;codecs=avc1,mp4a.40.2",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4",
  ];
  return list.find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || null;
}

const REC = { recorder: null, chunks: [], mime: "", blob: null, onProgress: null, onDone: null, paused: false };

async function startExport({ onProgress, onDone, onError }) {
  const seq = S.seq;
  const mime = pickMime();
  if (!mime) { onError("Этот браузер не умеет записывать видео со страницы. Откройте в Chrome, Edge или свежем Safari."); return; }
  await unlockAudio();
  const fps = seq.plan.output.fps || 30;
  const stream = canvas.captureStream(fps);
  if (recDest && audioCtx?.state === "running") for (const tr of recDest.stream.getAudioTracks()) stream.addTrack(tr);
  const q = seq.plan.output.quality;
  let rec;
  try {
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: q >= 1080 ? 12e6 : q >= 720 ? 7e6 : 4.5e6, audioBitsPerSecond: 192000 });
  } catch { onError("Запись не запустилась в этом браузере."); return; }

  Object.assign(REC, { recorder: rec, chunks: [], mime, blob: null, onProgress, onDone, paused: false });
  rec.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  rec.onstop = () => {
    S.recording = false;
    const blob = new Blob(REC.chunks, { type: mime.split(";")[0] });
    REC.chunks = [];
    REC.blob = blob;
    notify();
    if (REC.cancelled) return;
    onDone(blob, mime);
  };

  S.recording = true;
  REC.cancelled = false;
  notify();
  stop();
  S.cursor = 0;
  await primeAt(0);
  drawAt(0);
  rec.start(250);
  frameListeners.add(recProgress);
  onPlaybackEnded = () => {
    onPlaybackEnded = () => {};
    frameListeners.delete(recProgress);
    setTimeout(() => { try { rec.stop(); } catch { /* уже */ } }, 180);
  };
  play(0);
}

function recProgress(t) { if (REC.onProgress && S.seq) REC.onProgress(t / S.seq.total); }

function cancelExport() {
  if (!S.recording) return;
  REC.cancelled = true;
  onPlaybackEnded = () => {};
  frameListeners.delete(recProgress);
  stop();
  try { REC.recorder.stop(); } catch { /* уже */ }
  S.recording = false;
  notify();
}

// Скрытая вкладка душит таймеры — запись встаёт на паузу и продолжается с того же места.
document.addEventListener("visibilitychange", async () => {
  if (!S.recording || !REC.recorder) return;
  if (document.hidden) {
    if (REC.recorder.state === "recording") { REC.recorder.pause(); REC.paused = true; }
    const t = S.cursor;
    const end = onPlaybackEnded;
    onPlaybackEnded = () => {};
    stop();
    S.cursor = t;
    onPlaybackEnded = end;
  } else if (REC.paused) {
    REC.paused = false;
    await primeAt(S.cursor);
    try { REC.recorder.resume(); } catch { /* ок */ }
    play(S.cursor);
  }
});

/* ================================================================
   16. интерфейс: общие куски
   ================================================================ */

let toastTimer = 0;
function toast(text, bad = false) {
  document.querySelectorAll(".toast").forEach((n) => n.remove());
  const el = h("div", { class: bad ? "toast bad" : "toast", role: "status" }, text);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), bad ? 5200 : 2600);
}

function setBusy(text) {
  $("busy").hidden = !text;
  if (text) $("busy-text").textContent = text;
}

function slider({ label, value, min = 0, max = 1, step = .01, fmt = (v) => `${Math.round(v * 100)}%`, onInput, onCommit }) {
  const out = h("b", null, fmt(value));
  const input = h("input", { type: "range", min: String(min), max: String(max), step: String(step), value: String(value), "aria-label": label });
  const paint = () => input.style.setProperty("--p", `${((Number(input.value) - min) / (max - min)) * 100}%`);
  paint();
  let before = null;
  input.addEventListener("input", () => {
    if (before == null) before = snap();
    const v = Number(input.value);
    out.textContent = fmt(v);
    paint();
    onInput(v);
  });
  input.addEventListener("change", () => {
    if (before != null && before !== snap()) { S.history.push(before); S.future = []; }
    before = null;
    if (onCommit) onCommit(Number(input.value));
    renderTop();
  });
  return h("label", { class: "slider" }, h("span", { class: "lab" }, h("span", null, label), out), input);
}

function seg(options, value, onPick, label) {
  return h("div", { class: "seg", role: "radiogroup", "aria-label": label || "" },
    options.map(([v, text]) => h("button", {
      type: "button", class: String(v) === String(value) ? "on" : "", role: "radio",
      "aria-checked": String(String(v) === String(value)),
      onclick: () => onPick(v),
    }, text)));
}

/** Живая правка без записи в историю: только пересчёт ленты и кадра. */
function softRefresh() {
  buildSeq(S.plan);
  if (!S.playing) { syncVideos(S.cursor, false); drawAt(S.cursor); }
  emitFrame(S.cursor);
}

function selectedClip() {
  if (S.sel?.kind !== "clip" || !S.plan) return null;
  return S.plan.clips.find((c) => c.id === S.sel.id) || null;
}
function selectedText() {
  if (S.sel?.kind !== "text" || !S.plan) return null;
  return (S.plan.texts || []).find((t) => t.id === S.sel.id) || null;
}

/* ================================================================
   17. верхняя панель и монитор
   ================================================================ */

function renderTop() {
  const u = $("undo"), r = $("redo");
  u.disabled = !S.history.length || S.recording;
  r.disabled = !S.future.length || S.recording;
  $("export").disabled = !S.seq?.clips.length || S.recording;
}

function renderStage() {
  const seq = S.seq;
  const big = $("bigplay");
  big.replaceChildren(icon(S.playing ? "pause" : "play"));
  big.classList.toggle("gone", S.playing);
  $("tl-play").replaceChildren(icon(S.playing ? "pause" : "play", "s"));
  const demo = S.plan?.by === "demo" || (S.plan && S.plan.clips.some((c) => assetById(c.assetId)?.demo));
  $("p-demo").hidden = !demo;
  const st = S.plan?.style && STYLES[S.plan.style];
  $("p-style").hidden = !st;
  if (st) $("p-style").textContent = st.name;
  $("p-rec").hidden = !S.recording;
  $("bpm").textContent = seq ? `${Math.round(seq.grid.bpm)} BPM` : "—";
}

function renderStyleBar() {
  const bar = $("stylebar");
  const cur = S.plan?.style;
  bar.replaceChildren(
    ...STYLE_IDS.map((id) => h("button", { type: "button", class: id === cur ? "sbtn on" : "sbtn", onclick: () => applyStyle(id), title: STYLES[id].tag }, STYLES[id].name)),
    h("button", { type: "button", class: "sbtn dice", onclick: reroll, disabled: !cur, title: "Тот же стиль — другие куски, порядок и удары" }, icon("dice", "s"), "Ещё вариант"),
  );
}

function fitCanvas() {
  const wrap = $("screen-wrap");
  const r = wrap.getBoundingClientRect();
  const W = S.seq?.w || canvas.width, H = S.seq?.h || canvas.height;
  const pad = 12;
  const s = Math.max(.05, Math.min((r.width - pad * 2) / W, (r.height - pad * 2) / H));
  canvas.style.width = `${Math.floor(W * s)}px`;
  canvas.style.height = `${Math.floor(H * s)}px`;
}

let lastBeatIdx = -1;
frameListeners.add((t) => {
  $("stage-tc").textContent = fmtT(t);
  $("tl-tc").innerHTML = `${fmtT(t)} <i>/ ${fmtT(S.seq?.total || 0)}</i>`;
  placePlayhead(t);
  if (S.seq) {
    const i = beatIndexAt(S.seq.grid, t);
    const hit = i >= 0 && t - S.seq.grid.beats[i] < .09 && S.playing;
    $("beatdot").classList.toggle("hit", hit);
    if (i !== lastBeatIdx) lastBeatIdx = i;
  }
  if (S.playing) followPlayhead(t);
  if (TL.split && S.seq) {
    const node = S.seq.clips.find((c) => c.id === TL.split.id);
    TL.split.btn.disabled = !node || !(t > node.at + .1 && t < node.at + node.len - .1);
  }
});

/* ================================================================
   18. таймлайн
   ================================================================ */

const TL = { pad: 14, key: "", blocks: new Map(), chips: new Map(), playhead: null, snapEl: null };
const X = (t) => TL.pad + t * S.pps;
const T = (x) => (x - TL.pad) / S.pps;
const dpr = () => Math.min(2, window.devicePixelRatio || 1);

function fitZoom() {
  const w = $("tl-scroll").clientWidth || 340;
  const total = S.seq?.total || 10;
  S.pps = clamp((w - TL.pad * 2 - 20) / total, 8, 140);
  TL.key = "";
  renderTimeline();
}

function renderTimeline(force = false) {
  const seq = S.seq;
  const scroll = $("tl-scroll");
  const inner = $("tl-inner");
  const key = [seq?.version, S.pps.toFixed(2), S.sel?.id, S.assets.filter((a) => a.analyzed).length, scroll.clientWidth].join("|");
  if (!force && key === TL.key) return;
  TL.key = key;
  TL.blocks.clear(); TL.chips.clear();

  const total = seq?.total || 0;
  const width = Math.max(scroll.clientWidth, X(total) + 120);
  inner.style.width = `${width}px`;
  inner.replaceChildren();

  const ruler = h("canvas", { class: "ruler" });
  ruler.style.width = `${width}px`;
  paintRuler(ruler, width);
  bindScrub(ruler);
  inner.append(ruler);

  const lv = h("div", { class: "lane v" });
  const lt = h("div", { class: "lane t" });
  const la = h("div", { class: "lane a" });
  inner.append(lv, lt, la);

  if (!seq || !seq.clips.length) lv.append(h("span", { class: "lane-empty" }, "Добавь материал — здесь появятся клипы"));
  else {
    for (const c of seq.clips) {
      const sel = S.sel?.kind === "clip" && S.sel.id === c.id;
      const wpx = Math.max(6, c.len * S.pps - 2);
      const cv = h("canvas");
      paintStrip(cv, c, wpx);
      const tagBits = [h("span", null, String(c.index + 1).padStart(2, "0"))];
      const avg = c.span / c.len;
      if (c.ramp !== "none") tagBits.push(h("b", null, RAMPS[c.ramp].name));
      else if (c.asset.kind !== "image" && Math.abs(avg - 1) > .04) tagBits.push(h("b", null, `×${avg.toFixed(2).replace(/0$/, "")}`));
      if (c.effects?.length) tagBits.push(h("em", null, `fx${c.effects.length}`));
      const block = h("div", {
        class: sel ? "clip sel" : "clip",
        style: `left:${X(c.at) + 1}px;width:${wpx}px`,
        "data-id": c.id,
        title: `${c.asset.name} · ${c.len.toFixed(2)} с`,
      }, cv, wpx > 34 ? h("div", { class: "tag" }, tagBits) : null);
      bindTap(block, () => { S.sel = { kind: "clip", id: c.id }; if (!["speed", "trans", "fx"].includes(S.tab)) S.tab = S.tab === "text" ? "fx" : S.tab; renderAll(); });
      if (sel) {
        const hl = h("div", { class: "handle l", "aria-label": "Начало клипа" });
        const hr = h("div", { class: "handle r", "aria-label": "Конец клипа" });
        hl.addEventListener("pointerdown", (e) => startTrim(e, c, "l"));
        hr.addEventListener("pointerdown", (e) => startTrim(e, c, "r"));
        block.append(hl, hr);
      }
      lv.append(block);
      TL.blocks.set(c.id, block);
      const on = c.tr.type !== "cut";
      if (c.index > 0 && (on || c.len * S.pps > 44 || sel)) {
        const b = h("button", {
          class: `${on ? "trn on" : "trn"}${c.len * S.pps < 34 && !sel ? " mini" : ""}`, style: `left:${X(c.at)}px`, type: "button",
          title: `Переход: ${TRANSITIONS[c.tr.type].name}`, "aria-label": `Переход перед клипом ${c.index + 1}`,
          onclick: (e) => { e.stopPropagation(); S.sel = { kind: "clip", id: c.id }; S.tab = "trans"; renderAll(); },
        }, h("span", null, on ? "◆" : "+"));
        lv.append(b);
      }
    }
  }

  for (const tx of S.plan?.texts || []) {
    const sel = S.sel?.kind === "text" && S.sel.id === tx.id;
    const chip = h("div", { class: sel ? "tchip sel" : "tchip", style: `left:${X(tx.at)}px;width:${Math.max(24, tx.len * S.pps)}px`, title: tx.text }, tx.text);
    chip.addEventListener("pointerdown", (e) => startTextDrag(e, tx));
    lt.append(chip);
    TL.chips.set(tx.id, chip);
  }
  if (!(S.plan?.texts || []).length && seq?.clips.length) lt.append(h("span", { class: "lane-empty" }, "Надписи — во вкладке «Текст»"));

  if (seq?.music) {
    const wv = h("div", { class: "wave", style: `left:${X(0)}px;width:${Math.max(10, total * S.pps)}px` });
    const cv = h("canvas");
    paintWave(cv, seq, total * S.pps);
    wv.append(cv, h("span", { class: "name" }, `${seq.music.name} · ${Math.round(seq.grid.bpm)} BPM`));
    wv.addEventListener("click", () => { S.tab = "audio"; S.sel = null; renderAll(); });
    la.append(wv);
  } else if (seq?.clips.length) {
    la.append(h("span", { class: "lane-empty" }, "Без музыки — сетка 120 BPM. Трек добавляется во вкладке «Звук»"));
  }

  TL.playhead = h("div", { class: "playhead" });
  inner.append(TL.playhead);
  placePlayhead(S.cursor);
}

function paintRuler(cv, width) {
  const d = dpr();
  cv.width = Math.round(width * d); cv.height = Math.round(24 * d);
  const g = cv.getContext("2d");
  g.scale(d, d);
  g.fillStyle = "#0e0e14"; g.fillRect(0, 0, width, 24);
  const seq = S.seq;
  if (!seq) return;
  const every = S.pps > 90 ? 1 : S.pps > 40 ? 2 : S.pps > 18 ? 5 : 10;
  g.font = '600 9px "JetBrains Mono", monospace';
  g.textBaseline = "top";
  for (let s = 0; s <= seq.total + .001; s += every) {
    const x = X(s);
    g.fillStyle = "#3a3a4d"; g.fillRect(x, 16, 1, 8);
    g.fillStyle = "#6d6d82"; g.fillText(fmtDur(s).replace(".0с", "с"), x + 3, 4);
  }
  for (const hit of seq.plan.hits || []) {
    g.fillStyle = HIT_COLORS[hit.type] || "#fff";
    g.globalAlpha = .9;
    g.beginPath(); g.arc(X(hit.t), 7 + (hit.type.length % 3) * 3, 1.8, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  const grid = seq.grid;
  for (let i = 0; i < grid.beats.length; i += 1) {
    const x = X(grid.beats[i]);
    g.fillStyle = grid.down[i] ? "#1ee3ff" : "#1ee3ff66";
    g.fillRect(x - (grid.down[i] ? 1 : .5), grid.down[i] ? 12 : 17, grid.down[i] ? 2 : 1, grid.down[i] ? 12 : 7);
  }
}

function paintStrip(cv, c, wpx) {
  const d = dpr(), H = 62;
  const w = Math.min(wpx, 4000);
  cv.width = Math.max(1, Math.round(w * d)); cv.height = Math.round(H * d);
  const g = cv.getContext("2d");
  g.scale(d, d);
  const a = c.asset;
  const thumbs = a.thumbs || [];
  if (!thumbs.length) {
    const gr = g.createLinearGradient(0, 0, w, H);
    gr.addColorStop(0, "#23232f"); gr.addColorStop(1, "#1a1a24");
    g.fillStyle = gr; g.fillRect(0, 0, w, H);
    g.fillStyle = "#6d6d82"; g.font = '600 10px "Golos Text", sans-serif'; g.fillText(a.analyzed ? a.name : "анализ…", 6, H - 8);
    return;
  }
  const r = thumbs[0].c.width / thumbs[0].c.height;
  const tw = Math.max(18, H * r);
  for (let x = 0; x < w; x += tw) {
    const tl = c.at + ((x + tw / 2) / w) * c.len;
    const th = thumbAt(a, a.kind === "image" ? 0 : srcAt(c, tl));
    if (!th) continue;
    const s = Math.max(tw / th.width, H / th.height);
    g.save(); g.beginPath(); g.rect(x, 0, tw, H); g.clip();
    g.drawImage(th, x + (tw - th.width * s) / 2, (H - th.height * s) / 2, th.width * s, th.height * s);
    g.restore();
    g.fillStyle = "#0006"; g.fillRect(x + tw - 1, 0, 1, H);
  }
  if (c.ramp !== "none") {
    g.strokeStyle = "#1ee3ff"; g.lineWidth = 1.6; g.shadowColor = "#000"; g.shadowBlur = 3;
    g.beginPath();
    let mx = 0;
    for (let i = 0; i <= 40; i += 1) mx = Math.max(mx, rampR(c.ramp, i / 40));
    for (let i = 0; i <= 40; i += 1) {
      const u = i / 40, y = H - 6 - (rampR(c.ramp, u) / mx) * (H * .45);
      if (i) g.lineTo(u * w, y); else g.moveTo(u * w, y);
    }
    g.stroke(); g.shadowBlur = 0;
  }
}

function paintWave(cv, seq, wpx) {
  const d = dpr(), H = 34;
  const w = Math.max(1, Math.min(wpx, 8000));
  cv.width = Math.round(w * d); cv.height = Math.round(H * d);
  const g = cv.getContext("2d");
  g.scale(d, d);
  const A = seq.music.analysis;
  if (A) {
    const off = seq.plan.music.offset || 0;
    g.fillStyle = "#1ee3ff55";
    for (let x = 0; x < w; x += 2) {
      const t0 = off + (x / w) * seq.total, t1 = off + ((x + 2) / w) * seq.total;
      let m = 0;
      for (let p = Math.floor(t0 * A.peaksRate); p < Math.ceil(t1 * A.peaksRate); p += 1) m = Math.max(m, A.peaks[p] || 0);
      const hh = Math.max(1, m * (H - 6));
      g.fillRect(x, (H - hh) / 2, 1.4, hh);
    }
  }
  const grid = seq.grid;
  for (let i = 0; i < grid.beats.length; i += 1) {
    const x = (grid.beats[i] / seq.total) * w;
    g.fillStyle = grid.down[i] ? "#1ee3ffcc" : "#1ee3ff40";
    g.fillRect(x, 0, grid.down[i] ? 1.5 : 1, H);
  }
}

function placePlayhead(t) {
  if (TL.playhead) TL.playhead.style.transform = `translateX(${X(t)}px)`;
}

function followPlayhead(t) {
  const sc = $("tl-scroll");
  const x = X(t);
  if (x < sc.scrollLeft + 20 || x > sc.scrollLeft + sc.clientWidth * .78) sc.scrollLeft = Math.max(0, x - sc.clientWidth * .3);
}

function bindTap(el, fn) {
  let sx = 0, sy = 0, down = false;
  el.addEventListener("pointerdown", (e) => { down = true; sx = e.clientX; sy = e.clientY; });
  el.addEventListener("pointerup", (e) => { if (down && Math.hypot(e.clientX - sx, e.clientY - sy) < 8) fn(e); down = false; });
  el.addEventListener("pointercancel", () => { down = false; });
}

function bindScrub(el) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const box = $("tl-inner").getBoundingClientRect();
    const go = (ev) => seekTo(clamp(T(ev.clientX - box.left), 0, S.seq?.total || 0));
    go(e);
    const up = () => { window.removeEventListener("pointermove", go); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", go);
    window.addEventListener("pointerup", up);
  });
}

/** Прилипание к битам: ближайшая доля в пределах 10 пикселей. */
function snapT(t) {
  const grid = S.seq?.grid;
  if (!grid) return null;
  let best = null, bd = 10 / S.pps;
  for (const b of grid.beats) { const d = Math.abs(b - t); if (d < bd) { bd = d; best = b; } }
  return best;
}

function showSnap(t) {
  if (TL.snapEl) TL.snapEl.remove();
  if (t == null) { TL.snapEl = null; return; }
  TL.snapEl = h("div", { class: "snapline", style: `left:${X(t)}px` });
  $("tl-inner").append(TL.snapEl);
}

function startTrim(e, c, side) {
  e.stopPropagation(); e.preventDefault();
  stop();
  const pc = S.plan.clips.find((x) => x.id === c.id);
  if (!pc) return;
  const asset = assetById(pc.assetId);
  const before = snap();
  const orig = { len: pc.len, src: pc.src, span: pc.span };
  const speed = orig.span / orig.len;
  const x0 = e.clientX;
  const move = (ev) => {
    const dt = (ev.clientX - x0) / S.pps;
    let snapAt = null;
    if (side === "r") {
      let len = orig.len + dt;
      const sn = snapT(c.at + len);
      if (sn != null) { len = sn - c.at; snapAt = sn; }
      len = clamp(len, .15, 60);
      if (asset.kind === "video") len = Math.min(len, (asset.duration - orig.src) / speed);
      pc.len = len; pc.span = len * speed;
    } else {
      let dd = dt;
      const sn = snapT(c.at + dd);
      if (sn != null) { dd = sn - c.at; snapAt = sn; }
      const minD = asset.kind === "video" ? -orig.src / speed : -orig.len * 4;
      dd = clamp(dd, minD, orig.len - .15);
      pc.len = orig.len - dd; pc.src = Math.max(0, orig.src + dd * speed); pc.span = pc.len * speed;
    }
    softRefresh();
    layoutBlocks();
    showSnap(snapAt);
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    showSnap(null);
    if (snap() !== before) { S.history.push(before); S.future = []; }
    refresh();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

/** Быстрая перестановка блоков во время перетаскивания, без перерисовки миниатюр. */
function layoutBlocks() {
  for (const c of S.seq.clips) {
    const b = TL.blocks.get(c.id);
    if (!b) continue;
    b.style.left = `${X(c.at) + 1}px`;
    b.style.width = `${Math.max(6, c.len * S.pps - 2)}px`;
  }
  placePlayhead(S.cursor);
}

function startTextDrag(e, tx) {
  e.preventDefault();
  stop();
  const pt = S.plan.texts.find((x) => x.id === tx.id);
  if (!pt) return;
  const before = snap();
  const x0 = e.clientX, at0 = pt.at;
  let moved = false;
  const move = (ev) => {
    if (Math.abs(ev.clientX - x0) > 5) moved = true;
    if (!moved) return;
    let at = at0 + (ev.clientX - x0) / S.pps;
    const sn = snapT(at);
    if (sn != null) at = sn;
    pt.at = clamp(at, 0, Math.max(0, S.seq.total - pt.len));
    const chip = TL.chips.get(pt.id);
    if (chip) chip.style.left = `${X(pt.at)}px`;
    showSnap(sn);
    if (!S.playing) { drawAt(S.cursor); }
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    showSnap(null);
    if (!moved) {
      S.sel = { kind: "text", id: pt.id };
      S.tab = "text";
      if (S.cursor < pt.at || S.cursor > pt.at + pt.len) seekTo(pt.at + Math.min(.3, pt.len / 2));
      renderAll();
      return;
    }
    if (snap() !== before) { S.history.push(before); S.future = []; }
    refresh();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function zoomBy(k) {
  const sc = $("tl-scroll");
  const rel = X(S.cursor) - sc.scrollLeft;
  S.pps = clamp(S.pps * k, 8, 320);
  renderTimeline();
  sc.scrollLeft = Math.max(0, X(S.cursor) - rel);
}

      ctxButton("trash", "Удалить", () => { commit((p) => { p.texts = p.texts.filter((x) => x.id !== text.id); }); S.sel = null; renderAll(); }, { danger: true }),
      ctxButton("close", "Готово", () => { S.sel = null; renderAll(); }),
    );
  }
}

function splitAt(id, t) {
  const node = S.seq.clips.find((c) => c.id === id);
  if (!node) return;
  const local = t - node.at;
  if (local < .1 || local > node.len - .1) { toast("Поставь курсор внутрь клипа"); return; }
  const mid = srcAt(node, t);
  commit((plan) => {
    const i = plan.clips.findIndex((c) => c.id === id);
    const c = plan.clips[i];
    const kindFlat = node.asset.kind === "image";
    const a = { ...c, id: uid("c"), len: local, span: kindFlat ? local : Math.max(.05, mid - c.src), ramp: "none", effects: [...(c.effects || [])] };
    const b = { ...c, id: uid("c"), len: c.len - local, src: kindFlat ? 0 : mid, span: kindFlat ? c.len - local : Math.max(.05, c.src + c.span - mid), ramp: "none", tr: { type: "cut", dur: 0 }, effects: [...(c.effects || [])] };
    plan.clips.splice(i, 1, a, b);
    S.sel = { kind: "clip", id: b.id };
  });
  toast("Разрезано");
}

function moveClip(id, d) {
  commit((plan) => {
    const i = plan.clips.findIndex((c) => c.id === id);
    const j = i + d;
    if (j < 0 || j >= plan.clips.length) return;
    [plan.clips[i], plan.clips[j]] = [plan.clips[j], plan.clips[i]];
  });
}

function dupClip(id) {
  commit((plan) => {
    const i = plan.clips.findIndex((c) => c.id === id);
    const c = plan.clips[i];
    const copy = { ...c, id: uid("c"), effects: [...(c.effects || [])], tr: { type: "cut", dur: 0 } };
    plan.clips.splice(i + 1, 0, copy);
    S.sel = { kind: "clip", id: copy.id };
  });
}

function deleteClip(id) {
  commit((plan) => { plan.clips = plan.clips.filter((c) => c.id !== id); });
  S.sel = null;
  renderAll();
}

async function direct() {
  if (S.recording) return;
  const text = (S.draft || "").trim();
  stop();
  if (!visualAssets().length) { toast("Сначала добавь видео или фото", true); return; }
  const btn = $("direct");
  if (btn) btn.disabled = true;
  try {
    if (S.assets.some((a) => !a.analyzed)) { setBusy("Анализирую материал…"); await waitAnalysis(); }
    let decision = null, note = null;
    if (S.sample && text) {
      setBusy(S.sampleImages ? "Claude смотрит кадры и решает, как монтировать…" : "Claude решает, как монтировать…");
      aiCtl = new AbortController();
      try { decision = await claudeDirector(text, aiCtl.signal); }
      catch (error) { note = error?.code === "cancelled" ? null : (SAMPLE_COPY[error?.code] || "Claude не ответил — смонтировал по разбору фразы."); }
    }
    if (!decision) decision = localDirector(text);
    if (note) decision.notes = `${note} ${decision.notes}`;
    S.lastAI = decision;
    setBusy("Режу под бит…");
    await frameYield();
    buildFromDecision(decision, ++S.seed);
    toast(decision.by === "claude" ? "Claude смонтировал эдит" : "Эдит собран");
  } catch (error) {
    toast(error?.message || "Не получилось собрать эдит", true);
  } finally {
    setBusy(null);
    renderAll();
  }
}

function buildFromDecision(d, seed) {
  const output = { ...(S.plan?.output || defaultOutput()) };
  if (d.aspect) output.aspect = d.aspect;
  const plan = autoEdit({
    style: d.style, look: d.look, power: d.power,
    length: d.length ?? S.lengthPick ?? 15,
    texts: d.texts, order: d.order, keepOrig: d.keepOrig,
    output, seed, notes: d.notes, by: d.by,
  });
  setPlan(plan);
  fitZoom();
  $("tl-scroll").scrollLeft = 0;
}

function reroll() {
  if (!S.plan?.style) return;
  const d = S.lastAI || { style: S.plan.style, texts: currentTexts(), power: S.plan.power, length: S.plan.length, by: "local" };
  buildFromDecision({ ...d, style: S.plan.style, texts: currentTexts() }, ++S.seed);
  toast("Новый вариант: другие куски, порядок, переходы и удары");
}

  return (S.plan?.texts || []).map((t, i) => ({ text: t.text, style: t.style, anim: t.anim, pos: t.pos, color: t.color, where: i === 0 ? "start" : "drop" }));
}
