<title>Монтажный стол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  --bg: #09090d;
  --bg2: #0e0e14;
  --s1: #14141c;
  --s2: #1b1b25;
  --s3: #242431;
  --line: #292938;
  --line2: #3a3a4d;
  --text: #f3f3f7;
  --dim: #a3a3b8;
  --mute: #6d6d82;
  --red: #ff3358;
  --red-2: #ff5c7a;
  --red-d: #ff335829;
  --cyan: #1ee3ff;
  --cyan-d: #1ee3ff24;
  --amber: #ffbb3d;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --top-h: 56px;
  --tabs-h: 64px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 14px/1.45 var(--ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
svg { display: block; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.s { width: 16px; height: 16px; }
.ico.fill { fill: currentColor; stroke: none; }

/* ============================ каркас ============================ */

.app {
  padding-inline: 16px;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 18px);
  max-width: 760px;
  margin: 0 auto;
}

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
}

.mark {
  font: 900 15px/1 var(--display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-shadow: -1.5px 0 var(--red), 1.5px 0 var(--cyan);
  white-space: nowrap;
  margin-right: auto;
  user-select: none;
}
.mark small {
  display: block;
  margin-top: 4px;
  font: 500 9.5px/1 var(--mono);
  letter-spacing: 0.14em;
  color: var(--mute);
  text-shadow: none;
}

.iconbtn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--s1);
  color: var(--dim);
  padding: 0;
}
.iconbtn:hover:not(:disabled) { color: var(--text); border-color: var(--line2); }
.iconbtn:disabled { opacity: .35; cursor: default; }

.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px;
  padding: 0 16px;
  border: 0;
  border-radius: 11px;
  background: var(--red);
  color: #fff;
  font: 700 13px/1 var(--ui);
  letter-spacing: .01em;
  box-shadow: 0 6px 20px -8px var(--red);
  white-space: nowrap;
}
.cta:hover:not(:disabled) { background: var(--red-2); }
.cta:disabled { opacity: .45; cursor: default; box-shadow: none; }
.cta.big { height: 50px; border-radius: 14px; font-size: 15px; width: 100%; }
.cta.ghost { background: var(--s2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.cta.ghost:hover:not(:disabled) { background: var(--s3); }

/* ============================ монитор ============================ */

.stage {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + var(--top-h));
  z-index: 40;
  height: min(46vh, 540px);
  min-height: 250px;
  background: var(--bg);
  padding-bottom: 10px;
}
.screen {
  position: relative;
  height: 100%;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, #17172300, #0000),
    repeating-conic-gradient(#101017 0% 25%, #0c0c12 0% 50%) 50% / 22px 22px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  touch-action: manipulation;
}
.screen canvas {
  display: block;
  border-radius: 6px;
  box-shadow: 0 20px 60px -20px #000;
  background: #000;
}

.chipbar {
  position: absolute; left: 10px; right: 10px; top: 10px;
  display: flex; gap: 6px; align-items: center; pointer-events: none;
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  border-radius: 999px;
  background: #0b0b10b8;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid #ffffff14;
  font: 700 10.5px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
  white-space: nowrap;
}
.pill.demo { color: var(--amber); }
.pill.rec { color: #fff; background: var(--red); border-color: transparent; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); transition: transform .08s, background .08s; }
.pill .dot.hit { background: var(--cyan); transform: scale(1.6); box-shadow: 0 0 10px var(--cyan); }
.pill.rec .dot { background: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.chipbar .grow { flex: 1; }

.bigplay {
  position: absolute;
  bottom: 18px; left: 50%; margin-left: -32px;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 1px solid #ffffff26;
  background: #0b0b1099;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  display: grid; place-items: center;
  color: #fff;
  padding: 0;
  transition: opacity .2s, transform .2s;
}
.bigplay .ico { width: 26px; height: 26px; margin-left: 3px; }
.bigplay.gone { opacity: 0; transform: scale(.85); pointer-events: none; }

.busy {
  position: absolute; inset: 0;
  display: grid; place-items: center; align-content: center; gap: 14px;
  background: #09090dcc;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  font: 500 13px/1.4 var(--ui);
  color: var(--dim);
  text-align: center;
  padding: 20px;
}
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--line2);
  border-top-color: var(--cyan);
  border-right-color: var(--red);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tcbar {
  position: absolute; left: 10px; bottom: 10px;
  pointer-events: none;
}
.tc { font: 700 11.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.tc i { font-style: normal; color: var(--mute); }

/* =========================== таймлайн =========================== */

.tl {
  margin-top: 2px;
  border-radius: 16px;
  background: var(--bg2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.tl-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.tl-head .tc { margin-right: auto; }
.tl-head .iconbtn { width: 30px; height: 30px; border-radius: 9px; }
.tl-scroll {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line2) transparent;
  touch-action: pan-x;
}
.tl-inner { position: relative; height: 170px; }
.ruler { position: absolute; left: 0; top: 0; height: 24px; cursor: ew-resize; touch-action: none; }
.lane { position: absolute; left: 0; right: 0; }
.lane.v { top: 30px; height: 62px; }
.lane.t { top: 98px; height: 26px; }
.lane.a { top: 130px; height: 34px; }
.lane-empty {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font: 500 11px/1 var(--ui); color: var(--mute); white-space: nowrap; pointer-events: none;
}

.clip {
  position: absolute; top: 0; height: 62px;
  border-radius: 9px;
  overflow: hidden;
  background: var(--s2);
  border: 1.5px solid #ffffff10;
  cursor: pointer;
}
.clip canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .92; }
.clip .tag {
  position: absolute; left: 4px; top: 4px;
  display: flex; gap: 3px; align-items: center;
  padding: 2px 5px; border-radius: 5px;
  background: #000000a8;
  font: 700 9px/1.2 var(--mono);
  color: #fff;
  white-space: nowrap;
  pointer-events: none;
}
.clip .tag b { color: var(--cyan); font-weight: 700; }
.clip .tag em { color: var(--amber); font-style: normal; }
.clip.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px -4px var(--cyan); z-index: 2; }
.handle {
  position: absolute; top: 0; bottom: 0; width: 16px;
  display: grid; place-items: center;
  background: var(--cyan);
  touch-action: none;
  cursor: ew-resize;
  z-index: 3;
}
.handle::after { content: ""; width: 2px; height: 20px; border-radius: 2px; background: #06222a; }
.handle.l { left: 0; border-radius: 7px 0 0 7px; }
.handle.r { right: 0; border-radius: 0 7px 7px 0; }

.trn {
  position: absolute; top: 20px;
  width: 22px; height: 22px;
  margin-left: -11px;
  border-radius: 7px;
  transform: rotate(45deg);
  background: var(--s3);
  border: 1px solid var(--line2);
  z-index: 4;
  padding: 0;
  display: grid; place-items: center;
}
.trn span { transform: rotate(-45deg); font: 700 8px/1 var(--mono); color: var(--cyan); }
.trn.mini { width: 9px; height: 9px; margin-left: -4.5px; top: 27px; border-radius: 2px; }
.trn.mini span { display: none; }
.trn.on { background: #0b2b33; border-color: var(--cyan); }

.tchip {
  position: absolute; top: 0; height: 26px;
  border-radius: 7px;
  background: linear-gradient(90deg, #3a1320, #2a1019);
  border: 1px solid #ff335866;
  font: 600 10.5px/24px var(--ui);
  padding: 0 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #ffd2db;
  cursor: grab;
  touch-action: none;
}
.tchip.sel { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); color: #fff; }

.wave { position: absolute; top: 0; height: 34px; border-radius: 7px; overflow: hidden; background: #0b1c21; border: 1px solid #1ee3ff33; }
.wave canvas { width: 100%; height: 100%; display: block; }
.wave .name { position: absolute; left: 6px; top: 3px; font: 700 9px/1 var(--mono); color: var(--cyan); pointer-events: none; text-shadow: 0 1px 2px #000; }

.playhead {
  position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px;
  background: #fff;
  box-shadow: 0 0 8px #ffffffaa;
  pointer-events: none;
  z-index: 6;
  will-change: transform;
}
.playhead::before {
  content: ""; position: absolute; top: 0; left: -6px;
  width: 14px; height: 12px;
  background: #fff;
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
}
.snapline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--amber); box-shadow: 0 0 6px var(--amber); z-index: 7; pointer-events: none; }

.stylebar {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding: 10px 10px 9px;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.stylebar::-webkit-scrollbar { display: none; }
.sbtn {
  flex: none;
  height: 34px; padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line2);
  background: var(--s1);
  color: var(--dim);
  font: 700 12px/1 var(--ui);
  white-space: nowrap;
}
.sbtn:hover { color: var(--text); }
.sbtn.on { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 6px 18px -8px var(--red); }
.sbtn.dice { display: inline-flex; align-items: center; gap: 6px; color: var(--cyan); border-color: #1ee3ff55; }

/* контекстная панель клипа */
.ctx {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding: 10px 10px;
  border-top: 1px solid var(--line);
  scrollbar-width: none;
}
.ctx::-webkit-scrollbar { display: none; }
.ctx button {
  flex: none;
  display: grid; justify-items: center; gap: 5px;
  min-width: 62px;
  padding: 8px 6px 7px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--s1);
  color: var(--dim);
  font: 500 10.5px/1 var(--ui);
}
.ctx button:hover:not(:disabled) { color: var(--text); border-color: var(--line2); }
.ctx button.on { color: var(--cyan); border-color: #1ee3ff66; background: #0c2127; }
.ctx button.danger:hover { color: var(--red); border-color: #ff335866; }
.ctx button:disabled { opacity: .35; }

/* ============================ панели ============================ */

.panel { margin-top: 14px; }
.ptitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 12px; }
.ptitle h2 { margin: 0; font: 700 17px/1.15 var(--display); letter-spacing: -.01em; }
.ptitle p { margin: 0; color: var(--mute); font-size: 12.5px; }
.sec { margin-top: 18px; }
.sec > h3 {
  margin: 0 0 9px;
  font: 700 10.5px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--mute);
}

textarea.prompt {
  width: 100%;
  min-height: 96px;
  resize: vertical;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--s1);
  font: 400 15px/1.45 var(--ui);
}
textarea.prompt:focus, input.field:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px var(--cyan-d); }
input.field {
  width: 100%; height: 44px; padding: 0 13px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--s1);
  font-size: 15px;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--s1);
  color: var(--dim);
  font: 500 12.5px/1.2 var(--ui);
  text-align: left;
}
.chip:hover { color: var(--text); border-color: var(--line2); }
.chip.on { color: #06222a; background: var(--cyan); border-color: var(--cyan); }
.chip.on.red { color: #fff; background: var(--red); border-color: var(--red); }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  padding: 3px; gap: 3px;
  border-radius: 12px;
  background: var(--s1);
  border: 1px solid var(--line);
}
.seg button {
  height: 34px; border: 0; border-radius: 9px;
  background: transparent; color: var(--dim);
  font: 600 12.5px/1 var(--ui);
  white-space: nowrap;
  padding: 0 6px;
}
.seg button.on { background: var(--s3); color: var(--text); box-shadow: 0 1px 0 #ffffff12 inset; }

.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.stack { display: grid; gap: 10px; }

.slider { display: grid; gap: 7px; }
.slider .lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); }
.slider .lab b { font: 700 11px/1.3 var(--mono); color: var(--text); }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--cyan) var(--p, 50%), var(--line2) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line2); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--cyan); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px #0009; }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 0; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  position: relative;
  display: grid; align-content: end;
  min-height: 132px;
  padding: 0;
  border-radius: 15px;
  overflow: hidden;
  border: 1.5px solid var(--line);
  background: var(--s1);
  text-align: left;
}
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .cap {
  position: relative;
  padding: 26px 11px 10px;
  background: linear-gradient(0deg, #000000e6, #0000);
}
.card .cap b { display: block; font: 700 13.5px/1.15 var(--display); }
.card .cap span { display: block; margin-top: 4px; font-size: 11.5px; color: #ffffffb0; }
.card.on { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 10px 30px -12px var(--red); }
.card.on::after {
  content: "✓"; position: absolute; top: 8px; right: 8px;
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--red); color: #fff; font: 700 12px/1 var(--ui);
}

.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.look {
  padding: 0; border: 0; background: none; text-align: center;
  display: grid; gap: 6px;
  color: var(--dim); font: 500 11.5px/1.2 var(--ui);
}
.look canvas { width: 100%; aspect-ratio: 4 / 5; border-radius: 12px; border: 1.5px solid var(--line); background: var(--s2); }
.look.on { color: var(--text); }
.look.on canvas { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }

.media { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile {
  position: relative;
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--s2);
  padding: 0;
}
.tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .badge {
  position: absolute; left: 5px; bottom: 5px;
  padding: 3px 6px; border-radius: 6px;
  background: #000000b5;
  font: 700 9.5px/1 var(--mono); color: #fff;
}
.tile .kind {
  position: absolute; left: 5px; top: 5px;
  padding: 3px 6px; border-radius: 6px;
  font: 700 9px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  background: var(--cyan); color: #06222a;
}
.tile .kind.audio { background: var(--amber); color: #2a1a00; }
.tile .kind.gen { background: var(--red); color: #fff; }
.tile .x {
  position: absolute; right: 4px; top: 4px;
  width: 24px; height: 24px; border-radius: 8px;
  background: #000000b5; border: 0; color: #fff;
  display: grid; place-items: center; padding: 0;
}
.tile .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--cyan); transition: width .2s; }
.tile.add {
  display: grid; place-items: center; align-content: center; gap: 6px;
  border: 1.5px dashed var(--line2);
  background: var(--s1);
  color: var(--dim); font: 600 11.5px/1.2 var(--ui);
}
.tile.add .ico { width: 26px; height: 26px; color: var(--cyan); }
.drop-over { outline: 2px dashed var(--cyan); outline-offset: 4px; border-radius: 16px; }

.note {
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--s1);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 12.5px;
  line-height: 1.5;
}
.note b { color: var(--text); }
.note.ai { border-color: #1ee3ff40; background: linear-gradient(135deg, #0c1f24, #14141c 60%); }
.note.ai b { color: var(--cyan); }
.note.warn { border-color: #ffbb3d44; color: #f1d7a3; }

.tlist { display: grid; gap: 6px; }
.titem {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--s1);
  text-align: left;
}
.titem.on { border-color: var(--red); }
.titem b { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem span { font: 500 10.5px/1 var(--mono); color: var(--mute); }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line2); padding: 0; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff; }

.tstyles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tstyle {
  height: 58px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--s1);
  display: grid; place-items: center; padding: 0 4px;
  overflow: hidden;
}
.tstyle.on { border-color: var(--red); background: #1f1016; }

/* ============================= табы ============================= */

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; gap: 2px;
  overflow-x: auto;

   ================================================================ */

let audioCtx = null;
function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch { audioCtx = null; }
  return audioCtx;
}

function kindOf(file) {
  const t = file.type || "";
  if (t.startsWith("video/")) return "video";
  if (t.startsWith("image/")) return "image";
  if (t.startsWith("audio/")) return "audio";
  if (/\.(mp4|mov|webm|mkv|m4v|3gp)$/i.test(file.name)) return "video";
  if (/\.(png|jpe?g|webp|gif|avif|heic|heif)$/i.test(file.name)) return "image";
  if (/\.(mp3|wav|m4a|aac|ogg|oga|flac|opus)$/i.test(file.name)) return "audio";
  return null;
}

function once(el, ev, ms) {
  return new Promise((resolve, reject) => {
    let done = false;
    const ok = () => { if (!done) { done = true; cleanup(); resolve(); } };
    const bad = () => { if (!done) { done = true; cleanup(); reject(new Error("не открывается")); } };
    const cleanup = () => { el.removeEventListener(ev, ok); el.removeEventListener("error", bad); };
    el.addEventListener(ev, ok);
    el.addEventListener("error", bad);
    if (ms) setTimeout(() => (done ? null : bad()), ms);
  });
}

function seekEl(el, t) {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => { if (!done) { done = true; el.removeEventListener("seeked", fin); resolve(); } };
    el.addEventListener("seeked", fin);
    try { el.currentTime = t; } catch { fin(); }
    setTimeout(fin, 1600);
  });
}

async function intake(files) {
  const added = [];
  const problems = [];
  for (const file of files) {
    if (S.assets.filter((a) => !a.demo).length >= 30) { problems.push("Больше 30 файлов в проект не беру."); break; }
    const kind = kindOf(file);
    if (!kind) { problems.push(`«${file.name}» — не видео, не фото и не звук.`); continue; }
    const url = URL.createObjectURL(file);
    const asset = { id: uid("a"), name: file.name, kind, url, bytes: file.size, progress: 0, analyzed: false, file };
    try {
      if (kind === "image") {
        const img = new Image();
        img.decoding = "async";
        img.src = url;
        await once(img, "load", 15000);
        Object.assign(asset, { el: img, w: img.naturalWidth, h: img.naturalHeight, duration: 0 });
        asset.thumbs = [{ t: 0, c: thumbFrom(img, img.naturalWidth, img.naturalHeight, 96) }];
        asset.analyzed = true;
        asset.progress = 1;
      } else if (kind === "video") {
        const v = document.createElement("video");
        v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
        await once(v, "loadedmetadata", 20000);
        if (!Number.isFinite(v.duration) || v.duration <= 0) throw new Error("пустое видео");
        Object.assign(asset, { w: v.videoWidth || 16, h: v.videoHeight || 9, duration: v.duration });
        v.removeAttribute("src"); v.load();
      } else {
        const a = document.createElement("audio");
        a.preload = "metadata"; a.src = url;
        await once(a, "loadedmetadata", 20000);
        Object.assign(asset, { duration: a.duration || 0 });
      }
    } catch (error) {
      URL.revokeObjectURL(url);
      problems.push(`«${file.name}»: браузер не открывает этот формат.`);
      continue;
    }
    S.assets.push(asset);
    added.push(asset);
    queueAnalysis(asset);
  }
  notify();
  return { added, problems };
}

function queueAnalysis(asset) {
  if (asset.analyzed) return;
  S.analysisQueue = S.analysisQueue.then(async () => {
    try {
      if (asset.kind === "video") await analyzeVideo(asset);
      if (asset.kind === "audio") await analyzeAudioAsset(asset);
    } catch (error) {
      asset.analysisError = String(error?.message || error);
    }
    asset.analyzed = true;
    asset.progress = 1;
    notify();
  });
}

const waitAnalysis = () => S.analysisQueue;

function thumbFrom(src, sw, sh, height) {
  const ratio = sw && sh ? sw / sh : 16 / 9;
  const c = document.createElement("canvas");
  c.height = height;
  c.width = Math.max(8, Math.round(height * ratio));
  const g = c.getContext("2d");
  try { g.drawImage(src, 0, 0, c.width, c.height); } catch { /* кадр ещё не готов */ }
  return c;
}

/** Раскадровка и «карта движения»: где в видео самое интересное. */
async function analyzeVideo(asset) {
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = asset.url;
  await once(v, "loadeddata", 20000);

  const dur = asset.duration;
  const n = clamp(Math.round(dur / .5), 6, 140);
  const step = dur / n;
  const dw = 48, dh = Math.max(8, Math.round((48 * asset.h) / asset.w));
  const dc = document.createElement("canvas"); dc.width = dw; dc.height = dh;
  const dctx = dc.getContext("2d", { willReadFrequently: true });
  const motion = new Float32Array(n);
  const thumbs = [];
  const every = Math.max(1, Math.ceil(n / 48));
  let prev = null;
  let lit = 0;

  for (let i = 0; i < n; i += 1) {
    const t = Math.min(dur - .04, (i + .5) * step);
    await seekEl(v, t);
    dctx.drawImage(v, 0, 0, dw, dh);
    const data = dctx.getImageData(0, 0, dw, dh).data;
    let diff = 0, sum = 0;
    for (let j = 0; j < data.length; j += 4) {
      const y = data[j] * .3 + data[j + 1] * .59 + data[j + 2] * .11;
      sum += y;
      if (prev) diff += Math.abs(y - prev[j >> 2]);
    }
    const lum = new Float32Array(data.length >> 2);
    for (let j = 0, k = 0; j < data.length; j += 4, k += 1) lum[k] = data[j] * .3 + data[j + 1] * .59 + data[j + 2] * .11;
    if (prev) motion[i] = diff / (dw * dh);
    prev = lum;
    lit += sum;
    if (i % every === 0) thumbs.push({ t, c: thumbFrom(v, asset.w, asset.h, 96) });
    asset.progress = (i + 1) / n;
    if (i % 6 === 0) notify();
  }
  motion[0] = motion[1] || 0;

  // Резкие скачки — склейки внутри исходника; их лучше не резать пополам.
  const sorted = Array.from(motion).sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)] || 0;
  const cuts = [];
  for (let i = 1; i < n; i += 1) if (motion[i] > median * 4 + 18) cuts.push(i * step);

  const max = Math.max(1e-6, ...motion);
  for (let i = 0; i < n; i += 1) motion[i] = Math.min(1, motion[i] / max);

  asset.motion = motion;
  asset.motionStep = step;
  asset.sceneCuts = cuts;
  asset.thumbs = thumbs;
  asset.blank = lit < 1;
  v.removeAttribute("src"); v.load();
}

async function analyzeAudioAsset(asset) {
  const ac = getAudioCtx();
  if (!ac) throw new Error("нет Web Audio");
  const buf = await asset.file.arrayBuffer();
  const audio = await new Promise((resolve, reject) => {
    const p = ac.decodeAudioData(buf, resolve, reject);
    if (p && p.then) p.then(resolve, reject);
  });
  asset.buffer = audio;
  asset.duration = audio.duration;
  asset.analysis = analyzeBeats(audio);
  asset.bpm = asset.analysis.bpm;
}

/**
 * Детектор битов.
 * 1) энергия баса и всей полосы кадрами по 512 сэмплов;
 * 2) онсет-огибающая: положительный прирост лог-энергии, минус локальное среднее;
 * 3) темп — автокорреляция огибающей с мягким предпочтением 120 BPM;
 * 4) сами биты — динамическое программирование (трекер Эллиса): доли
 *    выстраиваются по онсетам, но держат найденный период;
 * 5) сильная доля — та фаза из четырёх, где больше баса.
 */
function analyzeBeats(buffer) {
  const sr = buffer.sampleRate;
  const c0 = buffer.getChannelData(0);
  const c1 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
  const hop = 512;
  const frames = Math.max(8, Math.floor(buffer.length / hop));
  const fps = sr / hop;

  const bass = new Float32Array(frames);
  const full = new Float32Array(frames);
  const aL = Math.exp((-2 * Math.PI * 150) / sr);
  let lp = 0;
  for (let f = 0; f < frames; f += 1) {
    let eb = 0, ef = 0;
    const base = f * hop;
    const end = Math.min(buffer.length, base + hop);
    for (let i = base; i < end; i += 1) {
      const x = c1 ? (c0[i] + c1[i]) * .5 : c0[i];
      lp = (1 - aL) * x + aL * lp;
      eb += lp * lp;
      ef += x * x;
    }
    bass[f] = eb / hop;
    full[f] = ef / hop;
  }
  let maxB = 1e-12, maxF = 1e-12;
  for (let f = 0; f < frames; f += 1) { if (bass[f] > maxB) maxB = bass[f]; if (full[f] > maxF) maxF = full[f]; }

  // Онсеты отдельно по басу и по всей полосе: бит почти всегда держит бочка,
  // а яркие мелодические удары (колокол, хэты) только сбивают оценку темпа.
  const onB = new Float32Array(frames), onF = new Float32Array(frames);
  for (let f = 1; f < frames; f += 1) {
    onB[f] = Math.max(0, Math.log(1e-4 + bass[f] / maxB) - Math.log(1e-4 + bass[f - 1] / maxB));
    onF[f] = Math.max(0, Math.log(1e-4 + full[f] / maxF) - Math.log(1e-4 + full[f - 1] / maxF));
  }
  const W = Math.max(2, Math.round(fps * .2));
  const adapt = (src) => {
    const pre = new Float64Array(frames + 1);
    for (let f = 0; f < frames; f += 1) pre[f + 1] = pre[f] + src[f];
    const out = new Float32Array(frames);
    let mx = 1e-9;
    for (let f = 0; f < frames; f += 1) {
      const lo = Math.max(0, f - W), hi = Math.min(frames, f + W + 1);
      out[f] = Math.max(0, src[f] - (pre[hi] - pre[lo]) / (hi - lo));
      if (out[f] > mx) mx = out[f];
    }
    for (let f = 0; f < frames; f += 1) out[f] /= mx;
    return out;
  };
  const envB = adapt(onB), envF = adapt(onF);
  const envT = new Float32Array(frames);
  const env = new Float32Array(frames);
  for (let f = 0; f < frames; f += 1) { envT[f] = envB[f] * .78 + envF[f] * .22; env[f] = envB[f] * .62 + envF[f] * .38; }

  // Темп: «гребёнка» автокорреляции на 1-4 периода. Настоящая доля
  // повторяется на всех кратных, случайный мотив мелодии — нет.
  const ac = (lag) => {
    const li = Math.floor(lag), fr = lag - li;
    let acc = 0;
    for (let f = 0; f + li + 1 < frames; f += 2) acc += envT[f] * (envT[f + li] * (1 - fr) + envT[f + li + 1] * fr);
    return acc / Math.max(1, (frames - li) / 2);
  };
  const scoreOf = (bpm) => {
    const L = (60 * fps) / bpm;
    return ac(L) + .8 * ac(2 * L) + .55 * ac(3 * L) + .7 * ac(4 * L);
  };
  let bestBpm = 120, bestScore = -1;
  for (let bpm = 70; bpm <= 185; bpm += .25) {
    const prefer = Math.exp(-.5 * Math.pow(Math.log2(bpm / 122) / .6, 2));
    const sc = scoreOf(bpm) * (.55 + .45 * prefer);
    if (sc > bestScore) { bestScore = sc; bestBpm = bpm; }
  }
  // уточнение в окрестности лучшего кандидата
  for (let bpm = bestBpm - .3; bpm <= bestBpm + .3; bpm += .05) {
    const prefer = Math.exp(-.5 * Math.pow(Math.log2(bpm / 122) / .6, 2));
    const sc = scoreOf(bpm) * (.55 + .45 * prefer);
    if (sc > bestScore) { bestScore = sc; bestBpm = bpm; }
  }

  // биты
  const P = (60 * fps) / bestBpm;
  const alpha = 120;
  const score = new Float32Array(frames);
  const back = new Int32Array(frames).fill(-1);
  const lo = Math.round(P * .5), hi = Math.round(P * 2);
  for (let f = 0; f < frames; f += 1) {
    let best = 0, arg = -1;
    for (let p = f - hi; p <= f - lo; p += 1) {
      if (p < 0) continue;
      const pen = Math.log((f - p) / P);
      const v = score[p] - alpha * pen * pen;
      if (arg < 0 || v > best) { best = v; arg = p; }
    }
    score[f] = env[f] + (arg >= 0 ? best : 0);
    back[f] = arg;
  }
  let end = frames - 1, endBest = -Infinity;
  for (let f = Math.max(0, frames - Math.round(P)); f < frames; f += 1) if (score[f] > endBest) { endBest = score[f]; end = f; }
  const beatFrames = [];
  for (let f = end; f >= 0; f = back[f]) { beatFrames.push(f); if (back[f] < 0) break; }
  beatFrames.reverse();

  // Досчитываем сетку к самому началу трека, если трекер начал позже.
  while (beatFrames.length && beatFrames[0] - P > -P * .25 && beatFrames[0] - P >= 0) beatFrames.unshift(Math.round(beatFrames[0] - P));

  const beats = new Float64Array(beatFrames.length);
  for (let i = 0; i < beatFrames.length; i += 1) beats[i] = beatFrames[i] / fps;

  // сильная доля
  const phase = [0, 0, 0, 0];
  for (let i = 0; i < beatFrames.length; i += 1) {
    const f = beatFrames[i];
    let m = 0;
    for (let k = Math.max(0, f - 2); k <= Math.min(frames - 1, f + 3); k += 1) m = Math.max(m, bass[k]);
    phase[i % 4] += m;
  }
  const downIndex = phase.indexOf(Math.max(...phase));

  // громкость каждой доли — по ней ищем дроп и решаем, как часто резать
  const strength = new Float32Array(beats.length);
  let sMax = 1e-9;
  for (let i = 0; i < beats.length; i += 1) {
    const a = beatFrames[i];
    const b = i + 1 < beatFrames.length ? beatFrames[i + 1] : Math.min(frames, a + Math.round(P));
    let e = 0;
    for (let f = a; f < b; f += 1) e += full[f];
    strength[i] = Math.sqrt(e / Math.max(1, b - a));
    if (strength[i] > sMax) sMax = strength[i];
  }
  for (let i = 0; i < beats.length; i += 1) strength[i] /= sMax;

  // пики для волны на таймлайне: 100 значений на секунду
  const rate = 100;
  const nPeaks = Math.ceil(buffer.duration * rate);
  const peaks = new Float32Array(nPeaks);
  const per = sr / rate;
  for (let p = 0; p < nPeaks; p += 1) {
    let m = 0;
    const a = Math.floor(p * per), b = Math.min(buffer.length, Math.floor((p + 1) * per));
    for (let i = a; i < b; i += 4) { const x = Math.abs(c0[i]); if (x > m) m = x; }
    peaks[p] = m;
  }

  return { bpm: Math.round(bestBpm * 10) / 10, beats, downIndex, strength, peaks, peaksRate: rate, duration: buffer.duration };
}

function makeGenAsset(genId) {
  const gen = GENS[genId];
  const asset = { id: `gen-${genId}`, name: gen.name, kind: "gen", genId, duration: 40, w: 9, h: 16, demo: true, analyzed: true, progress: 1 };
  const c = document.createElement("canvas");
  c.width = 216; c.height = 384;

  asset.thumbs = [];
  for (let i = 0; i < 6; i += 1) {
    gen.draw(g, i * 6 + 1, c.width, c.height);
    const t = document.createElement("canvas"); t.width = 54; t.height = 96;
    t.getContext("2d").drawImage(c, 0, 0, 54, 96);

  const motion = new Float32Array(80).fill(.7);
  for (let i = 0; i < 80; i += 1) motion[i] = .5 + .5 * Math.sin(i * .7 + genId.length);

}

/** Синтезируем фонк-бит: 808, колокол, хэты, дроп на пятом такте. */
async function synthDemoTrack() {
  const bpm = 130, beat = 60 / bpm, bars = 18;
  const sr = 44100;
  const dur = bars * 4 * beat + 1.2;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const oc = new OAC(2, Math.ceil(dur * sr), sr);

  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .18;
  const master = oc.createGain(); master.gain.value = .9;
  master.connect(comp); comp.connect(oc.destination);

  const noise = oc.createBuffer(1, sr, sr);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i += 1) nd[i] = Math.random() * 2 - 1;

  const env = (param, t, peak, attack, decay) => {
    param.setValueAtTime(.0001, t);
    param.linearRampToValueAtTime(peak, t + attack);
    param.exponentialRampToValueAtTime(.0001, t + attack + decay);
  };
  const noiseHit = (t, type, freq, q, peak, decay) => {
    const s = oc.createBufferSource(); s.buffer = noise;
    const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = oc.createGain(); env(g.gain, t, peak, .002, decay);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * .5); s.stop(t + decay + .05);
  };

  const kick = (t, amp = 1) => {
    const o = oc.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(44, t + .12);
    const g = oc.createGain(); env(g.gain, t, amp, .003, .38);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .45);
    noiseHit(t, "highpass", 3000, .7, .25 * amp, .012);
  };
  const snare = (t, amp = .8) => {
    noiseHit(t, "bandpass", 1900, .8, amp, .2);
    const o = oc.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(150, t + .08);
    const g = oc.createGain(); env(g.gain, t, amp * .45, .002, .1);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .15);
  };
  const hat = (t, amp = .16, open = false) => noiseHit(t, "highpass", 7800, .6, amp, open ? .2 : .04);

  const shaper = oc.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i += 1) { const x = (i / 512) - 1; curve[i] = Math.tanh(x * 2.6); }
  shaper.curve = curve;
  const bassBus = oc.createGain(); bassBus.gain.value = .55;
  bassBus.connect(shaper); shaper.connect(master);
  const bass808 = (t, f, len, amp = 1) => {
    const o = oc.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f * 1.9, t); o.frequency.exponentialRampToValueAtTime(f, t + .06);
    const g = oc.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(amp, t + .006);
    g.gain.setValueAtTime(amp * .85, t + len * .7); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(g); g.connect(bassBus); o.start(t); o.stop(t + len + .02);
  };

  const bell = (t, f, amp = .13) => {
    const g = oc.createGain(); env(g.gain, t, amp, .002, .22);
    const bp = oc.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2.2; bp.Q.value = 1.1;
    for (const m of [1, 1.4815]) {
      const o = oc.createOscillator(); o.type = "square"; o.frequency.value = f * m;
      o.connect(bp); o.start(t); o.stop(t + .3);
    }
    bp.connect(g); g.connect(master);
  };

  const roots = [55, 43.65, 65.41, 49];
  const scale = [440, 523.25, 587.33, 659.25, 783.99, 880];
  const motif = [[0, 5], [3, 3], [6, 4], [8, 2], [10, 3], [13, 1], [14, 0]];
  const motif2 = [[0, 4], [2, 5], [4, 3], [7, 2], [8, 3], [11, 1], [12, 2], [14, 0]];

  for (let bar = 0; bar < bars; bar += 1) {
    const t0 = bar * 4 * beat;
    const s16 = beat / 4;
    const intro = bar < 4;
    const brk = bar >= 12 && bar < 14;
    const drop = !intro && !brk;
    const root = roots[bar % 4];

    for (const [step, note] of (bar % 2 ? motif2 : motif)) bell(t0 + step * s16, scale[note] * (bar % 4 === 3 ? 1.122 : 1), intro ? .1 : .13);

    if (drop) {
      for (let b = 0; b < 4; b += 1) kick(t0 + b * beat, b === 0 ? 1 : .88);
      snare(t0 + beat); snare(t0 + 3 * beat);
      for (let s = 0; s < 16; s += 1) hat(t0 + s * s16, s % 4 === 2 ? .2 : .1, s === 14);
      bass808(t0, root, beat * 2.6, 1);
      bass808(t0 + beat * 2.75, root * (bar % 2 ? 1.19 : 1), beat * 1.1, .8);
    } else if (intro) {
      for (let s = 0; s < 16; s += 2) hat(t0 + s * s16, .08);
      if (bar >= 2) bass808(t0, root, beat * 3.5, .7);
      if (bar === 3) for (let s = 0; s < 16; s += 1) snare(t0 + s * s16, .12 + s * .03);
    } else {
      bass808(t0, root, beat * 3.8, .6);
      const rollStep = bar === 13 ? 1 : 2;
      for (let s = 0; s < 16; s += rollStep) snare(t0 + s * s16, .1 + (bar - 12) * .2 + s * .012);
    }
  }

  const rendered = await oc.startRendering();
  return { buffer: rendered, bpm, url: URL.createObjectURL(wavBlob(rendered)) };
}

function wavBlob(buffer) {
  const ch = buffer.numberOfChannels, len = buffer.length, sr = buffer.sampleRate;
  const bytes = 44 + len * ch * 2;
  const view = new DataView(new ArrayBuffer(bytes));
  const str = (o, s) => { for (let i = 0; i < s.length; i += 1) view.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); view.setUint32(4, bytes - 8, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, ch, true);
  view.setUint32(24, sr, true); view.setUint32(28, sr * ch * 2, true); view.setUint16(32, ch * 2, true); view.setUint16(34, 16, true);
  str(36, "data"); view.setUint32(40, len * ch * 2, true);
  const data = [];
  for (let c = 0; c < ch; c += 1) data.push(buffer.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i += 1) {
    for (let c = 0; c < ch; c += 1) {
      const s = clamp(data[c][i], -1, 1);
      view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      o += 2;
    }
  }
  return new Blob([view], { type: "audio/wav" });
}

async function loadDemo() {
  for (const id of Object.keys(GENS)) S.assets.push(makeGenAsset(id));
  const track = await synthDemoTrack();
  if (track) {
    const asset = {
      id: "demo-beat", name: "Демо-бит · фонк", kind: "audio", url: track.url, duration: track.buffer.duration,
      buffer: track.buffer, demo: true, analyzed: true, progress: 1,
    };
    asset.analysis = analyzeBeats(track.buffer);
    asset.bpm = asset.analysis.bpm;
    S.assets.push(asset);
  }
}

/* ================================================================
   6. ритм: сетка долей относительно таймлайна
   ================================================================ */

function musicOf(plan) {
  const m = plan?.music && assetById(plan.music.assetId);
  return m && m.analysis ? m : null;
}

/** Биты в координатах ролика. Без музыки — ровные 120 BPM. */
function gridFor(plan, total) {
  const m = musicOf(plan);
  if (m && m.analysis.beats.length > 4) {
    const A = m.analysis;
    const off = plan.music.offset || 0;
    const beats = [], down = [], strength = [], index = [];
    for (let i = 0; i < A.beats.length; i += 1) {
      const t = A.beats[i] - off;
      if (t < -.02) continue;
      if (t > total + .02) break;
      beats.push(Math.max(0, t));
      down.push((((i - A.downIndex) % 4) + 4) % 4 === 0);
      strength.push(A.strength[i]);
      index.push(i - A.downIndex);
    }
    return { bpm: A.bpm, beats, down, strength, index, real: true };
  }
  const bpm = 120, p = 60 / bpm;
  const beats = [], down = [], strength = [], index = [];
  for (let i = 0; i * p <= total + .02; i += 1) { beats.push(i * p); down.push(i % 4 === 0); strength.push(.7); index.push(i); }
  return { bpm, beats, down, strength, index, real: false };
}

/** Индекс последнего бита не позже t (бинарный поиск). */
function beatIndexAt(grid, t) {
  const b = grid.beats;
  let lo = 0, hi = b.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (b[mid] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}

/** Лучший кусок трека: самый громкий, с бонусом за резкий вход (дроп). */
function pickSection(asset, length) {
  const A = asset.analysis;
  const beats = A.beats;
  if (!beats.length || A.duration <= length + .5) return beats.length ? Math.max(0, beats[A.downIndex % 4] || 0) : 0;
  const barLen = (60 / A.bpm) * 4;
  let best = 0, bestScore = -Infinity;
  for (let i = A.downIndex % 4; i < beats.length; i += 4) {
    const start = beats[i];
    if (start + length > A.duration + .05) break;
    let sum = 0, n = 0;
    for (let k = i; k < beats.length && beats[k] < start + length; k += 1) { sum += A.strength[k]; n += 1; }
    const mean = n ? sum / n : 0;
    let before = 0, nb = 0;
    for (let k = Math.max(0, i - 8); k < i; k += 1) { before += A.strength[k]; nb += 1; }
    let after = 0, na = 0;
    for (let k = i; k < Math.min(beats.length, i + 8); k += 1) { after += A.strength[k]; na += 1; }
    const jump = nb ? Math.max(0, after / na - before / nb) : .15;
    const score = mean + jump * .9 - (start < barLen * .5 ? .02 : 0);
    if (score > bestScore) { bestScore = score; best = start; }
  }
  return best;
}

/* ================================================================
   7. авто-монтаж: стиль + материал + ритм -> план
   ================================================================ */

function defaultOutput() {
  const strong = (navigator.hardwareConcurrency || 4) >= 6;
  return { aspect: "9:16", quality: strong ? 720 : 540, fps: 30, fit: "cover" };
}

/**
 * Выбор куска исходника нужной длины: максимум движения,
 * штраф за повторы и за склейки внутри исходника.
 */
function chooseWindow(asset, need, used, rand) {
  const dur = asset.duration || 0;
  if (asset.kind === "gen") return (rand() * Math.max(1, dur - need));
  if (dur <= need + .05) return 0;
  const motion = asset.motion;
  const step = asset.motionStep || .5;
  const candidates = [];
  const stride = Math.max(.2, Math.min(1, need / 3));
  for (let s = 0; s + need <= dur - .02; s += stride) candidates.push(s);
  candidates.push(Math.max(0, dur - need - .02));
  let best = 0, bestScore = -Infinity;
  for (const s of candidates) {
    let m = .5;
    if (motion) {
      const a = Math.floor(s / step), b = Math.max(a + 1, Math.ceil((s + need) / step));
      let sum = 0, n = 0;
      for (let i = a; i < Math.min(motion.length, b); i += 1) { sum += motion[i]; n += 1; }
      m = n ? sum / n : .5;
    }
    let overlap = 0;
    for (const [u0, u1] of used) overlap += Math.max(0, Math.min(u1, s + need) - Math.max(u0, s));
    let cut = 0;
    for (const c of asset.sceneCuts || []) if (c > s + .15 && c < s + need - .15) cut += 1;
    const score = m - (overlap / need) * 1.4 - cut * .6 + rand() * .18;
    if (score > bestScore) { bestScore = score; best = s; }
  }
  return best;
}

/**
 * Хореография: какой удар на какой доле.
 * Дроп (резкий рост громкости на сильной доле или громкий старт) — комбо.
 * Смена фразы — «фишка» стиля. Обычные доли — узор стиля по кругу,
 * сила зависит от громкости доли; в горячих местах добивка между долями.
 */
function choreograph(style, grid, length, rand) {
  const C = style.hits;
  if (!C) return [];
  const beatLen = 60 / grid.bpm;
  const hits = [];
  const B = grid.beats, E = grid.strength;
  const avg = (a, b) => { let s = 0, n = 0; for (let i = Math.max(0, a); i < Math.min(B.length, b); i += 1) { s += E[i] ?? .7; n += 1; } return n ? s / n : .7; };
  const shift = Math.floor(rand() * C.pattern.length);
  let lastDrop = -99;
  const add = (t, type, amt) => {
    const def = HITS[type];
    if (!def || t > length - .03) return;
    const dur = def.beat ? def.beat * beatLen : def.dur;
    hits.push({ t: Math.round(t * 1000) / 1000, type, amt: Math.round(clamp(amt, 0, 1.4) * 100) / 100, dur: Math.round(Math.min(dur, length - t) * 1000) / 1000 });
  };
  for (let i = 0; i < B.length; i += 1) {
    const t = B[i];
    if (t > length - .05) break;
    const e = E[i] ?? .7;
    const rel = grid.index[i];
    const down = grid.down[i];
    const phrase = ((rel % 8) + 8) % 8 === 0;
    const drop = (i === 0 && e > .5) || (down && avg(i, i + 4) - avg(i - 4, i) > .16 && i - lastDrop > 8);
    if (drop) {
      lastDrop = i;
      for (const type of C.drop) add(t, type, 1.1);
      continue;
    }
    if (phrase && i > 0 && C.phrase?.length) add(t, C.phrase[Math.floor(rand() * C.phrase.length)], .95);
    const every = e > .68 ? C.every[0] : C.every[1];
    if (((rel % every) + every) % every !== 0) continue;
    const combo = C.pattern[(Math.floor(i / every) + shift) % C.pattern.length];
    const amt = (.5 + .6 * e) * (down ? 1.12 : .9);
    for (const type of combo.split("+")) add(t, type, amt);
    if (C.half && e > .78 && i + 1 < B.length) add((t + B[i + 1]) / 2, C.half, .45);
  }
  hits.sort((a, b) => a.t - b.t);
  return hits;
}

/** Перемешать только удары, не трогая резы. */
function reChoreograph(plan, seed) {
  const style = STYLES[plan.style];
  if (!style) return;
  const total = plan.clips.reduce((s, c) => s + c.len, 0);
  plan.hits = choreograph(style, gridFor(plan, total), total, rng(seed));
}

/**
 * Собирает план с нуля.
 * opts: {style, length, look?, lookAmt?, power, texts:[{text, style?, anim?, pos?}], order?, keepOrig?, output?, seed}
 */
function autoEdit(opts) {
  const style = STYLES[opts.style] || STYLES.velocity;
  const visuals = orderVisuals(opts.order);
  if (!visuals.length) throw new Error("Нужны видео или фото.");

  const power = clamp(num(opts.power, 1), 0, 1.6);
  const rand = rng(opts.seed || 1);
  const musicAsset = opts.musicId ? assetById(opts.musicId) : (musicAssets().find((a) => !a.demo && a.analysis) || musicAssets().find((a) => a.analysis) || null);
  const output = { ...defaultOutput(), ...(S.plan?.output || {}), ...(opts.output || {}) };

  let length = opts.length === "track" ? (musicAsset ? musicAsset.duration : 30) : num(opts.length, 15);
  length = clamp(length, 3, 300);

  let offset = 0;
  if (musicAsset) {
    if (opts.length === "track") { offset = 0; length = Math.min(300, musicAsset.duration - .05); }
    else offset = pickSection(musicAsset, length);
    length = Math.min(length, musicAsset.duration - offset);
  }

  const draft = { music: musicAsset ? { assetId: musicAsset.id, offset } : null };
  const grid = gridFor(draft, length);

  // точки реза по долям
  const cuts = [0];
  let i = 0;
  while (i < grid.beats.length) {
    const energy = grid.strength[i] ?? .7;
    const every = energy > .72 ? style.cut[0] : style.cut[1];
    const nextIdx = i + every;
    const t = nextIdx < grid.beats.length ? grid.beats[nextIdx] : length;
    if (t - cuts[cuts.length - 1] < .18) { i = nextIdx; continue; }
    if (t >= length - .12) break;
    cuts.push(t);
    i = nextIdx;
  }
  cuts.push(length);

  const used = new Map();
  const clips = [];
  let cursorAsset = 0;
  const seqAssets = [];
  // равномерно перемешанная очередь исходников, без двух одинаковых подряд
  while (seqAssets.length < cuts.length) {
    const round = visuals.slice();
    if (!opts.order) for (let k = round.length - 1; k > 0; k -= 1) { const j = Math.floor(rand() * (k + 1)); [round[k], round[j]] = [round[j], round[k]]; }
    if (seqAssets.length && round.length > 1 && round[0] === seqAssets[seqAssets.length - 1]) round.push(round.shift());
    seqAssets.push(...round);
  }

  for (let k = 0; k + 1 < cuts.length; k += 1) {
    const at = cuts[k], len = cuts[k + 1] - at;
    const asset = seqAssets[cursorAsset++];
    const bi = beatIndexAt(grid, at + .01);
    const rel = bi >= 0 ? grid.index[bi] : k;
    const info = {
      kind: asset.kind,
      down: bi >= 0 ? grid.down[bi] : k % 4 === 0,
      phrase: rel % 8 === 0 && k > 0,
      energy: bi >= 0 ? grid.strength[bi] : .7,
    };

    const pickOf = (pool) => pool[Math.floor(rand() * pool.length)];
    let ramp = asset.kind === "image" ? "none" : pickOf(style.ramps);
    // перед сменой фразы — фриз-кадр: классический «стоп» перед ударом
    const nextBi = beatIndexAt(grid, at + len + .01);
    const nextPhrase = nextBi >= 0 && ((grid.index[nextBi] % 8) + 8) % 8 === 0 && k + 2 < cuts.length;
    if (nextPhrase && asset.kind !== "image" && style.hits && style.speed >= 1 && rand() < .45) ramp = "freeze";
    const baseSpeed = style.speed * (asset.kind === "video" ? 1 : 1);
    let span = len * baseSpeed * rampMean(ramp);
    let src = 0;
    if (asset.kind === "video") {
      span = Math.min(span, Math.max(.2, asset.duration - .05));
      const list = used.get(asset.id) || [];
      src = chooseWindow(asset, span, list, rand);
      list.push([src, src + span]);
      used.set(asset.id, list);
    } else if (asset.kind === "gen") {
      src = chooseWindow(asset, span, [], rand);
    }

    const trType = k === 0 ? "cut" : pickOf(info.phrase ? style.trPhrase : style.tr);
    const effects = [];
    if (style.hits && asset.kind !== "image" && rand() < .12) effects.push({ type: "mirror", amt: 1 });
    if (asset.kind === "image") effects.push({ type: k % 2 ? "zoomout" : "zoomin", amt: .6 });

    clips.push({
      id: uid("c"), assetId: asset.id, len, src, span, ramp,
      effects,
      tr: { type: trType, dur: TRANSITIONS[trType].dur },
      vol: 1,
    });
  }

  // надписи
  const texts = [];
  const [tStyle, tAnim] = style.text;
  const firstDrop = grid.beats.find((b, idx) => grid.down[idx] && b > .01) ?? 0;
  for (const [n, t] of (opts.texts || []).entries()) {
    const body = String(t.text || "").trim().slice(0, 120);
    if (!body) continue;
    const anim = TEXT_ANIMS[t.anim] ? t.anim : tAnim;
    const words = body.split(/\s+/).length;
    const beatLen = 60 / grid.bpm;
    const wantLen = anim === "beat" ? Math.max(2, (words + 2) * beatLen) : Math.max(2.2, beatLen * 4);
    let at = n === 0 ? 0 : t.where === "end" ? Math.max(0, length - wantLen) : firstDrop + n * wantLen;
    if (t.where === "drop") at = firstDrop;
    at = clamp(at, 0, Math.max(0, length - .5));
    texts.push({
      id: uid("t"), text: body, at, len: Math.min(wantLen, length - at),
      style: TEXT_STYLES[t.style] ? t.style : tStyle,
      anim, pos: ["top", "center", "bottom"].includes(t.pos) ? t.pos : (anim === "beat" ? "center" : "bottom"),
      size: 1, color: /^#[0-9a-f]{6}$/i.test(t.color || "") ? t.color : "#ffffff",
    });
  }

  const lookId = LOOKS[opts.look] ? opts.look : style.look[0];
  const scaled = (obj) => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, clamp(v * power, 0, 1)]));
  const hits = choreograph(style, grid, length, rand);

  return {
    v: 2,
    output,
    clips,
    texts,
    music: musicAsset ? { assetId: musicAsset.id, offset, vol: .9, fadeIn: offset > .5 ? .25 : 0, fadeOut: 1.2 } : null,
    orig: { keep: opts.keepOrig ?? (musicAsset ? style.keepOrig : true), vol: musicAsset ? .35 : 1 },
    look: { id: lookId, amt: opts.lookAmt ?? style.look[1] },
    beat: { zoom: 0, shake: 0, flash: 0, rgb: 0, blur: 0, every: 1 },
    hits,
    hitPower: power,
    flashColor: style.flash || "#ffffff",
    overlay: scaled(style.overlay),
    style: opts.style,
    power,
    length: opts.length,
    seed: opts.seed,
    notes: opts.notes || "",
    by: opts.by || "local",
  };
}

function orderVisuals(order) {
  const all = visualAssets();
  const real = all.filter((a) => !a.demo);
  const pool = real.length ? real : all;
  if (!Array.isArray(order) || !order.length) return pool;
  const picked = [];
  for (const id of order) { const a = pool.find((x) => x.id === id); if (a && !picked.includes(a)) picked.push(a); }
  for (const a of pool) if (!picked.includes(a)) picked.push(a);
  return picked;
}

/* ================================================================
   8. режиссёр: фраза -> решение (Claude или разбор слов)
   ================================================================ */

const STYLE_WORDS = [
  ["phonk", ["фонк", "phonk", "дрифт", "агрессив", "злой", "brazil", "бразил"]],
  ["amv", ["аниме", "anime", "amv", "амв", "манга", "джоджо"]],
  ["hard", ["хард", "шейк", "shake", "жёстк", "жестк", "мощн", "имб", "разнос"]],

  ["aesthetic", ["эстетик", "aesthetic", "нежн", "мягк", "сон", "мечт", "романт", "лофи", "lofi", "чилл", "chill"]],
  ["cinematic", ["кино", "киношн", "cinematic", "фильм", "трейлер", "эпичн"]],

];

  ["bw", ["чб", "ч/б", "чёрно-бел", "черно-бел", "монохром"]],
  ["teal", ["тил", "teal", "голливуд"]],
  ["sunset", ["закат", "тёпл", "тепл", "golden", "солн"]],
  ["ice", ["холод", "лёд", "лед", "зим", "синий"]],
  ["faded", ["выцвет", "пастел", "бледн"]],
