plugins {
    id 'com.android.application'
}

// номер сборки приходит из GitHub Actions (-PversionCode=N), чтобы новый APK ставился поверх старого
def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'kz.sauda.app'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.sauda.app'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // ключ подписи лежит в репозитории: каждое обновление ставится поверх, вход в аккаунт не слетает
    signingConfigs {
        release {
            storeFile file('sauda.keystore')
            storePassword 'saudakz'
            keyAlias 'sauda'
            keyPassword 'saudakz'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/webapp"
    }
}

// маркетплейс (html/css/js/иконки) берём из папки market/ — APK всегда совпадает с сайтом
tasks.register('copyWebApp', Copy) {
    from(rootProject.file('../market')) {
        exclude 'README.md'
    }
    into "$buildDir/webapp"
}
preBuild.dependsOn 'copyWebApp'

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
